<!doctype html>
<html lang="zh">
<head>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>影子跟读 · 如何比 99% 的人更清晰地表达</title>
<style>
:root{
  --bg:#111214; --fg:#f2f3f5; --dim:#8b8f96; --line:#2a2d32;
  --accent:#c9a227; --card:#1a1c1f; --mark:#e8c14a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;width:100%;overflow-x:hidden}
body{
  background:var(--bg);color:var(--fg);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  overscroll-behavior:none;
}
header{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
header a.t{font-size:13px;color:var(--dim);flex:1 1 auto;min-width:0;text-decoration:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header a.t:active{color:var(--fg)}
header button{
  flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--fg);
  border-radius:8px;padding:7px 10px;font-size:13px;white-space:nowrap;
}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 8px;min-height:0}
#idx{font-size:12px;letter-spacing:.1em;color:var(--accent);margin-bottom:12px}
#cue{
  font-size:clamp(21px,6vw,32px);line-height:1.55;font-weight:500;
  overflow-wrap:anywhere;
}
/* rough order matters: .k (candidate) < .ph (chunk) < .on (she marked it) */
.w{display:inline}
.w.ph{border-bottom:2px dashed rgba(201,162,39,.42)}
.w.k{color:#9fd6d0;border-bottom:1px dotted rgba(159,214,208,.45)}
.w.on{color:var(--mark);font-weight:600;border-bottom:2px solid var(--mark)}
#hint{margin-top:14px;font-size:12px;color:#5c6169;line-height:1.7}
#vid{display:none;width:calc(100% - 36px);margin:10px 18px 0;border-radius:12px;background:#000;
  aspect-ratio:16/9;object-fit:cover}
#vfull{display:none;margin:6px 18px 0;text-align:right;font-size:12.5px;color:#7f868f}
#zhbox{margin:14px 18px 0;padding:11px 13px;border:1px dashed var(--line);border-radius:10px;cursor:pointer}
#zhbox .zhlbl{display:block;font-size:11.5px;letter-spacing:.06em;color:#7f868f;margin-bottom:5px}
#zhbox .zhtext{display:block;font-size:15.5px;line-height:1.6;color:#d7dae0}
#zhbox.masked .zhtext{filter:blur(6.5px);opacity:.55;-webkit-user-select:none;user-select:none}
#zhbox:not(.masked) .zhlbl{color:#8fd3c7}
#zhbox:not(.masked) .zhlbl::after{content:"（点一下收起）"}
#neigh{margin-top:20px;font-size:15px;line-height:1.6;color:var(--dim);overflow-wrap:anywhere}
#neigh .lbl{font-size:11px;letter-spacing:.1em;color:#5c6169;display:block;margin:14px 0 3px}
#neigh .p{opacity:.6}
#flash{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.88);padding:18px 26px;border-radius:16px;
  font-size:19px;display:none;text-align:center;z-index:40;white-space:nowrap;
}
footer{
  flex:0 0 auto;border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);
}
.row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.row+.row{margin-top:8px}
button.b{
  flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--fg);
  border-radius:12px;padding:14px 6px;font-size:16px;font-weight:500;
  min-height:52px;display:flex;align-items:center;justify-content:center;gap:5px;
  white-space:nowrap;
}
button.b:active{background:#25282d}
button.b.pri{background:var(--accent);color:#161616;border-color:var(--accent);font-weight:600}
button.b.on{background:rgba(201,162,39,.20);border-color:var(--accent);color:var(--accent)}
button.b:disabled{opacity:.32}
#list,#words{display:none;position:fixed;inset:0;background:var(--bg);overflow-y:auto;
  -webkit-overflow-scrolling:touch;padding:calc(12px + env(safe-area-inset-top)) 0 40px}
#list{z-index:50} #words{z-index:55}
#list .hdr,#words .hdr{display:flex;align-items:center;gap:10px;padding:0 14px 12px;
  position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line)}
#list .hdr button,#words .hdr button{background:none;border:1px solid var(--line);color:var(--fg);
  border-radius:8px;padding:8px 12px;font-size:14px}
#list ol{list-style:none;margin:0;padding:0}
#list li{padding:12px 16px;border-bottom:1px solid #1e2024;font-size:17px;line-height:1.55}
#toc{padding:6px 12px 4px}
#toc .ch{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0;
  color:var(--fg);font-size:15.5px;line-height:1.45}
#toc .ch .tt{color:#e8c46a;font-variant-numeric:tabular-nums;font-size:12.5px;margin-right:8px}
#toc .ch .tn{color:#5c6169;font-size:12px;margin-left:6px}
#toc .ch.cur{border-color:#c9a227;background:rgba(201,162,39,.10)}
.sectlbl{padding:16px 16px 4px;font-size:12px;letter-spacing:.08em;color:#5c6169}
#list li .ts{display:block;font-size:11px;color:#5c6169;font-variant-numeric:tabular-nums;margin-bottom:3px}
#list li.cur{background:rgba(201,162,39,.10)}
#wlist{padding:12px 16px;font-size:19px;line-height:1.6}
#wlist .wd{padding:11px 2px;border-bottom:1px solid #1e2024}
#wlist .wd b{display:block;color:#e8c46a;font-size:15px}
#wlist .wd span{display:block;margin-top:3px;font-size:13.5px;line-height:1.5;color:#aab0b8}
#wlist .wd .cnt{color:#7f868f;font-size:12px;margin-top:4px}
</style>
</head>
<body>
<header>
  <a class="t" href="index.html" title="回到材料列表">‹ 如何比 99% 的人更清晰地表达</a>
  <button id="save" onclick="fetch(location.href).then(r=>r.blob()).then(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=document.title.replace(/·/g,'-').replace(/\s+/g,'')+'.html';document.body.appendChild(a);a.click();a.remove()}).catch(e=>alert('存不下来：'+e.message))">存到手机</button>
  <button id="open">目录</button>
</header>

<main id="scroll">
  <div id="idx"></div>
  <video id="vid" muted playsinline preload="metadata" webkit-playsinline></video>
<div id="vfull" style="display:none">⤢ 放大画面</div>
  <div id="cue"></div>
  <div id="zhbox" class="masked"><span class="zhlbl">中文 · 点一下看</span><span class="zhtext"></span></div>
  <div id="hint">
    点一个<b style="color:#9fd6d0">单词</b> → 标记它并出释义；点一个<b style="color:#e8c46a">语块</b>（虚线下划线那种，如 sought after）→ 整块一起标记。<br>
    标过的词，<b style="color:#8b8f96">别的材料里也会亮着</b>（生词本是共用的）。
  </div>
  <div id="neigh">
    <span class="lbl">上 一 句</span><div class="p" id="prev"></div>
    <span class="lbl">下 一 句</span><div id="next"></div>
  </div>
</main>

<footer>
  <div class="row">
    <button class="b" id="back">← 上一句</button>
    <button class="b pri" id="play">▶ 播这句</button>
    <button class="b" id="fwd">下一句 →</button>
  </div>
  <div class="row">
    <button class="b" id="loop">🔁 循环</button>
    <button class="b" id="shadow">🎙 跟读留白</button>
    <button class="b" id="rate">速率 1×</button>
  </div>
</footer>

<div id="flash"></div>

<style>
#def{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:#16181c;border-top:1px solid #2a2d33;padding:14px 16px 16px;box-shadow:0 -8px 24px rgba(0,0,0,.45)}
#def .dw{font-size:17px;font-weight:600;color:#e8c46a;margin-bottom:6px}
#def .dd{font-size:14.5px;line-height:1.55;color:#d7dae0;max-height:40vh;overflow-y:auto}
#def button{margin-top:10px;background:none;border:1px solid #2f333a;color:#9aa0a8;border-radius:8px;padding:6px 12px;font-size:13px}
</style>
<div id="def"></div>

<div id="list">
  <div class="hdr">
    <button id="close">✕ 关闭</button>
    <span style="flex:1;font-size:14px;color:var(--dim)">全文 · 点一句跳到那里（点词只标词）</span>
  </div>
  <div id="toc"></div>
  <div class="sectlbl" id="ollbl">全文逐句</div>
  <ol id="ol"></ol>
</div>

<div id="words">
  <div class="hdr">
    <button id="wclose">✕ 关闭</button>
    <span style="flex:1;font-size:14px;color:var(--dim)">我的生词本 · 点一个取消标记</span>
  </div>
  <div id="wlist"></div>
</div>

<audio id="au" preload="auto" playsinline></audio>
<script id="aud" type="text/plain"></script>

<script>
const S = [{"i": 0, "start": 0.0, "end": 5.89, "dur": 5.89, "text": "Every time you speak, people are making a decision: is this someone I can trust or is this someone that I tune out of?", "zh": "每次你开口说话，人们都在做决定：这个人我能信任吗，还是这个人我得忽略掉？", "clip": "clips/articulate/000.mp4", "html": "<span class=\"w\" data-w=\"every\">Every</span> <span class=\"w\" data-w=\"time\">time</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"speak\">speak,</span> <span class=\"w\" data-w=\"people\">people</span> <span class=\"w\" data-w=\"are\">are</span> <span class=\"w\" data-w=\"making\">making</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"decision\">decision:</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"this\">this</span> <span class=\"w\" data-w=\"someone\">someone</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w k\" data-w=\"trust\">trust</span> <span class=\"w\" data-w=\"or\">or</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"this\">this</span> <span class=\"w\" data-w=\"someone\">someone</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w ph\" data-w=\"tune out of\">tune out of?</span>"}, {"i": 1, "start": 5.89, "end": 14.63, "dur": 8.74, "text": "My company, Acquisition.com, taught me this. Leadership lives or dies by your communication if you cannot communicate like a leader, then you will never be trusted like one.", "zh": "我的公司Acquisition.com教会了我这一点。领导力成也沟通，败也沟通——如果你不能像领导者那样沟通，那你就永远不会被当作领导者来信任。", "clip": "clips/articulate/001.mp4", "html": "<span class=\"w\" data-w=\"my\">My</span> <span class=\"w\" data-w=\"company\">company,</span> <span class=\"w\" data-w=\"acquisitioncom\">Acquisition.com,</span> <span class=\"w\" data-w=\"taught\">taught</span> <span class=\"w\" data-w=\"me\">me</span> <span class=\"w\" data-w=\"this\">this.</span> <span class=\"w\" data-w=\"leadership\">Leadership</span> <span class=\"w ph\" data-w=\"lives or dies by\">lives or dies by</span> <span class=\"w\" data-w=\"your\">your</span> <span class=\"w\" data-w=\"communication\">communication</span> <span class=\"w\" data-w=\"if\">if</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"cannot\">cannot</span> <span class=\"w\" data-w=\"communicate\">communicate</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"leader\">leader,</span> <span class=\"w\" data-w=\"then\">then</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"will\">will</span> <span class=\"w\" data-w=\"never\">never</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"trusted\">trusted</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w\" data-w=\"one\">one.</span>"}, {"i": 2, "start": 14.63, "end": 23.55, "dur": 8.92, "text": "So let me show you the five behaviors that are quietly killing your executive presence and exactly what to do instead, number one is stop over explaining.", "zh": "所以让我来给你展示五个正在悄悄毁掉你高管气场的习惯，以及到底该怎么做。第一，别再过度解释了。", "clip": "clips/articulate/002.mp4", "html": "<span class=\"w\" data-w=\"so\">So</span> <span class=\"w\" data-w=\"let\">let</span> <span class=\"w\" data-w=\"me\">me</span> <span class=\"w\" data-w=\"show\">show</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"five\">five</span> <span class=\"w\" data-w=\"behaviors\">behaviors</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"are\">are</span> <span class=\"w k\" data-w=\"quietly\">quietly</span> <span class=\"w\" data-w=\"killing\">killing</span> <span class=\"w\" data-w=\"your\">your</span> <span class=\"w ph\" data-w=\"executive presence\">executive presence</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"exactly\">exactly</span> <span class=\"w ph\" data-w=\"what to do instead\">what to do instead,</span> <span class=\"w\" data-w=\"number\">number</span> <span class=\"w\" data-w=\"one\">one</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"stop\">stop</span> <span class=\"w\" data-w=\"over\">over</span> <span class=\"w\" data-w=\"explaining\">explaining.</span>"}, {"i": 3, "start": 23.55, "end": 28.11, "dur": 4.56, "text": "You can have the best ideas in the room, but if you can't actually communicate them clearly.", "zh": "你可能是房间里想法最好的人，但如果你没法把它们清楚地表达出来。", "clip": "clips/articulate/003.mp4", "html": "<span class=\"w\" data-w=\"you\">You</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"best\">best</span> <span class=\"w\" data-w=\"ideas\">ideas</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"room\">room,</span> <span class=\"w\" data-w=\"but\">but</span> <span class=\"w\" data-w=\"if\">if</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"can&#x27;t\">can&#x27;t</span> <span class=\"w\" data-w=\"actually\">actually</span> <span class=\"w\" data-w=\"communicate\">communicate</span> <span class=\"w\" data-w=\"them\">them</span> <span class=\"w\" data-w=\"clearly\">clearly.</span>"}, {"i": 4, "start": 28.11, "end": 33.81, "dur": 5.7, "text": "You will always follow somebody who can and the thing is is that trust erodes with every weak behavior that you let slide.", "zh": "你永远会追随那个能表达清楚的人。问题是，你每放任一个软弱的行为，信任就会一点点被侵蚀。", "clip": "clips/articulate/004.mp4", "html": "<span class=\"w\" data-w=\"you\">You</span> <span class=\"w\" data-w=\"will\">will</span> <span class=\"w\" data-w=\"always\">always</span> <span class=\"w\" data-w=\"follow\">follow</span> <span class=\"w\" data-w=\"somebody\">somebody</span> <span class=\"w\" data-w=\"wh \">you</span> <span class=\"w\" data-w=\"look\">look</span> <span class=\"w\" data-w=\"weak\">weak.</span>"}, {"i": 6, "start": 38.9, "end": 43.61, "dur": 4.71, "text": "The most intelligent people in the room, they rarely say the most, they actually usually say the least.", "zh": "房间里最聪明的人，他们很少说得最多，他们通常说得最少。", "clip": "clips/articulate/006.mp4", "html": "<span class=\"w\" data-w=\"the\">The</span> <span class=\"w\" data-w=\"most\">most</span> <span class=\"w k\" data-w=\"intelligent\">intelligent</span> <span class=\"w\" data-w=\"people\">people</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"room\">room,</span> <span class=\"w\" data-w=\"they\">they</span> <span class=\"w k\" data-w=\"rarely\">rarely</span> <span class=\"w\" data-w=\"say\">say</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"most\">most,</span> <span class=\"w\" data-w=\"they\">they</span> <span class=\"w\" data-w=\"actually\">actually</span> <span class=\"w\" data-w=\"usually\">usually</span> <span class=\"w\" data-w=\"say\">say</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"least\">least.</span>"}, {"i": 7, "start": 43.61, "end": 48.51, "dur": 4.9, "text": "Every word that they say lands with people better. And I used to be the queen of overexplaining.", "zh": "他们说的每个字都更能让人听进去。而我以前就是过度解释的女王。", "clip": "clips/articulate/007.mp4", "html": "<span class=\"w\" data-w=\"every\">Every</span> <span class=\"w\" data-w=\"word\">word</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"they\">they</span> <span class=\"w\" data-w=\"say\">say</span> <span class=\"w ph\" data-w=\"lands with\">lands with</span> <span class=\"w\" data-w=\"people\">people</span> <span class=\"w\" data-w=\"better\">better.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"used\">used</span> <span class=\"w\ ass=\"w\" data-w=\"take\">take</span> <span class=\"w\" data-w=\"their\">their</span> <span class=\"w k\" data-w=\"responsibility\">responsibility</span> <span class=\"w\" data-w=\"or\">or</span> <span class=\"w\" data-w=\"don&#x27;t\">don&#x27;t</span> <span class=\"w\" data-w=\"talk\">talk</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"me\">me</span> <span class=\"w\" data-w=\"about\">about</span> <span class=\"w\" data-w=\"it\">it.</span>"}, {"i": 81, "start": 551.57, "end": 557.46, "dur": 5.89, "text": "And I remember in that moment she was like completely shocked and I was like,\" well, listen, if you want to talk to me about it, I'm going to have an opinion about it.", "zh": "我记得那一刻她整个人都懵了，我就说，行吧，你要是想跟我聊这事，我就会有自己的看法。", "clip": "clips/articulate/081.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"remember\">remember</span> <span class=\"w ph\" data-w=\"in that moment\">in that moment</span> <span class=\"w\" data-w=\"she\">she</span> <span class=\"w\" data-w=\"was\">was</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w\" data-w=\"completely\">completely</span> <span class=\"w k\" data-w=\"shocked\">shocked</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"was\">was</span> <span class=\"w\" data-w=\"like\">like,&quot;</span> <span class=\"w\" data-w=\"well\">well,</span> <span class=\"w\" data-w=\"listen\">listen,</span> <span class=\"w\" data-w=\"if\">if</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"want\">want</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"talk\">talk</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"me\">me</span> <span class=\"w\" data-w=\"about\">about</span> <span class=\"w\" data-w=\"it\">it,</span> <span class=\"w\" data-w=\"i&#x27;m\">I&#x27;m</span> <span clas ": 4.68, "text": "And I remember it was like the first time I broke the seal with that person specifically who'd been a friend.", "zh": "我记得那好像是我第一次跟那个人——特别是一个朋友——把话挑明了。", "clip": "clips/articulate/083.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"remember\">remember</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"was\">was</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"first\">first</span> <span class=\"w\" data-w=\"time\">time</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w ph\" data-w=\"broke the seal\">broke the seal</span> <span class=\"w\" data-w=\"with\">with</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"person\">person</span> <span class=\"w k\" data-w=\"specifically\">specifically</span> <span class=\"w\" data-w=\"who&#x27;d\">who&#x27;d</span> <span class=\"w\" data-w=\"been\">been</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"friend\">friend.</span>"}, {"i": 84, "start": 567.13, "end": 571.78, "dur": 4.65, "text": "I felt fed up with her and what I realized in that moment is I walked away having more respect from myself.", "zh": "我对她真是受够了，而那一刻我意识到，我走开之后反而更尊重自己了。", "clip": "clips/articulate/084.mp4", "html": "<span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"felt\">felt</span> <span class=\"w ph\" data-w=\"fed up with\">fed up with</span> <span class=\"w\" data-w=\"her\">her</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"realized\">realized</span> <span class=\"w ph\" data-w=\"in that moment\">in that moment</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w ph\" data-w=\"walked away\">walked away</span> <span clas asshole\">asshole,</span> <span class=\"w\" data-w=\"but\">but</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"want\">want</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"confront\">confront</span> <span class=\"w\" data-w=\"them\">them</span> <span class=\"w ph\" data-w=\"with composure\">with composure,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"means\">means</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"want\">want</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w k\" data-w=\"honest\">honest</span> <span class=\"w\" data-w=\"because\">because</span> <span class=\"w\" data-w=\"when\">when</span> <span class=\"w\" data-w=\"you&#x27;re\">you&#x27;re</span> <span class=\"w k\" data-w=\"honest\">honest,</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w ph\" data-w=\"builds trust\">builds trust.</span>"}, {"i": 88, "start": 594.75, "end": 602.84, "dur": 8.09, "text": "When you soften the truth, when you avoid the truth, you create confusion, and when you name names, you become the person to look for when you want solutions.", "zh": "当你软化真相、回避真相，你制造的是混乱；而当你把话挑明，你就成了别人想找解决方案时会来找的人。", "clip": "clips/articulate/088.mp4", "html": "<span class=\"w\" data-w=\"when\">When</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w ph\" data-w=\"soften the truth\">soften the truth,</span> <span class=\"w\" data-w=\"when\">when</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w ph\" data-w=\"avoid the truth\">avoid the truth,</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w ph\" data-w=\"create confusion\">create confusion,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"when\">when</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w ph\" data-w=\"name names\">name names,</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"become\">become</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"person\">person</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"look for\">look for</span> <span class=\"w\" data-w=\"when\">when</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"want\">want</span> <span class=\"w k\" data-w=\"solutions\">solutions.</span>"}, {"i": 89, "start": 602.84, "end": 609.15, "dur": 6.31, "text": "And great leaders don't avoid discomfort, they walk towards it Number five is stop being inconsistent.", "zh": "优秀的领导者不回避不适，他们会迎上去。第五点：别再反复无常。", "clip": "clips/articulate/089.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"great\">great</span> <span class=\"w\" data-w=\"leaders\">leaders</span> <span class=\"w\" data-w=\"don&#x27;t\">don&#x27;t</span> <span class=\"w ph\" data-w=\"avoid discomfort\">avoid discomfort,</span> <span class=\"w\" data-w=\"they\">they</span> <span class=\"w ph\" data-w=\"walk towards it\">walk towards it</span> <span class=\"w\" data-w=\"number\">Number</span> <span class=\"w\" data-w=\"five\">five</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"stop\">stop</span> <span class=\"w\" data-w=\"being\">being</span> <span class=\"w k\" data-w=\"inconsistent\">inconsistent.</span>"}, {"i": 90, "start": 609.15, "end": 618.53, "dur": 9.38, "text": "You cannot be trusted to lead others if you can't regulate yourself if your mood dictates how you lead, you are not leading, you're just reacting to your own emotions.", "zh": "如果你管不住自己，就没法让人信任你来领导；如果你的情绪决定你怎么领导，那你就不是在领导，只是在对自己的情绪做反应。", "clip": "clips/articulate/090.mp4", "html": "<span class=\"w\" data-w=\"you\">You</span> <span class=\"w\" data-w=\"cannot\">cannot</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"trusted\">trusted</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"lead\">lead</span> <span class=\"w\" data-w=\"others\">others</span> <span class=\"w\" data-w=\"if\">if</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"can&#x27;t\">can&#x27;t</span> <span class=\"w ph\" data-w=\"regulate yourself\">regulate yourself</span> <span class=\"w\" data-w=\"if\">if</span> <span class=\"w\" data-w=\"your\">your</span> <span class=\"w\" data-w=\"mood\">mood</span> <span class=\"w k\" data-w=\"dictates\">dictates</span> <span class=\"w\" data-w=\"how\">how</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"lead\">lead,</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"are\">are</span> <span class=\"w\" data-w=\"not\">not</span> <span class=\"w\" data-w=\"leading\">leading,</span> <span class=\"w\" data-w=\"you&#x27;re\">you&#x27;re</span> <span class=\"w\" data-w=\"just\">just</span> <span class=\"w ph\" data-w=\"reacting to\">reacting to</span> <span class=\"w\" data-w=\"your\">your</span> <span class=\"w\" data-w=\"own\">own</span> <span class=\"w k\" data-w=\"emotions\">emotions.</span>"}, {"i": 91, "start": 618.53, "end": 622.68, "dur": 4.15, "text": "Executive presence is earned through emotional predictability for example.", "zh": "比如说，高管气场是靠情绪上的可预测性赢得的。", "clip": "clips/articulate/091.mp4", "html": "<span class=\"w ph\" data-w=\"executive presence\">Executive presence</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"earned\">earned</span> <span class=\"w\" data-w=\"through\">through</span> <span class=\"w ph\" data-w=\"emotional predictability\">emotional predictability</span> <span class=\"w ph\" data-w=\"for example\">for example.</span>"}, {"i": 92, "start": 622.68, "end": 628.12, "dur": 5.44, "text": "When I was working in a gym as a personal trainer, I had a boss and he would come in and it was like, no matter.\"", "zh": "我在健身房做私人教练的时候，有个老板，他一来，就好像不管。", "clip": "clips/articulate/092.mp4", "html": "<span class=\"w\" data-w=\"when\">When</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"was\">was</span> <span class=\"w\" data-w=\"working\">working</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"gym\">gym</span> <span class=\"w\" data-w=\"as\">as</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w ph\" data-w=\"personal trainer\">personal trainer,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"had\">had</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"boss\">boss</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"he\">he</span> <span class=\"w\" data-w=\"would\">would</span> <span class=\"w ph\" data-w=\"come in\">come in</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"was\">was</span> <span class=\"w\" data-w=\"like\">like,</span> <span class=\"w ph\" data-w=\"no matter\">no matter.&quot;</span>"}, {"i": 93, "start": 628.12, "end": 635.09, "dur": 6.97, "text": "What we had done, no matter how good we were doing, no matter how happy everybody was, it was like depending on whatever happened with him at home.", "zh": "我们做了什么、做得多好、大家多开心，都好像取决于他在家里发生了什么。", "clip": "clips/articulate/093.mp4", "html": "<span class=\"w\" data-w=\"what\">What</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"had\">had</span> <span class=\"w\" data-w=\"done\">done,</span> <span class=\"w ph\" data-w=\"no matter how\">no matter how</span> <span class=\"w\" data-w=\"good\">good</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"were\">were</span> <span class=\"w\" data-w=\"doing\">doing,</span> <span class=\"w\" data-w=\"no\">no</span> <span class=\"w\" data-w=\"matter\">matter</span> <span class=\"w\" data-w=\"how\">how</span> <span class=\"w\" data-w=\"happy\">happy</span> <span class=\"w\" data-w=\"everybody\">everybody</span> <span class=\"w\" data-w=\"was\">was,</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"was\">was</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w ph\" data-w=\"depending on\">depending on</span> <span class=\"w\" data-w=\"whatever\">whatever</span> <span class=\"w\" data-w=\"happened\">happened</span> <span class=\"w\" data-w=\"with\">with</span> <span class=\"w\" data-w=\"him\">him</span> <span class=\"w\" data-w=\"at\">at</span> <span class=\"w\" data-w=\"home\">home.</span>"}, {"i": 94, "start": 635.09, "end": 643.86, "dur": 8.77, "text": "That was going to rain hell on all of us that day, so he would come in and it would be like, what the are you doing, get good numbers up, do this.", "zh": "那天他就要把气撒在我们所有人头上，所以他一来就像，你们他妈在干什么，把业绩搞上去，干这个。", "clip": "clips/articulate/094.mp4", "html": "<span class=\"w\" data-w=\"that\">That</span> <span class=\"w\" data-w=\"was\">was</span> <span class=\"w\" data-w=\"going\">going</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"rain hell on\">rain hell on</span> <span class=\"w\" data-w=\"all\">all</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"us\">us</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"day\">day,</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"he\">he</span> <span class=\"w\" data-w=\"would\">would</span> <span class=\"w ph\" data-w=\"come in\">come in</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"would\">would</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"like\">like,</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" dat "}, {"i": 98, "start": 660.31, "end": 667.51, "dur": 7.2, "text": "I just had no respect for him and therefore I wouldn't follow him, I wouldn't be led by him and I end up eventually leaving the situation so what you have to do in order to,", "zh": "我就是不尊重他，所以不会追随他，不会被他领导，最后我离开了那个地方。所以为了。", "clip": "clips/articulate/098.mp4", "html": "<span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"just\">just</span> <span class=\"w\" data-w=\"had\">had</span> <span class=\"w ph\" data-w=\"no respect for\">no respect for</span> <span class=\"w\" data-w=\"him\">him</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"therefore\">therefore</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"wouldn&#x27;t\">wouldn&#x27;t</span> <span class=\"w\" data-w=\"follow\">follow</span> <span class=\"w\" data-w=\"him\">him,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"wouldn&#x27;t\">wouldn&#x27;t</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"led\">led</span> <span class=\"w\" data-w=\"by\">by</span> <span class=\"w\" data-w=\"him\">him</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w ph\" data-w=\"end up\">end up</span> <span class=\"w k\" data-w=\"eventually\">eventually</span> <span class=\"w\" data-w=\"leaving\">leaving</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"situation\">situation</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"do\">do</span> <span class=\"w ph\" data-w=\"in order to\">in order to,</span>"}, {"i": 99, "start": 667.51, "end": 675.64, "dur": 8.13, "text": "Maintain and increase your executive presence is replace inconsistency with predictability, consistency creates psychological safety.", "zh": "保持并提升你的高管气场，你要用可预测性取代反复无常，一致性会创造心理安全感。", "clip": "clips/articulate/099.mp4", "html": "<span class=\"w k\" data-w=\"maintain\">Maintain</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"increase\">increase</span> <span class=\"w\" data-w=\"your\">your</span> <span class=\"w ph\" data-w=\"executive presence\">executive presence</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"replace\">replace</span> <span class=\"w k\" data-w=\"inconsistency\">inconsistency</span> <span class=\"w\" data-w=\"with\">with</span> <span class=\"w k\" data-w=\"predictability\">predictability,</span> <span class=\"w k\" data-w=\"consistency\">consistency</span> <span class=\"w\" data-w=\"creates\">creates</span> <span class=\"w ph\" data-w=\"psychological safety\">psychological safety.</span>"}, {"i": 100, "start": 675.64, "end": 684.64, "dur": 9.0, "text": "People perform better when they know what to expect from you emotional regulation under stress is one of the rarest and most respected leadership traits, and so the higher that you climb.", "zh": "当人们知道能从你这里期待什么，他们表现会更好。压力下的情绪调节是最稀有、最受尊敬领导特质之一，所以你爬得越高。", "clip": "clips/articulate/100.mp4", "html": "<span class=\"w\" data-w=\"people\">People</span> <span class=\"w ph\" data-w=\"perform better\">perform better</span> <span class=\"w\" data-w=\"when\">when</span> <span class=\"w\" data-w=\"they\">they</span> <span class=\"w\" data-w=\"know\">know</span> <span class=\"w ph\" data-w=\"what to expect\">what to expect</span> <span class=\"w\" data-w=\"from\">from</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w ph\" data-w=\"emotional regulation\">emotional regulation</span> <span class=\"w ph\" data-w=\"under stress\">under stress</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"one\">one</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w k\" data- ntable British = videocassette recorder ④ before noun 录像的 ‹equipment,…"}, "succeed": {"w": "succeed", "d": "A. intransitive verb ① (achieve success) 成功▸ to succeed in business 做生意获成功▸ to succeed in one's exams 通过考试▸ I only succeeded in making things worse 我结果却把事情弄得更糟▸ nothing succeeds like success proverb 一事成，百事顺▸ if at first you don't succeed, try, try again…"}, "nice": {"w": "nice", "d": "adjective ① (enjoyable, pleasant) 令人愉快的▸ it is nice that … …真好▸ it would be nice (for sb) to do sth （某人）做某事会很不错▸ did you have a nice time? 你玩得开心吗？▸ it is nice sitting in the garden 坐在花园里很惬意▸ nice to meet/see you 认识/见到你很高兴 [见面用语]▸ nice to have met/seen you…"}, "bosses": {"w": "bosses", "d": "boss 1 A. noun (person in charge) 老板▸ go ahead, you're the boss ironic 说吧，你是头儿嘛▸ she's the boss in the house informal 家里她做主▸ we'll show them who's boss 我们会让他们知道谁是老大 B. adjective US informal 极好的▸ this work is boss 这活儿真棒 PHRASAL VERB boss about, boss around:…"}, "they'": {"w": "they'", "d": "pronoun ① (men, boys, people in general) 他们; (women, girls) 她们; (animals, things) 它们▸ they go on the bottom shelf 这些东西放在底层架子上▸ here/there they are! 他们在这儿/那儿呢！▸ they won't be there 他们不会在那里▸ she bought one, but they didn't 她买了一个，但他们没买▸ things ain’t what they…"}, "off-sites": {"w": "off-sites", "d": "off-site A. adjective attributive 工作场地外的 ‹meeting, training, storage›B. adverb 在工作场地以外 ‹work, store, manufacture›"}, "overexplaining": {"w": "overexplaining", "d": "explaining something in far more detail than the listener needs, usually out of nerves or insecurity"}, "over-explaining": {"w": "over-explaining", "d": "explaining something in far more detail than needed; a sign of insecurity that undermines authority"}, "buffett": {"w": "buffett", "d": "【专有名词】Warren Buffett 沃伦·巴菲特，伯克希尔·哈撒韦创始人"}, "zuckerberg": {"w": "zuckerberg", "d": "【专有名词】Mark Zuckerberg 马克·扎克伯格，Meta（Facebook）创始人"}, "sarah's": {"w": "sarah's", "d": "【人名所有格】Sarah 的（同事名，例句中指小组里的一位成员）"}, "com": {"w": "com", "d": "【网址后缀】.com（如 Acquisition.com）"}} || {};
const OUTLINE = [{"i": 0, "title": "沟通决定领导力信任"}, {"i": 6, "title": "聪明人为何话少"}, {"i": 19, "title": "限制发言时间"}, {"i": 30, "title": "姿态传递自信"}, {"i": 35, "title": "咬指甲的总监案例"}, {"i": 43, "title": "CEO与客服的姿态差异"}, {"i": 51, "title": "停止征求许可"}, {"i": 56, "title": "大学项目主动担责"}, {"i": 63, "title": "领导力源于创造确定性"}, {"i": 75, "title": "与朋友对峙的经历"}, {"i": 92, "title": "情绪失控的健身房老板"}] || [];       // [{i, title}] 主题大纲，i = 该章第一句
const VOCAB = {"sought after": 1, "plasticity": 1, "engagements": 1, "opening remarks": 1, "microcosm": 1} || {};         // 跨材料的生词本：词 -> 出现过几篇材料
const MATERIAL = "如何比 99% 的人更清晰地表达";
const KEY = "shadowing-v2";            // 固定：所有跟读页共用一份 localStorage
const RATES = [0.6, 0.75, 0.9, 1.0];

const au = document.getElementById('au');
const cue = document.getElementById('cue');
const idxEl = document.getElementById('idx');
const flash = document.getElementById('flash');
const scroll = document.getElementById('scroll');
let cur = 0, loop = false, shadowing = false, rate = 1, timer = null, raf = null, tickEnd = 0;

const LS = {
  get(k, d){ try { const v = localStorage.getItem(KEY + ':' + k); return v === null ? d : JSON.parse(v) } catch(e){ return d } },
  set(k, v){ try { localStorage.setItem(KEY + ':' + k, JSON.stringify(v)) } catch(e){} }
};

function say(t){ flash.textContent = t; flash.style.display = 'block' }
function unsay(){ flash.style.display = 'none' }
function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;') }

/* ---- audio: base64 -> Blob URL. iOS Safari will not seek a data: URI ---- */
(function initAudio(){
  au.src = 'articulate-thoughts.mp3';
  au.load();
})();
au.addEventListener('error', () => say('音频加载失败'));

/* ---- marked words / chunks ---- */
/* 把旧版按材料分开存的标记（<标题>:marks）并进共用生词本，别丢了她已经标过的词 */
(function migrateOldMarks(){
  try {
    const seen = [];
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && k !== KEY + ':marks' && /:marks$/.test(k)){
        try { (JSON.parse(localStorage.getItem(k)) || []).forEach(w => seen.push(w)) } catch(e){}
      }
    }
    if (!seen.length) return;
    const cur = new Set(LS.get('marks', []));
    seen.forEach(w => { if (w) cur.add(w) });
    LS.set('marks', Array.from(cur));
  } catch(e){}
})();

const marks = new Set(Object.keys(VOCAB).concat(LS.get('marks', [])));

function htmlOf(s){
  // build_page.py 已经把词和语块包好了；万一没有就退回逐词包
  if (s.html) return s.html;
  return String(s.text).split(/(\s+)/).map(tok =>
    /^\s*$/.test(tok) ? tok
      : '<span class="w" data-w="' + tok.toLowerCase().replace(/[^a-z']/g, '') + '">' + esc(tok) + '</span>').join('');
}

function toggleMark(k, on){
  if (!k) return;
  if (on === undefined) on = !marks.has(k);
  if (on) marks.add(k); else marks.delete(k);
  LS.set('marks', Array.from(marks));
  syncTerm(k, on);
  paintAll();
}

/* 写回 Mac 上的共用生词本；离线/存到手机时静默失败，不影响本地使用 */
function syncTerm(k, on){
  try {
    fetch('api/mark', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ term: k, on: on, material: MATERIAL })
    }).catch(() => {});
  } catch(e){}
}

function paintAll(){
  document.querySelectorAll('.w').forEach(el => el.classList.toggle('on', marks.has(el.dataset.w)));
  buildWordList();
  paintIdx();
}

function defOf(k){
  if (D[k]) return D[k];
  const parts = String(k).split(/\s+/).map(w => D[w]).filter(Boolean);
  if (parts.length) return { w: k, d: parts.map(p => (p.w || '') + '：' + (p.d || '')).join('　／　') };
  return null;
}

function buildWordList(){
  const box = document.getElementById('wlist');
  const list = Array.from(marks).sort();
  if (!list.length){ box.innerHTML = '<div class="wd"><span>还没有标记的词</span></div>'; return }
  box.innerHTML = list.map(k => {
    const e = defOf(k), times = VOCAB[k] || 0;
    return '<div class="wd" data-w="' + esc(k) + '"><b>' + esc(k) + '</b><span>'
      + esc(e ? e.d : '词典未收录（专有名词／术语）—— 告我一声我手工补上') + '</span>'
      + (times > 1 ? '<div class="cnt">在你 ' + times + ' 篇材料里出现过 —— 高频，优先记</div>' : '')
      + '</div>';
  }).join('');
}

function paintIdx(){
  const s = S[cur];
  idxEl.textContent = '第 ' + (cur + 1) + ' / ' + S.length + ' 句 · ' + s.dur.toFixed(1) + ' 秒'
    + (marks.size ? '  ·  生词本 ' + marks.size + ' 条（点这里看）' : '');
}

/* ---- rendering ---- */
function render(){
  const s = S[cur];
  cue.innerHTML = htmlOf(s);
  const v = document.getElementById('vid');
  if (s.clip){
    v.style.display = 'block';
    document.getElementById('vfull').style.display = 'block';
    if (v.dataset.i !== String(cur)){ v.dataset.i = cur; v.src = s.clip; v.load() }
  } else { v.style.display = 'none'; document.getElementById('vfull').style.display = 'none' }

  const zb = document.getElementById('zhbox');
  if (s.zh){
    zb.style.display = 'block';
    zb.className = 'masked';
    zb.dataset.i = cur;
    zb.querySelector('.zhtext').textContent = s.zh;
  } else { zb.style.display = 'none' }

  document.getElementById('prev').innerHTML = cur > 0 ? htmlOf(S[cur-1]) : '—';
  document.getElementById('next').innerHTML = cur < S.length - 1 ? htmlOf(S[cur+1]) : '—';
  document.getElementById('back').disabled = cur === 0;
  document.getElementById('fwd').disabled = cur === S.length - 1;
  document.querySelectorAll('#ol li').forEach((li, i) => li.classList.toggle('cur', i === cur));
  paintIdx();
  LS.set('pos', cur);
}

/* ---- playback ---- */
function killLoop(){
  clearTimeout(timer); clearInterval(timer);
  if (raf) cancelAnimationFrame(raf);
  raf = null; tickEnd = 0;
}
function playSeg(done){
  const s = S[cur];
  killLoop();
  /* 画面跟音频同步：静音播片段，音频说话。视频播完也停，别让画面自己往下跑 */
  (function(){
    const v = document.getElementById('vid');
    if (!v || !s.clip) return;
    try { v.currentTime = 0 } catch(e){}
    const p = v.play();
    if (p && p.catch) p.catch(() => {});     // iOS 上被拦就安静放弃，音频照常
  })();
  const begin = () => {
    try { au.currentTime = Math.max(0, s.start - 0.15) } catch(e){}
    au.playbackRate = rate;
    const p = au.play();
    if (p && p.catch) p.catch(err => say('播放不了：' + err.message));
    tickEnd = s.end;
    const tick = () => {
      if (au.currentTime >= tickEnd){
        try { au.pause() } catch(e){}
        try { document.getElementById('vid').pause() } catch(e){}
        raf = null; tickEnd = 0;
        if (done) done();
        return;
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  };
  if (au.readyState >= 1 && isFinite(au.duration) && au.duration > 0) begin();
  else {
    au.addEventListener('loadedmetadata', begin, { once: true });
    try { au.load() } catch(e){ say('加载失败：' + e.message) }
  }
}
function goto(i, autoplay){
  if (i < 0 || i >= S.length) return;
  cur = i; render(); scroll.scrollTop = 0;
  if (autoplay){ unsay(); playSeg() }
}

/* ---- controls ---- */
document.getElementById('play').onclick = () => { unsay(); playSeg() };
document.getElementById('back').onclick = () => goto(cur - 1, true);
document.getElementById('fwd').onclick  = () => goto(cur + 1, true);

document.getElementById('loop').onclick = e => {
  loop = !loop; shadowing = false;
  e.currentTarget.classList.toggle('on', loop);
  document.getElementById('shadow').classList.remove('on');
  killLoop(); unsay();
  if (loop){ say('循环这一句'); loopNext() }
};
function loopNext(){
  if (!loop) return;
  playSeg(() => { if (loop) timer = setTimeout(loopNext, 250) });
}

document.getElementById('shadow').onclick = e => {
  shadowing = !shadowing; loop = false;
  e.currentTarget.classList.toggle('on', shadowing);
  document.getElementById('loop').classList.remove('on');
  killLoop(); unsay();
  if (shadowing){
    say('听 · 听完跟着说一遍');
    shadowStep();
  }
};
function shadowStep(){
  if (!shadowing) return;
  playSeg(() => {
    if (!shadowing) return;
    let n = Math.max(2, Math.round(S[cur].dur * 1.15));
    say('该你了 · ' + n + ' 秒');
    timer = setInterval(() => {
      n--;
      if (n <= 0){
        clearInterval(timer); unsay();
        if (shadowing && cur < S.length - 1){ cur++; render(); timer = setTimeout(shadowStep, 300) }
        else { shadowing = false; document.getElementById('shadow').classList.remove('on') }
      } else say('该你了 · ' + n + ' 秒');
    }, 1000);
  });
}

document.getElementById('rate').onclick = e => {
  rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
  e.currentTarget.textContent = '速率 ' + (rate === 1 ? '1×' : rate + '×');
  au.playbackRate = rate;
  LS.set('rate', rate);
};

/* ---- point at a word/chunk: mark it AND show its meaning ---- */
document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('.w,[data-w]');
  if (!el) return;
  const k = el.dataset ? el.dataset.w : null;
  if (!k) return;
  e.preventDefault(); e.stopPropagation();
  toggleMark(k);
  if (!e.target.closest('#wlist')) showDef(k);   // 生词表里点 = 取消标记，不弹卡
}, true);

cue.addEventListener('click', e => {
  if (e.target.closest('.w')) return;
  unsay(); playSeg();
});

/* ---- 释义卡 ---- */
let defTimer = null;
function showDef(k){
  const box = document.getElementById('def');
  const e = defOf(k);
  box.innerHTML = '<div class="dw">' + esc(k) + '</div>'
    + '<div class="dd">' + esc(e ? e.d : '词典未收录（专有名词／术语）—— 告我一声我手工补上') + '</div>'
    + '<button id="dclose">知道了</button>';
  box.style.display = 'block';
  document.getElementById('dclose').onclick = ev => { ev.stopPropagation(); box.style.display = 'none' };
  clearTimeout(defTimer);
  defTimer = setTimeout(() => { box.style.display = 'none' }, 15000);
}
document.addEventListener('click', e => {
  const box = document.getElementById('def');
  if (box.style.display !== 'block') return;
  if (e.target.closest('#def') || e.target.closest('.w')) return;
  box.style.display = 'none';
});

/* ---- panels ---- */
document.getElementById('open').onclick = () => {
  document.querySelectorAll('#ol li').forEach((li, i) => { if (i === cur) li.scrollIntoView({ block: 'center' }) });
  document.getElementById('list').style.display = 'block';
};
document.getElementById('close').onclick = () => document.getElementById('list').style.display = 'none';
document.getElementById('wclose').onclick = () => document.getElementById('words').style.display = 'none';
idxEl.addEventListener('click', () => {
  if (marks.size){ buildWordList(); document.getElementById('words').style.display = 'block' }
});

/* 横屏小视频在竖屏手机里太小 —— 点一下走 iOS 的原生全屏播放器 */
document.getElementById('vfull').onclick = function(){
  const v = document.getElementById('vid');
  if (v.webkitEnterFullscreen) { try { v.webkitEnterFullscreen(); return } catch(e){} }
  if (v.requestFullscreen) { v.requestFullscreen().catch(() => {}); return }
  say('这台设备不支持放大，把手机横过来吧');
};

document.getElementById('zhbox').onclick = function(){
  this.classList.toggle('masked');
};

/* 记住最后在读的材料：材料列表页的“点空白返回”靠它 */
try { localStorage.setItem('shadowing:last', location.pathname) } catch(e){}

/* ---- 大纲：按主题跳，343 句不用从上往下翻 ---- */
(function buildToc(){
  if (!OUTLINE.length) { document.getElementById('toc').remove(); return }
  const box = document.getElementById('toc');
  OUTLINE.forEach((c, k) => {
    const b = document.createElement('button');
    b.className = 'ch';
    const end = (k + 1 < OUTLINE.length) ? OUTLINE[k+1].i : S.length;
    b.dataset.from = c.i; b.dataset.to = end;
    b.innerHTML = '<span class="tt">' + fmt(S[c.i].start) + '</span>' + esc(c.title) +
                  '<span class="tn">' + (end - c.i) + ' 句</span>';
    b.onclick = () => {
      document.getElementById('list').style.display = 'none';
      goto(c.i, true);
    };
    box.appendChild(b);
  });
})();

S.forEach((s, i) => {
  const li = document.createElement('li');
  li.innerHTML = '<span class="ts">' + fmt(s.start) + '</span>' + htmlOf(s);
  li.onclick = ev => {
    if (ev.target.closest('.w')) return;
    document.getElementById('list').style.display = 'none'; goto(i, true);
  };
  document.getElementById('ol').appendChild(li);
});
function fmt(t){ const m = Math.floor(t/60), x = Math.floor(t%60); return m + ':' + String(x).padStart(2,'0') }

/* ---- restore ---- */
rate = LS.get('rate', 1);
document.getElementById('rate').textContent = '速率 ' + (rate === 1 ? '1×' : rate + '×');
cur = Math.min(LS.get('pos', 0), S.length - 1);
render();
buildWordList();
</script>
</body>
</html>
