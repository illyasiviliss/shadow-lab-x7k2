ately exploding.", "zh": "但她的情绪不一定控制每一次互动，她可以感到愤怒而不立即爆发。", "clip": "clips/calm/025.mp4", "html": "<span class=\"w\" data-w=\"but\">But</span> <span class=\"w\" data-w=\"her\">her</span> <span class=\"w\" data-w=\"emotions\">emotions</span> <span class=\"w\" data-w=\"don&#x27;t\">don&#x27;t</span> <span class=\"w\" data-w=\"necessarily\">necessarily</span> <span class=\"w\" data-w=\"control\">control</span> <span class=\"w ph\" data-w=\"every interaction\">every interaction,</span> <span class=\"w\" data-w=\"she\">she</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"feel\">feel</span> <span class=\"w\" data-w=\"anger\">anger</span> <span class=\"w\" data-w=\"without\">without</span> <span class=\"w\" data-w=\"immediately\">immediately</span> <span class=\"w k\" data-w=\"exploding\">exploding.</span>"}, {"i": 26, "start": 189.45, "end": 196.91, "dur": 7.46, "text": "She can experience attraction without completely losing herself in it, that kind of regulation can communicate something powerful.", "zh": "她可以体验吸引力而不完全迷失其中，这种调节能传达强大的信息。", "clip": "clips/calm/026.mp4", "html": "<span class=\"w\" data-w=\"she\">She</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"experience\">experience</span> <span class=\"w k\" data-w=\"attraction\">attraction</span> <span class=\"w\" data-w=\"without\">without</span> <span class=\"w\" data-w=\"completely\">completely</span> <span class=\"w ph\" data-w=\"losing herself in\">losing herself in</span> <span class=\"w\" data-w=\"it\">it,</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"kind\">kind</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w k\" data-w=\"regulation\">regulation</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"communicate\">communicate</span> <span class=\"w\" data-w=\"something\">something</span> <span class=\"w\" data-w=\"powerful\">powerful.</span>"}, {"i": 27, "start": 201.58, "end": 208.41, "dur": 6.83, "text": "Here's something fascinating about the brain, it is constantly trying to predict what happens next.", "zh": "关于大脑有一件有趣的事，它不断试图预测接下来会发生什么。", "clip": "clips/calm/027.mp4", "html": "<span class=\"w\" data-w=\"here&#x27;s\">Here&#x27;s</span> <span class=\"w\" data-w=\"something\">something</span> <span class=\"w k\" data-w=\"fascinating\">fascinating</span> <span class=\"w\" data-w=\"about\">about</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"brain\">brain,</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"constantly\">constantly</span> <span class=\"w ph\" data-w=\"trying to predict\">trying to predict</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"happens\">happens</span> <span class=\"w\" data-w=\"next\">next.</span>"}, {"i": 28, "start": 208.41, "end": 215.28, "dur": 6.87, "text": "We don't simply react to the world, we use previous information to anticipate what we're likely to encounter.", "zh": "我们不只是对世界做出反应，我们用之前的信息来预测我们可能遇到什么。", "clip": "clips/calm/028.mp4", "html": "<span class=\"w\" data-w=\"we\">We</span> <span class=\"w\" data-w=\"don&#x27;t\">don&#x27;t</span> <span class=\"w\" data-w=\"simply\">simply</span> <span class=\"w ph\" data-w=\"react to\">react to</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"world\">world,</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"use\">use</span> <span class=\"w ph\" data-w=\"previous information\">previous information</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w k\" data-w=\"anticipate\">anticipate</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"we&#x27;re\">we&#x27;re</span> <span class=\"w\" data-w=\"likely\">likely</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w k\" data-w=\"encounter\">encounter.</span>"}, {"i": 29, "start": 215.29, "end": 223.68, "dur": 8.39, "text": "That's why uncertainty can be mentally demanding, not all uncertainty is bad, novelty can be exciting, but there's a major difference between.", "zh": "这就是为什么不确定性会让人精神疲惫，不是所有不确定性都是坏的，新奇可以令人兴奋，但有一个重大区别。", "clip": "clips/calm/029.mp4", "html": "<span class=\"w\" data-w=\"that&#x27;s\">That&#x27;s</span> <span class=\"w\" data-w=\"why\">why</span> <span class=\"w k\" data-w=\"uncertainty\">uncertainty</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w ph\" data-w=\"mentally demanding\">mentally demanding,</span> <span class=\"w\" data-w=\"not\">not</span> <span class=\"w\" data-w=\"all\">all</span> <span class=\"w k\" data-w=\"uncertainty\">uncertainty</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"bad\">bad,</span> <span class=\"w k\" data-w=\"novelty\">novelty</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"exciting\">exciting,</span> <span class=\"w\" data-w=\"but\">but</span> <span class=\"w\" data-w=\"there&#x27;s\">there&#x27;s</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w ph\" data-w=\"major difference\">major difference</span> <span class=\"w\" data-w=\"between\">between.</span>"}, {"i": 30, "start": 223.68, "end": 225.64, "dur": 1.96, "text": "I wonder what's going to happen next.", "zh": "我想知道接下来会发生什么。", "clip": "clips/calm/030.mp4", "html": "<span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"wonder\">wonder</span> <span class=\"w\" data-w=\"what&#x27;s\">what&#x27;s</span> <span class=\"w\" data-w=\"going\">going</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"happen\">happen</span> <span class=\"w\" data-w=\"next\">next.</span>"}, {"i": 31, "start": 225.64, "end": 234.95, "dur": 9.31, "text": "And I have no idea how this person is going to react, imagine you're talking to someone and accidentally say s ">I</span> <span class=\"w ph\" data-w=\"ruin everything\">ruin everything,</span> <span class=\"w\" data-w=\"are\">are</span> <span class=\"w\" data-w=\"they\">they</span> <span class=\"w\" data-w=\"going\">going</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w k\" data-w=\"disappear\">disappear?</span>"}, {"i": 33, "start": 240.63, "end": 246.14, "dur": 5.51, "text": "With another person you get, I didn't love that comment, but I understand what you meant.", "zh": "和另一个人你会得到，我不喜欢那个评论，但我理解你的意思。", "clip": "clips/calm/033.mp4", "html": "<span class=\"w\" data-w=\"with\">With</span> <span class=\"w\" data-w=\"another\">another</span> <span class=\"w\" data-w=\"person\">person</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"get\">get,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"didn&#x27;t\">didn&#x27;t</span> <span class=\"w\" data-w=\"love\">love</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w k\" data-w=\"comment\">comment,</span> <span class=\"w\" data-w=\"but\">but</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"understand\">understand</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"meant\">meant.</span>"}, {"i": 34, "start": 246.14, "end": 253.68, "dur": 7.54, "text": "The second person has made their internal state easier to understand, and that matters when someone's behavior is relatively consistent.", "zh": "第二个人让他们的内部状态更容易理解，当某人的行为相对一致时，这很重要。", "clip": "clips/calm/034.mp4", "html": "<span class=\"w\" data-w=\"the\">The</span> <span class=\"w\" data-w=\"second\">second</span> <span class=\"w\" data-w=\"person\">person</span> <span class=\"w\" data-w=\"has\">has</span> <span class=\"w\" data-w=\"made\">made</span> <span class=\"w\" data-w=\"their\">their</span> <span class=\"w ph\" data-w=\"internal state\">internal state</span> <span class=\"w\" data-w=\"easier\">easier</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"understand\">understand,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w k\" data-w=\"matters\">matters</span> <span class=\"w\" data-w=\"when\">when</span> <span class=\"w\" data-w=\"someone&#x27;s\">someone&#x27;s</span> <span class=\"w\" data-w=\"behavior\">behavior</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w ph\" data-w=\"relatively consistent\">relatively consistent.</span>"}, {"i": 35, "start": 253.68, "end": 261.57, "dur": 7.9, "text": "Your brain receives more reliable information about what to expect that can make social interaction easier to navigate.", "zh": "你的大脑收到更可靠的信息关于可以期待什么，这能让社交互动更容易应对。", "clip": "clips/calm/035.mp4", "html": "<span class=\"w\" data-w=\"your\">Your</span> <span class=\"w\" data-w=\"brain\">brain</span> <span class=\"w\" data-w=\"receives\">receives</span> <span class=\"w\" data-w=\"more\">more</span> <span class=\"w k\" data-w=\"reliable\">reliable</span> <span class=\"w\" data-w=\"information\">information</span> <span class=\"w\" data-w=\"about\">about</span> <span class=\"w ph\" data-w=\"what to expect\">what to expect</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"make\">make</span> <span class=\"w ph\" data-w=\"social interaction\">social interaction</span> <span class=\"w\" data-w=\"easier\">easier</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w k\" data-w=\"navigate\">navigate.</span>"}, {"i": 36, "start": 261.57, "end": 269.53, "dur": 7.95, "text": "And predictability can contribute to trust, think about it this way if you constantly have to guess whether someone is going to be affectionate.", "zh": "可预测性有助于信任，这样想，如果你不断要猜某人是否会亲热。", "clip": "clips/calm/036.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w k\" data-w=\"predictability\">predictability</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w ph\" data-w=\"contribute to\">contribute to</span> <span class=\"w\" data-w=\"trust\">trust,</span> <span class=\"w ph\" data-w=\"think about it\">think about it</span> <span class=\"w\" data-w=\"this\">this</span> <span class=\"w\" data-w=\"way\">way</span> <span class=\"w\" data-w=\"if\">if</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"constantly\">constantly</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"guess\">guess</span> <span class=\"w\" data-w=\"whether\">whether</span> <span class=\"w\" data-w=\"someone\">someone</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"going\">going</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w k\" data-w=\"affectionate\">affectionate.</span>"}, {"i": 37, "start": 269.53, "end": 272.19, "dur": 2.66, "text": "Distant, angry or withdrawn.", "zh": "疏远、生气或退缩。", "clip": "clips/calm/037.mp4", "html": "<span class=\"w k\" data-w=\"distant\">Distant,</span> <span class=\"w\" data-w=\"angry\">angry</span> <span class=\"w\" data-w=\"or\">or</span> <span class=\"w k\" data-w=\"withdrawn\">withdrawn.</span>"}, {"i": 38, "start": 272.19, "end": 280.64, "dur": 8.45, "text": "Part of your attention may be occupied with monitoring them, but when someone communicates relatively clearly and responds in a consistent way.", "zh": "你的一部分注意力可能被用来监视他们，但当某人沟通相对清晰并以一致的方式回应。", "clip": "clips/calm/038.mp4", "html": "<span class=\"w\" data-w=\"part\">Part</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"your\">your</span> <span class=\"w\" data-w=\"attention\">attention</span> <span class=\"w\" data-w=\"may\">may</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w ph\" data-w=\"occupied with\">occupied with</span> <span class=\"w k\" data-w=\"monitoring\">monitoring</span> <span class=\"w\" data-w=\"them\">them,</span> <span class=\"w\" data-w=\"but\">but</span> <span class=\"w\" data-w=\"when\">when</span> <span class=\"w\" data-w=\"someone\">someone</span> <span class=\"w k\" data-w=\"communicates\">communicates</span> <span class=\"w\" data-w=\"relatively\">relatively</span> <span class=\"w\" data-w=\"clearly\">clearly</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"responds\">responds</span> <span class=\"w ph\" data-w=\"in a consistent way\">in a consistent way.</span>"}, {"i": 39, "start": 280.64, "end": 288.51, "dur": 7.87, "text": "You don't have to spend as much energy trying to decode the relationship, you can actually experience it, and that's important for attraction.", "zh": "你不必花那么多精力试图解码这段关系，你可以真正体验它，这对吸引力很重要。", "clip": "clips/calm/039.mp4", "html": "<span class=\"w\" data-w=\"you\">You</span> <span class=\"w\" data-w=\"don&#x27;t\">don&#x27;t</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"spend as much energy\">spend as much energy</span> <span class=\"w ph\" data-w=\"trying to decode\">trying to decode</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"relationship\">relationship,</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"actually\">actually</span> <span class=\"w\" data-w=\"experience\">experience</span> <span class=\"w\" data-w=\"it\">it,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"that&#x27;s\">that&#x27;s</span> <span class=\"w\" data-w=\"important\">important</span> <span class=\"w\" data-w=\"for\">for</span> <span class=\"w k\" data-w=\"attraction\">attraction.</span>"}, {"i": 40, "start": 288.51, "end": 295.83, "dur": 7.31, "text": "Because excitement doesn't necessarily require emotional chaos, in fact, emotional stability can create the foundation.", "zh": "因为兴奋不一定需要情绪混乱，其实情绪稳定可以打下基础。", "clip": "clips/calm/040.mp4", "html": "<span class=\"w\" data-w=\"because\">Because</span> <span class=\"w\" data-w=\"excitement\">excitement</span> <span class=\"w\" data-w=\"doesn&#x27;t\">doesn&#x27;t</span> <span class=\"w\" data-w=\"necessarily\">necessarily</span> <span class=\"w\" data-w=\"require\">require</span> <span class=\"w\" data-w=\"emotional\">emotional</span> <span class=\"w k\" data-w=\"chaos\">chaos,</span> <span class=\"w ph\" data-w=\"in fact\">in fact,</span> <span class=\"w ph\" data-w=\"emotional stability\">emotional stability</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"create\">create</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w k\" data-w=\"foundation\">foundation.</span>"}, {"i": 41, "start": 295.83, "end": 304.04, "dur": 8.21, "text": "That allows excitement to feel safe, but you don't have to spend the entire interaction managing emotional emergencies. You can simply enjoy.", "zh": "这让兴奋感变得安全，你不用整个互动都在处理情绪危机，可以单纯享受。", "clip": "clips/calm/041.mp4", "html": "<span class=\"w\" data-w=\"that\">That</span> <span class=\"w\" data-w=\"allows\">allows</span> <span class=\"w\" data-w=\"excitement\">excitement</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"feel\">feel</span> <span class=\"w\" data-w=\"safe\">safe,</span> <span class=\"w\" data-w=\"but\">but</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"don&#x27;t\">don&#x27;t</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"spend\">spend</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"entire\">entire</span> <span class=\"w\" data-w=\"interaction\">interaction</span> <span class=\"w k\" data-w=\"managing\">managing</span> <span class=\"w ph\" data-w=\"emotional emergencies\">emotional emergencies.</span> <span class=\"w\" data-w=\"you\">You</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"simply\">simply</span> <span class=\"w\" data-w=\"enjoy\">enjoy.</span>"}, {"i": 42, "start": 304.04, "end": 308.38, "dur": 4.34, "text": "Being around each other, and that is an underrated part of attraction.", "zh": "彼此待在一起，这是吸引力中被低估的一部分。", "clip": "clips/calm/042.mp4", "html": "<span class=\"w\" data-w=\"being\">Being</span> <span class=\"w\" data-w=\"around\">around</span> <span class=\"w\" data-w=\"each\">each</span> <span class=\"w\" data-w=\"other\">other,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"an\">an</span> <span class=\"w ph\" data-w=\"underrated part\">underrated part</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"attraction\">attraction.</span>"}, {"i": 43, "start": 313.24, "end": 319.19, "dur": 5.95, "text": "Now let's talk about something people often mistake for confidence, attention seeking.", "zh": "现在我们来聊聊人们常误以为是自信的东西——寻求关注。", "clip": "clips/calm/043.mp4", "html": "<span class=\"w\" data-w=\"now\">Now</span> <span class=\"w\" data-w=\"let&#x27;s\">let&#x27;s</span> <span class=\"w\" data-w=\"talk\">talk</span> <span class=\"w\" data-w=\"about\">about</span> <span class=\"w\" data-w=\"something\">something</span> <span class=\"w\" data-w=\"people\">people</span> <span class=\"w\" data-w=\"often\">often</span> <span class=\"w ph\" data-w=\"mistake for\">mistake for</span> <span class=\"w\" data-w=\"confidence\">confidence,</span> <span class=\"w ph\" data-w=\"attention seeking\">attention seeking.</span>"}, {"i": 44, "start": 319.19, "end": 324.49, "dur": 5.3, "text": "Someone can walk into a room demanding attention and appear confident.", "zh": "有人走进房间就要求关注，看起来好像很自信。", "clip": "clips/calm/044.mp4", "html": "<span class=\"w\" data-w=\"someone\">Someone</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w ph\" data-w=\"walk into\">walk into</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"room\">room</span> <span class=\"w ph\" data-w=\"demanding attention\">demanding attention</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"appear\">appear</span> <span class=\"w\" data-w=\"confident\">confident.</span>"}, {"i": 45, "start": 324.5, "end": 332.71, "dur": 8.21, "text": "But confidence doesn't always announce itself, neuroscience doesn't give us one simple confidence center in the brain.", "zh": "但自信不总是大张旗鼓，神经科学并没有给我们一个简单的大脑自信中心。", "clip": "clips/calm/045.mp4", "html": "<span class=\"w\" data-w=\"but\">But</span> <span class=\"w\" data-w=\"confidence\">confidence</span> <span class=\"w\" data-w=\"doesn&#x27;t\">doesn&#x27;t</span> <span class=\"w\" data-w=\"always\">always</span> <span class=\"w ph\" data-w=\"announce itself\">announce itself,</span> <span class=\"w k\" data-w=\"neuroscience\">neuroscience</span> <span class=\"w\" data-w=\"doesn&#x27;t\">doesn&#x27;t</span> <span class=\"w\" data-w=\"give\">give</span> <span class=\"w\" data-w=\"us\">us</span> <span class=\"w\" data-w=\"one\">one</span> <span class=\"w\" data-w=\"simple\">simple</span> <span class=\"w\" data-w=\"confidence\">confidence</span> <span class=\"w\" data-w=\"center\">center</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"brain\">brain.</span>"}, {"i": 46, "start": 332.89, "end": 339.64, "dur": 6.75, "text": "Confidence emerges from interactions between systems involved in learning, reward, emotion.", "zh": "自信来自学习、奖励、情绪等系统的互动。", "clip": "clips/calm/046.mp4", "html": "<span class=\"w\" data-w=\"confidence\">Confidence</span> <span class=\"w ph\" data-w=\"emerges from\">emerges from</span> <span class=\"w ph\" data-w=\"interactions between\">interactions between</span> <span class=\"w\" data-w=\"systems\">systems</span> <span class=\"w\" data-w=\"involved\">involved</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"learning\">learning,</span> <span class=\"w k\" data-w=\"reward\">reward,</span> <span class=\"w\" data-w=\"emotion\">emotion.</span>"}, {"i": 47, "start": 339.64, "end": 347.5, "dur": 7.86, "text": "Decision making, memory and social cognition, but one behavior associated with psychological confidence.", "zh": "决策、记忆和社会认知，但有一种行为与心理自信相关。", "clip": "clips/calm/047.mp4", "html": "<span class=\"w ph\" data-w=\"decision making\">Decision making,</span> <span class=\"w\" data-w=\"memory\">memory</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w ph\" data-w=\"social cognition\">social cognition,</span> <span class=\"w\" data-w=\"but\">but</span> <span class=\"w\" data-w=\"one\">one</span> <span class=\"w\" data-w=\"behavior\">behavior</span> <span class=\"w ph\" data-w=\"associated with\">associated with</span> <span class=\"w k\" data-w=\"psychological\">psychological</span> <span class=\"w\" data-w=\"confidence\">confidence.</span>"}, {"i": 48, "start": 347.5, "end": 351.87, "dur": 4.37, "text": "The ability to regulate your responses, you experience something.", "zh": "调节反应的能力，你经历某件事。", "clip": "clips/calm/048.mp4", "html": "<span class=\"w\" data-w=\"the\">The</span> <span class=\"w\" data-w=\"ability\">ability</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"regulate your responses\">regulate your responses,</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"experience\">experience</span> <span class=\"w\" data-w=\"something\">something.</span>"}, {"i": 49, "start": 351.87, "end": 359.98, "dur": 8.11, "text": "Feel the emotion and you don't necessarily act on the first impulse it creates. That's important because emotional regulation.", "zh": "感受到情绪，但不一定按第一冲动行事。这很重要，因为情绪调节。", "clip": "clips/calm/049.mp4", "html": "<span class=\"w\" data-w=\"feel\">Feel</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" d  class=\"w\" data-w=\"something\">something</span> <span class=\"w k\" data-w=\"psychologically\">psychologically</span> <span class=\"w\" data-w=\"powerful\">powerful</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"self\">self.</span>"}, {"i": 52, "start": 371.86, "end": 379.53, "dur": 7.67, "text": "Ily dependent on your reaction to me, and that changes the social dynamic instead of how do I get this person to like me?", "zh": "不依赖你对我的反应，这改变了社交动态，不再是“我怎么让这个人喜欢我？”", "clip": "clips/calm/052.mp4", "html": "<span class=\"w\" data-w=\"ily\">Ily</span> <span class=\"w ph\" data-w=\"dependent on\">dependent on</span> <span class=\"w\" data-w=\"your\">your</span> <span class=\"w\" data-w=\"reaction\">reaction</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"me\">me,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"changes\">changes</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w ph\" data-w=\"social dynamic\">social dynamic</span> <span class=\"w\" data-w=\"instead\">instead</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"how\">how</span> <span class=\"w\" data-w=\"do\">do</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"get\">get</span> <span class=\"w\" data-w=\"this\">this</span> <span class=\"w\" data-w=\"person\">person</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w\" data-w=\"me\">me?</span>"}, {"i": 53, "start": 379.53, "end": 387.23, "dur": 7.7, "text": "Interaction becomes, do we actually like each other, that's a completely different psychological position, and it can feel a.", "zh": "互动变成“我们是否真的喜欢彼此”，这是完全不同的心理位置，而且会感觉。", "clip": "clips/calm/053.mp4", "html": "<span class=\"w\" data-w=\"interaction\">Interaction</span> <span class=\"w\" data-w=\"becomes\">becomes,</span> <span class=\"w\" data-w=\"do\  class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"care\">care,</span> <span class=\"w\" data-w=\"but\">but</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"handle\">handle</span> <span class=\"w\" data-w=\"caring\">caring</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"those\">those</span> <span class=\"w\" data-w=\"are\">are</span> <span class=\"w\" data-w=\"very\">very</span> <span class=\"w\" data-w=\"different\">different</span> <span class=\"w k\" data-w=\"signals\">signals.</span>"}, {"i": 58, "start": 429.29, "end": 437.29, "dur": 8.0, "text": "Now here's where things get even more interesting, human beings don't experience emotions completely in isolation.", "zh": "现在事情变得更有趣了，人类并不是完全孤立地体验情绪。", "clip": "clips/calm/058.mp4", "html": "<span class=\"w\" data-w=\"now\">Now</span> <span class=\"w\" data-w=\"here&#x27;s\">here&#x27;s</span> <span class=\"w\" data-w=\"where\">where</span> <span class=\"w\" data-w=\"things\">things</span> <span class=\"w\" data-w=\"get\">get</span> <span class=\"w\" data-w=\"even\">even</span> <span class=\"w\" data-w=\"more\">more</span> <span class=\"w\" data-w=\"interesting\">interesting,</span> <span class=\"w\" data-w=\"human\">human</span> <span class=\"w\" data-w=\"beings\">beings</span> <span class=\"w\" data-w=\"don&#x27;t\">don&#x27;t</span> <span class=\"w\" data-w=\"experience\">experience</span> <span class=\"w\" data-w=\"emotions\">emotions</span> <span class=\"w\" data-w=\"completely\">completely</span> <span class=\"w ph\" data-w=\"in isolation\">in isolation.</span>"}, {"i": 59, "start": 437.29, "end": 447.78, "dur": 10.49, "text": "We're highly sensitive to other people's facial expressions, voices, movements, posture, timing, and behavior, we constantly interpret one another.", "zh": "我们对别人的面部表情、声音、动作、姿势、时机和行为高度敏感，我们不断解读彼此。", "clip": "clips/calm/059.mp4", "html": "<span class=\"w\" data-w=\"we&#x27;re\">We&#x27;re</span> <span class=\"w ph\" data-w=\"highly sensitive to\">highly sensitive to</span> <span class=\"w\" data-w=\"other\">other</span> <span class=\"w\" data-w=\"people&#x27;s\">people&#x27;s</span> <span class=\"w ph\" data-w=\"facial expressions\">facial expressions,</span> <span class=\"w\" data-w=\"voices\">voices,</span> <span class=\"w\" data-w=\"movements\">movements,</span> <span class=\"w k\" data-w=\"posture\">posture,</span> <span class=\"w\" data-w=\"timing\">timing,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"behavior\">behavior,</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"constantly\">constantly</span> <span class=\"w k\" data-w=\"interpret\">interpret</span> <span class=\"w ph\" data-w=\"one another\">one another.</span>"}, {"i": 60, "start": 447.78, "end": 449.78, "dur": 2.0, "text": "And those signals can influence.", "zh": "这些信号会影响。", "clip": "clips/calm/060.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"those\">those</span> <span class=\"w\" data-w=\"signals\">signals</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"influence\">influence.</span>"}, {"i": 61, "start": 449.78, "end": 457.23, "dur": 7.45, "text": "How an interaction feels P psychologists sometimes describe related processes using concepts such as.", "zh": "互动的感受，心理学家有时用这些概念描述相关过程。", "clip": "clips/calm/061.mp4", "html": "<span class=\"w\" data-w=\"how\">How</span> <span class=\"w\" data-w=\"an\">an</span> <span class=\"w k\" data-w=\"interaction\">interaction</span> <span class=\"w\" data-w=\"feels\">feels</span> <span class=\"w\" data-w=\"p\">P</span> <span class=\"w k\" data-w=\"psychologists\">psychologists</span> <span class=\"w\" data-w=\"sometimes\">sometimes</span> <span class=\"w\" data-w=\"describe\">describe</span> <span class=\"w\" data-w=\"related\">related</span> <span class=\"w\" data-w=\"processes\">processes</span> <span class=\"w\" data-w=\"using\">using</span> <span class=\"w k\" data-w=\"concepts\">concepts</span> <span class=\"w\" data-w=\"such\">such</span> <span class=\"w\" data-w=\"as\">as.</span>"}, {"i": 62, "start": 457.23, "end": 461.79, "dur": 4.56, "text": "Emotional contagion and interpersonal emotion regulation.", "zh": "情绪传染和人际情绪调节。", "clip": "clips/calm/062.mp4", "html": "<span class=\"w\" data-w=\"emotional\">Emotional</span> <span class=\"w k\" data-w=\"contagion\">contagion</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w k\" data-w=\"interpersonal\">interpersonal</span> <span class=\"w\" data-w=\"emotion\">emotion</span> <span class=\"w k\" data-w=\"regulation\">regulation.</span>"}, {"i": 63, "start": 461.79, "end": 470.23, "dur": 8.44, "text": "This doesn't mean one person's emotions magically transfer into another person's brain, it's more ordinary and more fascinating.", "zh": "这并不意味着一个人的情绪会神奇地转移到另一个人的大脑，它更平常也更迷人。", "clip": "clips/calm/063.mp4", "html": "<span class=\"w\" data-w=\"this\">This</span> <span class=\"w\" data-w=\"doesn&#x27;t\">doesn&#x27;t</span> <span class=\"w\" data-w=\"mean\">mean</span> <span class=\"w\" data-w=\"one\">one</span> <span class=\"w\" data-w=\"person&#x27;s\">person&#x27;s</span> <span class=\"w\" data-w=\"emotions\">emotions</span> <span class=\"w k\" data-w=\"magically\">magically</span> <span class=\"w\" data-w=\"transfer\">transfer</span> <span class=\"w\" data-w=\"into\">into</span> <span class=\"w\" data-w=\"another\">another</span> <span class=\"w\" data-w=\"person&#x27;s\">person&#x27;s</span> <span class=\"w\" data-w=\"brain\">brain,</span> <span class=\"w\" data-w=\"it&#x27;s\">it&#x27;s</span> <span class=\"w\" data-w=\"more\">more</span> <span class=\"w\" data-w=\"ordinary\">ordinary</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"more\">more</span> <span class=\"w k\" data-w=\"fascinating\">fascinating.</span>"}, {"i": 64, "start": 470.23, "end": 475.06, "dur": 4.83, "text": "T that if someone speaks rapidly, looks tense, reacts dramatically.", "zh": "如果一个人说话很快、看起来紧张、反应夸张。", "clip": "clips/calm/064.mp4", "html": "<span class=\"w\" data-w=\"t\">T</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"if\">if</span> <span class=\"w\" data-w=\"someone\">someone</span> <span class=\"w\" data-w=\"speaks\">speaks</span> <span class=\"w k\" data-w=\"rapidly\">rapidly,</span> <span class=\"w\" data-w=\"looks\">looks</span> <span class=\"w k\" data-w=\"tense\">tense,</span> <span class=\"w\" data-w=\"reacts\">reacts</span> <span class=\"w k\" data-w=\"dramatically\">dramatically.</span>"}, {"i": 65, "start": 475.06, "end": 481.86, "dur": 6.8, "text": "And constantly signals danger, the people around them receive information that the situation may be threatening.", "zh": "不断发出危险信号，周围的人会接收到情况可能有威胁的信息。", "clip": "clips/calm/065.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w k\" data-w=\"constantly\">constantly</span> <span class=\"w\" data-w=\"signals\">signals</span> <span class=\"w\" data-w=\"danger\">danger,</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"people\">people</span> <span class=\"w\" data-w=\"around\">around</span> <span class=\"w\" data-w=\"them\">them</span> <span class=\"w\" data-w=\"receive\">receive</span> <span class=\"w\" data-w=\"information\">information</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"situation\">situation</span> <span class=\"w\" data-w=\"may\">may</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w k\" data-w=\"threatening\">threatening.</span>"}, {"i": 66, "start": 481.86, "end": 485.69, "dur": 3.83, "text": "But imagine the opposite, you're in a stressful situation.", "zh": "但想象相反的情况，你处在压力很大的情境中。", "clip": "clips/calm/066.mp4", "html": "<span class=\"w\" data-w=\"but\">But</span> <span class=\"w\" data-w=\"imagine\">imagine</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"opposite\">opposite,</span> <span class=\"w\" data-w=\"you&#x27;re\">you&#x27;re</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w k\" data-w=\"stressful\">stressful</span> <span class=\"w\" data-w=\"situation\">situation.</span>"}, {"i": 67, "start": 485.69, "end": 492.38, "dur": 6.69, "text": "Everyone is talking at once, one person starts panicking, then another person calmly says, okay.", "zh": "大家都在同时说话，一个人开始恐慌，然后另一个人平静地说，好。", "clip": "clips/calm/067.mp4", "html": "<span class=\"w\" data-w=\"everyone\">Everyone</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"talking\">talking</span> <span class=\"w ph\" data-w=\"at once\">at once,</span> <span class=\"w\" data-w=\"one\">one</span> <span class=\"w\" data-w=\"person\">person</span> <span class=\"w\" data-w=\"starts\">starts</span> <span class=\"w k\" data-w=\"panicking\">panicking,</span> <span class=\"w\" data-w=\"then\">then</span> <span class=\"w\" data-w=\"another\">another</span> <span class=\"w\" data-w=\"person\">person</span> <span class=\"w k\" data-w=\"calmly\">calmly</span> <span class=\"w\" data-w=\"says\">says,</span> <span class=\"w\" data-w=\"okay\">okay.</span>"}, {"i": 68, "start": 492.38, "end": 498.48, "dur": 6.1, "text": "Let's slow down what's actually happening, notice what just changed, the problem hasn't disappeared.", "zh": "我们慢下来，看看实际发生了什么，注意刚刚什么变了，问题没有消失。", "clip": "clips/calm/068.mp4", "html": "<span class=\"w\" data-w=\"let&#x27;s\">Let&#x27;s</span> <span class=\"w ph\" data-w=\"slow down\">slow down</span> <span class=\"w\" data-w=\"what&#x27;s\">what&#x27;s</span> <span class=\"w\" data-w=\"actually\">actually</span> <span class=\"w\" data-w=\"happening\">happening,</span> <span class=\"w\" data-w=\"notice\">notice</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"just\">just</span> <span class=\"w\" da ply\">simply</span> <span class=\"w k\" data-w=\"reacted\">reacted</span> <span class=\"w\" data-w=\"to\">to.</span>"}, {"i": 71, "start": 511.85, "end": 520.82, "dur": 8.97, "text": "Vice, pacing, attention and behavior all communicate, we can deal with this, and that can influence how other people experience.", "zh": "声音、节奏、注意力和行为都在传达，我们能处理这个，这会影响别人如何体验。", "clip": "clips/calm/071.mp4", "html": "<span class=\"w\" data-w=\"vice\">Vice,</span> <span class=\"w k\" data-w=\"pacing\">pacing,</span> <span class=\"w\" data-w=\"attention\">attention</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"behavior\">behavior</span> <span class=\"w\" data-w=\"all\">all</span> <span class=\"w k\" data-w=\"communicate\">communicate,</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"deal\">deal</span> <span class=\"w\" data-w=\"with\">with</span> <span class=\"w\" data-w=\"this\">this,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"influence\">influence</span> <span class=\"w\" data-w=\"how\">how</span> <span class=\"w\" data-w=\"other\">other</span> <span class=\"w\" data-w=\"people\">people</span> <span class=\"w\" data-w=\"experience\">experience.</span>"}, {"i": 72, "start": 520.82, "end": 530.18, "dur": 9.36, "text": "The situation, this is one reason calmness can become socially powerful because attraction isn't only about how someone looks, it's also about what it.", "zh": "这个情境，这是冷静能在社交上变得强大的一个原因，因为吸引力不只是关于外表，也关于它。", "clip": "clips/calm/072.mp4", "html": "<span class=\"w\" data-w=\"the\">The</span> <span class=\"w\" data-w=\"situation\">situation,</span> <span class=\"w\" data-w=\"this\">this</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"one\">one</span> <span class=\"w\" data-w=\"reason\">reason</span> <span class=\"w k\" data-w=\ 58.95, "dur": 7.28, "text": "So sometimes we're not only attracted to the person, we're attracted to the state we tend to experience when we're around them.", "zh": "所以有时我们不只是被那个人吸引，我们被和他们在一起时体验到的状态吸引。", "clip": "clips/calm/076.mp4", "html": "<span class=\"w\" data-w=\"so\">So</span> <span class=\"w\" data-w=\"sometimes\">sometimes</span> <span class=\"w\" data-w=\"we&#x27;re\">we&#x27;re</span> <span class=\"w\" data-w=\"not\">not</span> <span class=\"w\" data-w=\"only\">only</span> <span class=\"w k\" data-w=\"attracted\">attracted</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"person\">person,</span> <span class=\"w\" data-w=\"we&#x27;re\">we&#x27;re</span> <span class=\"w k\" data-w=\"attracted\">attracted</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w k\" data-w=\"state\">state</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"tend\">tend</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"experience\">experience</span> <span class=\"w\" data-w=\"when\">when</span> <span class=\"w\" data-w=\"we&#x27;re\">we&#x27;re</span> <span class=\"w\" data-w=\"around\">around</span> <span class=\"w\" data-w=\"them\">them.</span>"}, {"i": 77, "start": 558.95, "end": 561.88, "dur": 2.93, "text": "And that's a much deeper form of attraction.", "zh": "那是更深层的吸引力。", "clip": "clips/calm/077.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"that&#x27;s\">that&#x27;s</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"much\">much</span> <span class=\"w k\" data-w=\"deeper\">deeper</span> <span class=\"w\" data-w=\"form\">form</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w k\" data-w=\"attraction\">attraction.</span>"}, {"i": 78, "start": 566.79, "end": 570.82, "dur": 4.03, "text": "Finally, there's something surprisingly simple about calmness.", "zh": "最后，冷静有一个出奇简单的地方。", "clip": "clips/calm/078.mp4", "html": "<span class=\"w\" data-w=\"finally\">Finally,</span> <span class=\"w\" data-w=\"there&#x27;s\">there&#x27;s</span> <span class=\"w\" data-w=\"something\">something</span> <span class=\"w k\" data-w=\"surprisingly\">surprisingly</span> <span class=\"w\" data-w=\"simple\">simple</span> <span class=\"w\" data-w=\"about\">about</span> <span class=\"w k\" data-w=\"calmness\">calmness.</span>"}, {"i": 79, "start": 570.82, "end": 577.31, "dur": 6.49, "text": "It creates space, a person who isn't constantly filling every silence gives you room to notice them.", "zh": "它创造空间，一个不总是填满每个沉默的人，给你空间去注意他们。", "clip": "clips/calm/079.mp4", "html": "<span class=\"w\" data-w=\"it\">It</span> <span class=\"w\" data-w=\"creates\">creates</span> <span class=\"w\" data-w=\"space\">space,</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"person\">person</span> <span class=\"w\" data-w=\"who\">who</span> <span class=\"w\" data-w=\"isn&#x27;t\">isn&#x27;t</span> <span class=\"w\" data-w=\"constantly\">constantly</span> <span class=\"w\" data-w=\"filling\">filling</span> <span class=\"w\" data-w=\"every\">every</span> <span class=\"w k\" data-w=\"silence\">silence</span> <span class=\"w\" data-w=\"gives\">gives</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"room\">room</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"notice\">notice</span> <span class=\"w\" data-w=\"them\">them.</span>"}, {"i": 80, "start": 577.31, "end": 588.62, "dur": 11.31, "text": "And attention is fundamental to social connection when someone isn't constantly trying to control how they're perceived, their behavior can sometimes feel more authentic, you're not watching someone.", "zh": "而专注是社交连接的基础，当一个人不再时刻试图控制别人对自己的看法，他们的行为有时会显得更真实，你不是在观察一个人。", "clip": "clips/calm/080.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"attention\">attention</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w k\" data-w=\"fundamental\">fundamental</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"social\">social</span> <span class=\"w\" data-w=\"connection\">connection</span> <span class=\"w\" data-w=\"when\">when</span> <span class=\"w\" data-w=\"someone\">someone</span> <span class=\"w\" data-w=\"isn&#x27;t\">isn&#x27;t</span> <span class=\"w\" data-w=\"constantly\">constantly</span> <span class=\"w\" data-w=\"trying\">trying</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"control\">control</span> <span class=\"w\" data-w=\"how\">how</span> <span class=\"w\" data-w=\"they&#x27;re\">they&#x27;re</span> <span class=\"w k\" data-w=\"perceived\">perceived,</span> <span class=\"w\" data-w=\"their\">their</span> <span class=\"w\" data-w=\"behavior\">behavior</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"sometimes\">sometimes</span> <span class=\"w\" data-w=\"feel\">feel</span> <span class=\"w\" data-w=\"more\">more</span> <span class=\"w k\" data-w=\"authentic\">authentic,</span> <span class=\"w\" data-w=\"you&#x27;re\">you&#x27;re</span> <span class=\"w\" data-w=\"not\">not</span> <span class=\"w\" data-w=\"watching\">watching</span> <span class=\"w\" data-w=\"someone\">someone.</span>"}, {"i": 81, "start": 588.62, "end": 594.49, "dur": 5.87, "text": "Perform confidence, you're watching someone simply exist, and that can be captivating.", "zh": "表演自信，你是在观察一个人单纯地存在，而那可以很迷人。", "clip": "clips/calm/081.mp4", "html": "<span class=\"w k\" data-w=\"perform\">Perform</span> <span class=\"w\" data-w=\"confidence\">confidence,</span> <span class=\"w\" data-w=\"you&#x27;re\">you&#x27;re</span> <span class=\"w\" data-w=\"watching\">watching</span> <span class=\"w\" data-w=\"someone\">someone</span> <span class=\"w\" data-w=\"simply\">simply</span> <span class=\"w\" data-w=\"exist\">exist,</span> <span class=\"w\" data-w };

function say(t){ flash.textContent = t; flash.style.display = 'block' }
function unsay(){ flash.style.display = 'none' }
function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;') }

/* ---- marked words / chunks ---- */
/* 把旧版按材料分开存的标记（<标题>:marks）并进共用生词本，别丢了她已经标过的词 */
(function migrateOldMarks(){
  try {
    const seen = [];
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && k !== KEY + ':marks' && /:marks$/.test(k)){
        try { (JSON.parse(localStorage.getItem(k)) || []).forEach(w => seen.push(w)) } catch(e){}
      }
    }
    if (!seen.length) return;
    const cur = new Set(LS.get('marks', []));
    seen.forEach(w => { if (w) cur.add(w) });
    LS.set('marks', Array.from(cur));
  } catch(e){}
})();

const marks = new Set(Object.keys(VOCAB).concat(LS.get('marks', [])));

function htmlOf(s){
  // build_page.py 已经把词和语块包好了；万一没有就退回逐词包
  if (s.html) return s.html;
  return String(s.text).split(/(\s+)/).map(tok =>
    /^\s*$/.test(tok) ? tok
      : '<span class="w" data-w="' + tok.toLowerCase().replace(/[^a-z']/g, '') + '">' + esc(tok) + '</span>').join('');
}

function toggleMark(k, on){
  if (!k) return;
  if (on === undefined) on = !marks.has(k);
  if (on) marks.add(k); else marks.delete(k);
  LS.set('marks', Array.from(marks));
  syncTerm(k, on);
  paintAll();
}

/* 写回 Mac 上的共用生词本；离线/存到手机时静默失败，不影响本地使用 */
function syncTerm(k, on){
  try {
    fetch('api/mark', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ term: k, on: on, material: MATERIAL })
    }).catch(() => {});
  } catch(e){}
}

function paintAll(){
  document.querySelectorAll('.w').forEach(el => el.classList.toggle('on', marks.has(el.dataset.w)));
  buildWordList();
  paintIdx();
}

function defOf(k){
  if (D[k]) return D[k];
  const parts = String(k).split(/\s+/).map(w => D[w]).filter(Boolean);
  if (parts.length) return { w: k, d: parts.map(p => (p.w || '') + '：' + (p.d || '')).join('　／　') };
  return null;
}

function buildWordList(){
  const box = document.getElementById('wlist');
  const list = Array.from(marks).sort();
  if (!list.length){ box.innerHTML = '<div class="wd"><span>还没有标记的词</span></div>'; return }
  box.innerHTML = list.map(k => {
    const e = defOf(k), times = VOCAB[k] || 0;
    return '<div class="wd" data-w="' + esc(k) + '"><b>' + esc(k) + '</b><span>'
      + esc(e ? e.d : '词典未收录（专有名词／术语）—— 告我一声我手工补上') + '</span>'
      + (times > 1 ? '<div class="cnt">在你 ' + times + ' 篇材料里出现过 —— 高频，优先记</div>' : '')
      + '</div>';
  }).join('');
}

function paintIdx(){
  const s = S[cur];
  idxEl.textContent = '第 ' + (cur + 1) + ' / ' + S.length + ' 句 · ' + s.dur.toFixed(1) + ' 秒'
    + (marks.size ? '  ·  生词本 ' + marks.size + ' 条（点这里看）' : '');
}

/* ---- rendering ---- */
function render(){
  const s = S[cur];
  cue.innerHTML = htmlOf(s);
  const v = document.getElementById('vid');
  if (s.clip){
    v.style.display = 'block';
    document.getElementById('vfull').style.display = 'block';
    if (v.dataset.i !== String(cur)){ v.dataset.i = cur; v.src = s.clip; v.load() }
  } else { v.style.display = 'none'; document.getElementById('vfull').style.display = 'none' }

  const zb = document.getElementById('zhbox');
  if (s.zh){
    zb.style.display = 'block';
    zb.className = 'masked';
    zb.dataset.i = cur;
    zb.querySelector('.zhtext').textContent = s.zh;
  } else { zb.style.display = 'none' }

  document.getElementById('prev').innerHTML = cur > 0 ? htmlOf(S[cur-1]) : '—';
  document.getElementById('next').innerHTML = cur < S.length - 1 ? htmlOf(S[cur+1]) : '—';
  document.getElementById('back').disabled = cur === 0;
  document.getElementById('fwd').disabled = cur === S.length - 1;
  document.querySelectorAll('#ol li').forEach((li, i) => li.classList.toggle('cur', i === cur));
  paintIdx();
  LS.set('pos', cur);
}

/* ---- playback ---- */
function killLoop(){
  clearTimeout(timer); clearInterval(timer);
  if (raf) cancelAnimationFrame(raf);
  raf = null; tickEnd = 0;
}
function playSeg(done){
  const s = S[cur];
  killLoop();
  /* 画面跟音频同步：静音播片段，音频说话。视频播完也停，别让画面自己往下跑 */
  (function(){
    const v = document.getElementById('vid');
    if (!v || !s.clip) return;
    try { v.currentTime = 0 } catch(e){}
    const p = v.play();
    if (p && p.catch) p.catch(() => {});     // iOS 上被拦就安静放弃，音频照常
  })();
  const begin = () => {
    try { au.currentTime = Math.max(0, s.start - 0.15) } catch(e){}
    au.playbackRate = rate;
    const p = au.play();
    if (p && p.catch) p.catch(err => say('播放不了：' + err.message));
    tickEnd = s.end;
    const tick = () => {
      if (au.currentTime >= tickEnd){
        try { au.pause() } catch(e){}
        try { document.getElementById('vid').pause() } catch(e){}
        raf = null; tickEnd = 0;
        if (done) done();
        return;
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  };
  if (au.readyState >= 1 && isFinite(au.duration) && au.duration > 0) begin();
  else {
    au.addEventListener('loadedmetadata', begin, { once: true });
    try { au.load() } catch(e){ say('加载失败：' + e.message) }
  }
}
function goto(i, autoplay){
  if (i < 0 || i >= S.length) return;
  cur = i; render(); scroll.scrollTop = 0;
  if (autoplay){ unsay(); playSeg() }
}

/* ---- controls ---- */
document.getElementById('play').onclick = () => { unsay(); playSeg() };
document.getElementById('back').onclick = () => goto(cur - 1, true);
document.getElementById('fwd').onclick  = () => goto(cur + 1, true);

document.getElementById('loop').onclick = e => {
  loop = !loop; shadowing = false;
  e.currentTarget.classList.toggle('on', loop);
  document.getElementById('shadow').classList.remove('on');
  killLoop(); unsay();
  if (loop){ say('循环这一句'); loopNext() }
};
function loopNext(){
  if (!loop) return;
  playSeg(() => { if (loop) timer = setTimeout(loopNext, 250) });
}

document.getElementById('shadow').onclick = e => {
  shadowing = !shadowing; loop = false;
  e.currentTarget.classList.toggle('on', shadowing);
  document.getElementById('loop').classList.remove('on');
  killLoop(); unsay();
  if (shadowing){
    say('听 · 听完跟着说一遍');
    shadowStep();
  }
};
function shadowStep(){
  if (!shadowing) return;
  playSeg(() => {
    if (!shadowing) return;
    let n = Math.max(2, Math.round(S[cur].dur * 1.15));
    say('该你了 · ' + n + ' 秒');
    timer = setInterval(() => {
      n--;
      if (n <= 0){
        clearInterval(timer); unsay();
        if (shadowing && cur < S.length - 1){ cur++; render(); timer = setTimeout(shadowStep, 300) }
        else { shadowing = false; document.getElementById('shadow').classList.remove('on') }
      } else say('该你了 · ' + n + ' 秒');
    }, 1000);
  });
}

document.getElementById('rate').onclick = e => {
  rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
  e.currentTarget.textContent = '速率 ' + (rate === 1 ? '1×' : rate + '×');
  au.playbackRate = rate;
  LS.set('rate', rate);
};

/* ---- point at a word/chunk: mark it AND show its meaning ---- */
document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('.w,[data-w]');
  if (!el) return;
  const k = el.dataset ? el.dataset.w : null;
  if (!k) return;
  e.preventDefault(); e.stopPropagation();
  toggleMark(k);
  if (!e.target.closest('#wlist')) showDef(k);   // 生词表里点 = 取消标记，不弹卡
}, true);

cue.addEventListener('click', e => {
  if (e.target.closest('.w')) return;
  unsay(); playSeg();
});

/* ---- 释义卡 ---- */
let defTimer = null;
function showDef(k){
  const box = document.getElementById('def');
  const e = defOf(k);
  box.innerHTML = '<div class="dw">' + esc(k) + '</div>'
    + '<div class="dd">' + esc(e ? e.d : '词典未收录（专有名词／术语）—— 告我一声我手工补上') + '</div>'
    + '<button id="dclose">知道了</button>';
  box.style.display = 'block';
  document.getElementById('dclose').onclick = ev => { ev.stopPropagation(); box.style.display = 'none' };
  clearTimeout(defTimer);
  defTimer = setTimeout(() => { box.style.display = 'none' }, 15000);
}
document.addEventListener('click', e => {
  const box = document.getElementById('def');
  if (box.style.display !== 'block') return;
  if (e.target.closest('#def') || e.target.closest('.w')) return;
  box.style.display = 'none';
});

/* ---- panels ---- */
document.getElementById('open').onclick = () => {
  document.querySelectorAll('#ol li').forEach((li, i) => { if (i === cur) li.scrollIntoView({ block: 'center' }) });
  document.getElementById('list').style.display = 'block';
};
document.getElementById('close').onclick = () => document.getElementById('list').style.display = 'none';
document.getElementById('wclose').onclick = () => document.getElementById('words').style.display = 'none';
idxEl.addEventListener('click', () => {
  if (marks.size){ buildWordList(); document.getElementById('words').style.display = 'block' }
});

/* 横屏小视频在竖屏手机里太小 —— 点一下走 iOS 的原生全屏播放器 */
document.getElementById('vfull').onclick = function(){
  const v = document.getElementById('vid');
  if (v.webkitEnterFullscreen) { try { v.webkitEnterFullscreen(); return } catch(e){} }
  if (v.requestFullscreen) { v.requestFullscreen().catch(() => {}); return }
  say('这台设备不支持放大，把手机横过来吧');
};

document.getElementById('zhbox').onclick = function(){
  this.classList.toggle('masked');
};

/* 记住最后在读的材料：材料列表页的“点空白返回”靠它 */
try { localStorage.setItem('shadowing:last', location.pathname) } catch(e){}

/* ---- 大纲：按主题跳，343 句不用从上往下翻 ---- */
(function buildToc(){
  if (!OUTLINE.length) { document.getElementById('toc').remove(); return }
  const box = document.getElementById('toc');
  OUTLINE.forEach((c, k) => {
    const b = document.createElement('button');
    b.className = 'ch';
    const end = (k + 1 < OUTLINE.length) ? OUTLINE[k+1].i : S.length;
    b.dataset.from = c.i; b.dataset.to = end;
    b.innerHTML = '<span class="tt">' + fmt(S[c.i].start) + '</span>' + esc(c.title) +
                  '<span class="tn">' + (end - c.i) + ' 句</span>';
    b.onclick = () => {
      document.getElementById('list').style.display = 'none';
      goto(c.i, true);
    };
    box.appendChild(b);
  });
})();

S.forEach((s, i) => {
  const li = document.createElement('li');
  li.innerHTML = '<span class="ts">' + fmt(s.start) + '</span>' + htmlOf(s);
  li.onclick = ev => {
    if (ev.target.closest('.w')) return;
    document.getElementById('list').style.display = 'none'; goto(i, true);
  };
  document.getElementById('ol').appendChild(li);
});
function fmt(t){ const m = Math.floor(t/60), x = Math.floor(t%60); return m + ':' + String(x).padStart(2,'0') }

/* ---- restore ---- */
rate = LS.get('rate', 1);
document.getElementById('rate').textContent = '速率 ' + (rate === 1 ? '1×' : rate + '×');
cur = Math.min(LS.get('pos', 0), S.length - 1);
render();
buildWordList();
</script>
</body>
