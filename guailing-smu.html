<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>影子跟读 · 谷爱凌 · SMU 对谈</title>
<style>
:root{
  --bg:#111214; --fg:#f2f3f5; --dim:#8b8f96; --line:#2a2d32;
  --accent:#c9a227; --card:#1a1c1f; --mark:#e8c14a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;width:100%;overflow-x:hidden}
body{
  background:var(--bg);color:var(--fg);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  overscroll-behavior:none;
}
header{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
header .t{font-size:13px;color:var(--dim);flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{
  flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--fg);
  border-radius:8px;padding:7px 10px;font-size:13px;white-space:nowrap;
}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 8px;min-height:0}
#idx{font-size:12px;letter-spacing:.1em;color:var(--accent);margin-bottom:12px}
#cue{
  font-size:clamp(21px,6vw,32px);line-height:1.55;font-weight:500;
  overflow-wrap:anywhere;
}
/* rough order matters: .k (candidate) < .ph (chunk) < .on (she marked it) */
.w{display:inline}
.w.ph{border-bottom:2px dashed rgba(201,162,39,.42)}
.w.k{color:#9fd6d0;border-bottom:1px dotted rgba(159,214,208,.45)}
.w.on{color:var(--mark);font-weight:600;border-bottom:2px solid var(--mark)}
#hint{margin-top:14px;font-size:12px;color:#5c6169;line-height:1.7}
#neigh{margin-top:20px;font-size:15px;line-height:1.6;color:var(--dim);overflow-wrap:anywhere}
#neigh .lbl{font-size:11px;letter-spacing:.1em;color:#5c6169;display:block;margin:14px 0 3px}
#neigh .p{opacity:.6}
#flash{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.88);padding:18px 26px;border-radius:16px;
  font-size:19px;display:none;text-align:center;z-index:40;white-space:nowrap;
}
footer{
  flex:0 0 auto;border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);
}
.row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.row+.row{margin-top:8px}
button.b{
  flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--fg);
  border-radius:12px;padding:14px 6px;font-size:16px;font-weight:500;
  min-height:52px;display:flex;align-items:center;justify-content:center;gap:5px;
  white-space:nowrap;
}
button.b:active{background:#25282d}
button.b.pri{background:var(--accent);color:#161616;border-color:var(--accent);font-weight:600}
button.b.on{background:rgba(201,162,39,.20);border-color:var(--accent);color:var(--accent)}
button.b:disabled{opacity:.32}
#list,#words{display:none;position:fixed;inset:0;background:var(--bg);overflow-y:auto;
  -webkit-overflow-scrolling:touch;padding:calc(12px + env(safe-area-inset-top)) 0 40px}
#list{z-index:50} #words{z-index:55}
#list .hdr,#words .hdr{display:flex;align-items:center;gap:10px;padding:0 14px 12px;
  position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line)}
#list .hdr button,#words .hdr button{background:none;border:1px solid var(--line);color:var(--fg);
  border-radius:8px;padding:8px 12px;font-size:14px}
#list ol{list-style:none;margin:0;padding:0}
#list li{padding:12px 16px;border-bottom:1px solid #1e2024;font-size:17px;line-height:1.55}
#list li .ts{display:block;font-size:11px;color:#5c6169;font-variant-numeric:tabular-nums;margin-bottom:3px}
#list li.cur{background:rgba(201,162,39,.10)}
#wlist{padding:12px 16px;font-size:19px;line-height:1.6}
#wlist .wd{padding:11px 2px;border-bottom:1px solid #1e2024}
#wlist .wd b{display:block;color:#e8c46a;font-size:15px}
#wlist .wd span{display:block;margin-top:3px;font-size:13.5px;line-height:1.5;color:#aab0b8}
#wlist .wd .cnt{color:#7f868f;font-size:12px;margin-top:4px}
</style>
</head>
<body>
<header>
  <span class="t">谷爱凌 · SMU 对谈</span>
  <button id="save" onclick="fetch(location.href).then(r=>r.blob()).then(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=document.title.replace(/·/g,'-').replace(/\s+/g,'')+'.html';document.body.appendChild(a);a.click();a.remove()}).catch(e=>alert('存不下来：'+e.message))">存到手机</button>
  <button id="open">目录</button>
</header>

<main id="scroll">
  <div id="idx"></div>
  <div id="cue"></div>
  <div id="hint">
    点一个<b style="color:#9fd6d0">单词</b> → 标记它并出释义；点一个<b style="color:#e8c46a">语块</b>（虚线下划线那种，如 sought after）→ 整块一起标记。<br>
    标过的词，<b style="color:#8b8f96">别的材料里也会亮着</b>（生词本是共用的）。
  </div>
  <div id="neigh">
    <span class="lbl">上 一 句</span><div class="p" id="prev"></div>
    <span class="lbl">下 一 句</span><div id="next"></div>
  </div>
</main>

<footer>
  <div class="row">
    <button class="b" id="back">← 上一句</button>
    <button class="b pri" id="play">▶ 播这句</button>
    <button class="b" id="fwd">下一句 →</button>
  </div>
  <div class="row">
    <button class="b" id="loop">🔁 循环</button>
    <button class="b" id="shadow">🎙 跟读留白</button>
    <button class="b" id="rate">速率 1×</button>
  </div>
</footer>

<div id="flash"></div>

<style>
#def{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:#16181c;border-top:1px solid #2a2d33;padding:14px 16px 16px;box-shadow:0 -8px 24px rgba(0,0,0,.45)}
#def .dw{font-size:17px;font-weight:600;color:#e8c46a;margin-bottom:6px}
#def .dd{font-size:14.5px;line-height:1.55;color:#d7dae0;max-height:40vh;overflow-y:auto}
#def button{margin-top:10px;background:none;border:1px solid #2f333a;color:#9aa0a8;border-radius:8px;padding:6px 12px;font-size:13px}
</style>
<div id="def"></div>

<div id="list">
  <div class="hdr">
    <button id="close">✕ 关闭</button>
    <span style="flex:1;font-size:14px;color:var(--dim)">全文 · 点一句跳到那里（点词只标词）</span>
  </div>
  <ol id="ol"></ol>
</div>

<div id="words">
  <div class="hdr">
    <button id="wclose">✕ 关闭</button>
    <span style="flex:1;font-size:14px;color:var(--dim)">我的生词本 · 点一个取消标记</span>
  </div>
  <div id="wlist"></div>
</div>

<audio id="au" preload="auto" playsinline></audio>
<script id="aud" type="text/plain"></script>

cademic institution, like you said in your opening remarks, I think that.", "html": "<span class=\"w\" data-w=\"always\">Always</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"an\">an</span> <span class=\"w k\" data-w=\"academic\">academic</span> <span class=\"w k\" data-w=\"institution\">institution,</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"said\">said</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"your\">your</span> <span class=\"w ph\" data-w=\"opening remarks\">opening remarks,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"that\">that.</span>"}, {"i": 7, "start": 48.18, "end": 53.24, "dur": 5.06, "text": "Schools are such a microcosm for human flourishing and it.", "html": "<span class=\"w\" data-w=\"schools\">Schools</span> <span class=\"w\" data-w=\"are\">are</span> <span class=\"w\" data-w=\"such\">such</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w k\" data-w=\"microcosm\">microcosm</span> <span class=\"w\" data-w=\"for\">for</span> <span class=\"w\" data-w=\"human\">human</span> <span class=\"w k\" data-w=\"flourishing\">flourishing</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"it\">it.</span>"}, {"i": 8, "start": 53.24, "end": 59.43, "dur": 6.19, "text": "Really is a place where our highest values are realized, and we have the opportunity and the options to become who we want to be.", "html": "<span class=\"w\" data-w=\"really\">Really</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"place\">place</span> <span class=\"w\" data-w=\"where\">where</span> <span class=\"w\" data-w=\"our\">our</span> <span class=\"w\" data-w=\"highest\">highest</span> <span class=\"w\" data-w=\"values\">values</span> <span class=\"w\" data-w=\"are\">are< const VOCAB = {} || {};         // 跨材料的生词本：词 -> 出现过几篇材料

const RATES = [0.6, 0.75, 0.9, 1.0];

const LS = {
  get(k, d){ try { const v = localStorage.getItem(KEY + ':' + k); return v === null ? d : JSON.parse(v) } catch(e){ return d } },
  set(k, v){ try { localStorage.setItem(KEY + ':' + k, JSON.stringify(v)) } catch(e){} }
};

function say(t){ flash.textContent = t; flash.style.display = 'block' }
function unsay(){ flash.style.display = 'none' }
function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;') }

/* ---- audio: base64 -> Blob URL. iOS Safari will not seek a data: URI ---- */
(function initAudio(){
  try {
    au.src = 'audio.mp3'; au.load();
au.addEventListener('error', () => say('音频加载失败'));

/* ---- marked words / chunks ---- */
/* 把旧版按材料分开存的标记（<标题>:marks）并进共用生词本，别丢了她已经标过的词 */
(function migrateOldMarks(){
  try {
    const seen = [];
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && k !== KEY + ':marks' && /:marks$/.test(k)){
        try { (JSON.parse(localStorage.getItem(k)) || []).forEach(w => seen.push(w)) } catch(e){}
      }
    }
    if (!seen.length) return;
    const cur = new Set(LS.get('marks', []));
    seen.forEach(w => { if (w) cur.add(w) });
    LS.set('marks', Array.from(cur));
  } catch(e){}
})();

const marks = new Set(Object.keys(VOCAB).concat(LS.get('marks', [])));

function htmlOf(s){
  // build_page.py 已经把词和语块包好了；万一没有就退回逐词包
  if (s.html) return s.html;
  return String(s.text).split(/(\s+)/).map(tok =>
    /^\s*$/.test(tok) ? tok
      : '<span class="w" data-w="' + tok.toLowerCase().replace(/[^a-z']/g, '') + '">' + esc(tok) + '</span>').join('');
}

function toggleMark(k, on){
  if (!k) return;
  if (on === undefined) on = !marks.has(k);
  if (on) marks.add(k); else marks.delete(k);
  LS.set('marks', Array.from(marks));
  syncTerm(k, on);
  paintAll();
}

/* 写回 Mac 上的共用生词本；离线/存到手机时静默失败，不影响本地使用 */
function syncTerm(k, on){
  try {
    fetch('api/mark', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ term: k, on: on, material: MATERIAL })
    }).catch(() => {});
  } catch(e){}
}

function paintAll(){
  document.querySelectorAll('.w').forEach(el => el.classList.toggle('on', marks.has(el.dataset.w)));
  buildWordList();
  paintIdx();
}

function defOf(k){
  if (D[k]) return D[k];
  const parts = String(k).split(/\s+/).map(w => D[w]).filter(Boolean);
  if (parts.length) return { w: k, d: parts.map(p => (p.w || '') + '：' + (p.d || '')).join('　／　') };
  return null;
}

function buildWordList(){
  const box = document.getElementById('wlist');
  const list = Array.from(marks).sort();
  if (!list.length){ box.innerHTML = '<div class="wd"><span>还没有标记的词</span></div>'; return }
  box.innerHTML = list.map(k => {
    const e = defOf(k), times = VOCAB[k] || 0;
    return '<div class="wd" data-w="' + esc(k) + '"><b>' + esc(k) + '</b><span>'
      + esc(e ? e.d : '词典未收录（专有名词／术语）—— 告我一声我手工补上') + '</span>'
      + (times > 1 ? '<div class="cnt">在你 ' + times + ' 篇材料里出现过 —— 高频，优先记</div>' : '')
      + '</div>';
  }).join('');
}

function paintIdx(){
  const s = S[cur];
  idxEl.textContent = '第 ' + (cur + 1) + ' / ' + S.length + ' 句 · ' + s.dur.toFixed(1) + ' 秒'
    + (marks.size ? '  ·  生词本 ' + marks.size + ' 条（点这里看）' : '');
}

/* ---- rendering ---- */
function render(){
  const s = S[cur];
  cue.innerHTML = htmlOf(s);
  document.getElementById('prev').innerHTML = cur > 0 ? htmlOf(S[cur-1]) : '—';
  document.getElementById('next').innerHTML = cur < S.length - 1 ? htmlOf(S[cur+1]) : '—';
  document.getElementById('back').disabled = cur === 0;
  document.getElementById('fwd').disabled = cur === S.length - 1;
  document.querySelectorAll('#ol li').forEach((li, i) => li.classList.toggle('cur', i === cur));
  paintIdx();
  LS.set('pos', cur);
}

/* ---- playback ---- */
function killLoop(){
  clearTimeout(timer); clearInterval(timer);
  if (raf) cancelAnimationFrame(raf);
  raf = null; tickEnd = 0;
}
function playSeg(done){
  const s = S[cur];
  killLoop();
  const begin = () => {
    try { au.currentTime = Math.max(0, s.start - 0.15) } catch(e){}
    au.playbackRate = rate;
    const p = au.play();
    if (p && p.catch) p.catch(err => say('播放不了：' + err.message));
    tickEnd = s.end;
    const tick = () => {
      if (au.currentTime >= tickEnd){
        try { au.pause() } catch(e){}
        raf = null; tickEnd = 0;
        if (done) done();
        return;
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  };
  if (au.readyState >= 1 && isFinite(au.duration) && au.duration > 0) begin();
  else {
    au.addEventListener('loadedmetadata', begin, { once: true });
    try { au.load() } catch(e){ say('加载失败：' + e.message) }
  }
}
function goto(i, autoplay){
  if (i < 0 || i >= S.length) return;
  cur = i; render(); scroll.scrollTop = 0;
  if (autoplay){ unsay(); playSeg() }
}

/* ---- controls ---- */
document.getElementById('play').onclick = () => { unsay(); playSeg() };
document.getElementById('back').onclick = () => goto(cur - 1, true);
document.getElementById('fwd').onclick  = () => goto(cur + 1, true);

document.getElementById('loop').onclick = e => {
  loop = !loop; shadowing = false;
  e.currentTarget.classList.toggle('on', loop);
  document.getElementById('shadow').classList.remove('on');
  killLoop(); unsay();
  if (loop){ say('循环这一句'); loopNext() }
};
function loopNext(){
  if (!loop) return;
  playSeg(() => { if (loop) timer = setTimeout(loopNext, 250) });
}

document.getElementById('shadow').onclick = e => {
  shadowing = !shadowing; loop = false;
  e.currentTarget.classList.toggle('on', shadowing);
  document.getElementById('loop').classList.remove('on');
  killLoop(); unsay();
  if (shadowing){
    say('听 · 听完跟着说一遍');
    shadowStep();
  }
};
function shadowStep(){
  if (!shadowing) return;
  playSeg(() => {
    if (!shadowing) return;
    let n = Math.max(2, Math.round(S[cur].dur * 1.15));
    say('该你了 · ' + n + ' 秒');
    timer = setInterval(() => {
      n--;
      if (n <= 0){
        clearInterval(timer); unsay();
        if (shadowing && cur < S.length - 1){ cur++; render(); timer = setTimeout(shadowStep, 300) }
        else { shadowing = false; document.getElementById('shadow').classList.remove('on') }
      } else say('该你了 · ' + n + ' 秒');
    }, 1000);
  });
}

document.getElementById('rate').onclick = e => {
  rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
  e.currentTarget.textContent = '速率 ' + (rate === 1 ? '1×' : rate + '×');
  au.playbackRate = rate;
  LS.set('rate', rate);
};

/* ---- point at a word/chunk: mark it AND show its meaning ---- */
document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('.w,[data-w]');
  if (!el) return;
  const k = el.dataset ? el.dataset.w : null;
  if (!k) return;
  e.preventDefault(); e.stopPropagation();
  toggleMark(k);
  if (!e.target.closest('#wlist')) showDef(k);   // 生词表里点 = 取消标记，不弹卡
}, true);

cue.addEventListener('click', e => {
  if (e.target.closest('.w')) return;
  unsay(); playSeg();
});

/* ---- 释义卡 ---- */
let defTimer = null;
function showDef(k){
  const box = document.getElementById('def');
  const e = defOf(k);
  box.innerHTML = '<div class="dw">' + esc(k) + '</div>'
    + '<div class="dd">' + esc(e ? e.d : '词典未收录（专有名词／术语）—— 告我一声我手工补上') + '</div>'
    + '<button id="dclose">知道了</button>';
  box.style.display = 'block';
  document.getElementById('dclose').onclick = ev => { ev.stopPropagation(); box.style.display = 'none' };
  clearTimeout(defTimer);
  defTimer = setTimeout(() => { box.style.display = 'none' }, 15000);
}
document.addEventListener('click', e => {
  const box = document.getElementById('def');
  if (box.style.display !== 'block') return;
  if (e.target.closest('#def') || e.target.closest('.w')) return;
  box.style.display = 'none';
});

/* ---- panels ---- */
document.getElementById('open').onclick = () => {
  document.querySelectorAll('#ol li').forEach((li, i) => { if (i === cur) li.scrollIntoView({ block: 'center' }) });
  document.getElementById('list').style.display = 'block';
};
document.getElementById('close').onclick = () => document.getElementById('list').style.display = 'none';
document.getElementById('wclose').onclick = () => document.getElementById('words').style.display = 'none';
idxEl.addEventListener('click', () => {
  if (marks.size){ buildWordList(); document.getElementById('words').style.display = 'block' }
});

S.forEach((s, i) => {
  const li = document.createElement('li');
  li.innerHTML = '<span class="ts">' + fmt(s.start) + '</span>' + htmlOf(s);
  li.onclick = ev => {
    if (ev.target.closest('.w')) return;
    document.getElementById('list').style.display = 'none'; goto(i, true);
  };
  document.getElementById('ol').appendChild(li);
});
function fmt(t){ const m = Math.floor(t/60), x = Math.floor(t%60); return m + ':' + String(x).padStart(2,'0') }

/* ---- restore ---- */
rate = LS.get('rate', 1);
document.getElementById('rate').textContent = '速率 ' + (rate === 1 ? '1×' : rate + '×');
cur = Math.min(LS.get('pos', 0), S.length - 1);
render();
buildWordList();
</script>
</body>
