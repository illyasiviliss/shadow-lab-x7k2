"<span class=\"w\" data-w=\"the\">The</span> <span class=\"w\" data-w=\"more\">more</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"actually\">actually</span> <span class=\"w ph\" data-w=\"provide value\">provide value</span> <span class=\"w\" data-w=\"for\">for</span> <span class=\"w\" data-w=\"any\">any</span> <span class=\"w\" data-w=\"situation\">situation</span> <span class=\"w ph\" data-w=\"that you&#x27;re in\">that you&#x27;re in</span> <span class=\"w\" data-w=\"because\">because.</span>"}, {"i": 224, "start": 1604.53, "end": 1610.97, "dur": 6.44, "text": "You want to provide, you want to make something better, and only you can do it because only you have those skills.", "zh": "你想提供，你想让事情更好，只有你能做到，因为只有你有那些技能。", "clip": "clips/224.mp4", "html": "<span class=\"w\" data-w=\"you\">You</span> <span class=\"w\" data-w=\"want\">want</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"provide\">provide,</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"want\">want</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"make something better\">make something better,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w ph\" data-w=\"only you can do it\">only you can do it</span> <span class=\"w\" data-w=\"because\">because</span> <span class=\"w\" data-w=\"only\">only</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w\" data-w=\"those\">those</span> <span class=\"w\" data-w=\"skills\">skills.</span>"}, {"i": 225, "start": 1611.1, "end": 1618.42, "dur": 7.32, "text": "So yeah, I think that everybody has inherent value, irrespective of kind of this, you know.", "zh": "所以是的，我认为每个人都有内在价值，不管这种，你知道。", "clip": "clips/225.mp4", "html": "<span class=\"w\" data-w=\"so\">So</span> <span class=\"w\" data-w=\"yeah\">yeah,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"everybody\">everybody</span> <span class=\"w\" data-w=\"has\">has</span> <span class=\"w ph\" data-w=\"inherent value\">inherent value,</span> <span class=\"w ph\" data-w=\"irrespective of\">irrespective of</span> <span class=\"w\" data-w=\"kind\">kind</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"this\">this,</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"know\">know.</span>"}, {"i": 226, "start": 1618.77, "end": 1622.09, "dur": 3.32, "text": "Bedrock or the foundations from which they rose.", "zh": "基石或他们崛起的基础。", "clip": "clips/226.mp4", "html": "<span class=\"w k\" data-w=\"bedrock\">Bedrock</span> <span class=\"w\" data-w=\"or\">or</span> <span class=\"w ph\" data-w=\"the foundations from which\">the foundations from which</span> <span class=\"w\" data-w=\"they\">they</span> <span class=\"w\" data-w=\"rose\">rose.</span>"}, {"i": 227, "start": 1622.77, "end": 1633.6, "dur": 10.83, "text": "It's a good segue, you know we've been talking about systems of support, but also discovering oneself, one skills, developing one's own toolkit and so forth.", "zh": "这是一个很好的过渡，你知道我们一直在谈论支持系统，但也发现自我，技能，发展自己的工具箱等等。", "clip": "clips/227.mp4", "html": "<span class=\"w\" data-w=\"it&#x27;s\">It&#x27;s</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"good\">good</span> <span class=\"w k\" data-w=\"segue\">segue,</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"know\">know</span> <span class=\"w\" data-w=\"we&#x27;ve\">we&#x27;ve</span> <span class=\"w\" data-w=\"been\">been</span> <span class=\"w\" data-w=\"talking\">talking</span> <span class=\"w\" data-w=\"about\">about</span> <span class=\"w ph\" data-w=\"systems of support\">systems of support,</span> <span class=\"w\" data-w=\"but\">but</span> <span class=\"w\" data-w=\"also\">also</span> <span class=\"w ph\" data-w=\"discovering oneself\">discovering oneself,</span> <span class=\"w\" data-w=\"one\">one</span> <span class=\"w\" data-w=\"skills\">skills,</span> <span class=\"w\" data-w=\"developing\">developing</span> <span class=\"w\" data-w=\"one&#x27;s\">one&#x27;s</span> <span class=\"w\" data-w=\"own\">own</span> <span class=\"w k\" data-w=\"toolkit\">toolkit</span> <span class=\"w ph\" data-w=\"and so forth\">and so forth.</span>"}, {"i": 228, "start": 1633.64, "end": 1642.22, "dur": 8.58, "text": "But if we can help design an ecosystem, that is to support the next generation.", "zh": "但如果我们能帮助设计一个生态系统，那就是支持下一代。", "clip": "clips/228.mp4", "html": "<span class=\"w\" data-w=\"but\">But</span> <span class=\"w\" data-w=\"if\">if</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w ph\" data-w=\"help design\">help design</span> <span class=\"w\" data-w=\"an\">an</span> <span class=\"w k\" data-w=\"ecosystem\">ecosystem,</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"support\">support</span> <span class=\"w ph\" data-w=\"the next generation\">the next generation.</span>"}, {"i": 229, "start": 1642.37, "end": 1650.66, "dur": 8.29, "text": "What might that ecosystem look like, what are the elements of an ecosystem can be designed?", "zh": "那个生态系统会是什么样子，生态系统的元素可以设计成什么？", "clip": "clips/229.mp4", "html": "<span class=\"w\" data-w=\"what\">What</span> <span class=\"w\" data-w=\"might\">might</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w k\" data-w=\"ecosystem\">ecosystem</span> <span class=\"w ph\" data-w=\"look like\">look like,</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"are\">are</span> <span class=\"w ph\" data-w=\"the elements of\">the elements of</span> <span class=\"w\" data-w=\"an\">an</span> <span class=\"w k\" data-w=\"ecosystem\">ecosystem</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"designed\">designed?</span>"}, {"i": 230, "start": 1650.66, "end": 1653.64, "dur": 2.98, "text": "To help other people succeed.", "zh": "帮助其他人成功。", "clip": "clips/230.mp4", "html": "<span class=\"w\" data-w=\"to\">To</span> <span class=\"w ph\" data-w=\"help other people\">help other people</span> <span class=\"w\" data-w=\"succeed\">succeed.</span>"}, {"i": 231, "start": 1656.46, "end": 1664.74, "dur": 8.28, "text": "A few things, I think one is mutual respect that's really, really important for anything to succeed.", "zh": "几点，我认为一是相互尊重，这对任何事情成功都非常重要。", "clip": "clips/231.mp4", "html": "<span class=\"w\" data-w=\"a\">A</span> <span class=\"w\" data-w=\"few\">few</span> <span class=\"w\" data-w=\"things\">things,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"one\">one</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w ph\" data-w=\"mutual respect\">mutual respect</span> <span class=\"w\" data-w=\"that&#x27;s\">that&#x27;s</span> <span class=\"w\" data-w=\"really\">really,</span> <span class=\"w\" data-w=\"really\">really</span> <span class=\"w ph\" data-w=\"important for\">important for</span> <span class=\"w\" data-w=\"anything\">anything</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"succeed\">succeed.</span>"}, {"i": 232, "start": 1664.74, "end": 1670.38, "dur": 5.64, "text": ",And that extends beyond just like the right for someone to exist. but it's also like.", "zh": "而且这不仅仅延伸到某人存在的权利，还像是。", "clip": "clips/232.mp4", "html": "<span class=\"w\" data-w=\"and\">,And</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w ph\" data-w=\"extends beyond\">extends beyond</span> <span class=\"w\" data-w=\"just\">just</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w ph\" data-w=\"the right for\">the right for</span> <span class=\"w\" data-w=\"someone\">someone</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"exist\">exist.</span> <span class=\"w\" data-w=\"but\">but</span> <span class=\"w\" data-w=\"it&#x27;s\">it&#x27;s</span> <span class=\"w\" data-w=\"also\">also</span> <span class=\"w\" data-w=\"like\">like.</span>"}, {"i": 233, "start": 1670.38, "end": 1678.77, "dur": 8.39, "text": "Genuinely giving space for someone's input and perspective and not holding a value system for whose voice is louder than someone else.", "zh": "真正给某人的输入和视角空间，不持有谁的 voice 更响亮的价值体系。", "clip": "clips/233.mp4", "html": "<span class=\"w k\" data-w=\"genuinely\">Genuinely</span> <span class=\"w ph\" data-w=\"giving space\">giving space</span> <span class=\"w\" data-w=\"for\">for</span> <span class=\"w\" data-w=\"someone&#x27;s\">someone&#x27;s</span> <span class=\"w k\" data-w=\"input\">input</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w k\" data-w=\"perspective\">perspective</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"not\">not</span> <span class=\"w\" data-w=\"holding\">holding</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w ph\" data-w=\"value system\">value system</span> <span class=\"w\" data-w=\"for\">for</span> <span class=\"w\" data-w=\"whose\">whose</span> <span class=\"w\" data-w=\"voice\">voice</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w ph\" data-w=\"louder than\">louder than</span> <span class=\"w\" data-w=\"someone\">someone</span> <span class=\"w\" data-w=\"else\">else.</span>"}, {"i": 234, "start": 1678.77, "end": 1685.87, "dur": 7.1, "text": "Whose opinions are more important than someone else? Everybody has something unique to say and to provide. And so I think.", "zh": "谁的意见比别人的更重要？每个人都有独特的东西要说和提供。所以我认为。", "clip": "clips/234.mp4", "html": "<span class=\"w\" data-w=\"whose\">Whose</span> <span class=\"w k\" data-w=\"opinions\">opinions</span> <span class=\"w\" data-w=\"are\">are</span> <span class=\"w ph\" data-w=\"more important than\">more important than</span> <span class=\"w\" data-w=\"someone\">someone</span> <span class=\"w\" data-w=\"else\">else?</span> <span class=\"w\" data-w=\"everybody\">Everybody</span> <span class=\"w\" data-w=\"has\">has</span> <span class=\"w\" data-w=\"something\">something</span> <span class=\"w ph\" data-w=\"unique to say\">unique to say</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"provide\">provide.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think.</span>"}, {"i": 235, "start": 1685.87, "end": 1692.74, "dur": 6.87, "text": "Bringing that student mentality into every interaction you have and really trying to say, okay, what can I learn?", "zh": "把那种学生心态带入每一次互动，真正试着说，好的，我能学到什么？", "clip": "clips/235.mp4", "html": "<span class=\"w\" data-w=\"bringing\">Bringing</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w ph\" data-w=\"student mentality\">student mentality</span> <span class=\"w\" data-w=\"into\">into</span> <span class=\"w ph\" data-w=\"every interaction\">every interaction</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"really\">really</span> <span class=\"w ph\" data-w=\"trying to say\">trying to say,</span> <span class=\"w\" data-w=\"okay\">okay,</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"learn\">learn?</span>"}, {"i": 236, "start": 1692.74, "end": 1699.15, "dur": 6.41, "text": "From this encounter, I think that's really important. Secondly, I think curiosity is really important so.", "zh": "从这次相遇中，我认为那真的很重要。其次，我认为好奇心真的很重要，所以。", "clip": "clips/236.mp4", "html": "<span class=\"w ph\" data-w=\"from this encounter\">From this encounter,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"that&#x27;s\">that&#x27;s</span> <span class=\"w\" data-w=\"really\">really</span> <span class=\"w\" data-w=\"important\">important.</span> <span class=\"w\" data-w=\"secondly\">Secondly,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w ph\" data-w=\"curiosity is really important\">curiosity is really important</span> <span class=\"w\" data-w=\"so\">so.</span>"}, {"i": 237, "start": 1699.15, "end": 1707.42, "dur": 8.27, "text": "Just always holding a microscope to all the things in life. And coming back to the point in AI, that's a great tool to have to enable.", "zh": "总是对生活中的所有事情保持显微镜。回到 AI 的点，那是一个很好的工具，可以启用。", "clip": "clips/237.mp4", "html": "<span class=\"w\" data-w=\"just\">Just</span> <span class=\"w\" data-w=\"always\">always</span> <span class=\"w ph\" data-w=\"holding a microscope\">holding a microscope</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"all\">all</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"things\">things</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"life\">life.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w ph\" data-w=\"coming back to\">coming back to</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"point\">point</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"ai\">AI,</span> <span class=\"w\" data-w=\"that&#x27;s\">that&#x27;s</span> <span class=\"w ph\" data-w=\"a great tool\">a great tool</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w k\" data-w=\"enable\">enable.</span>"}, {"i": 238, "start": 1707.42, "end": 1715.77, "dur": 8.35, "text": "Curiosity and to really just superpower it. And so I think that's super important. The third is probably resilience and.", "zh": "好奇心，真正超级增强它。所以我认为那超级重要。第三可能是韧性，还有。", "clip": "clips/238.mp4", "html": "<span class=\"w k\" data-w=\"curiosity\">Curiosity</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"really\">really</span> <span class=\"w\" data-w=\"just\">just</span> <span class=\"w k\" data-w=\"superpower\">superpower</span> <span class=\"w\" data-w=\"it\">it.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"that&#x27;s\">that&#x27;s</span> <span class=\"w ph\" data-w=\"super important\">super important.</span> <span class=\"w ph\" data-w=\"the third is\">The third is</span> <span class=\"w\" data-w=\"probably\">probably</span> <span class=\"w k\" data-w=\"resilience\">resilience</span> <span class=\"w\" data-w=\"and\">and.</span>"}, {"i": 239, "start": 1715.77, "end": 1723.84, "dur": 8.07, "text": "No skill is objectively difficult because on two different days, I can be equally stressed about going to dinner.", "zh": "没有技能是客观困难的，因为在不同的两天，我可能同样为去吃饭感到压力。", "clip": "clips/239.mp4", "html": "<span class=\"w\" data-w=\"no\">No</span> <span class=\"w\" data-w=\"skill\">skill</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w ph\" data-w=\"objectively difficult\">objectively difficult</span> <span class=\"w\" data-w=\"because\">because</span> <span class=\"w\" data-w=\"on\">on</span> <span class=\"w\" data-w=\"two\">two</span> <span class=\"w\" data-w=\"different\">different</span> <span class=\"w\" data-w=\"days\">days,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w k\" data-w=\"equally\">equally</span> <span class=\"w ph\" data-w=\"stressed about\">stressed about</span> <span class=\"w\" data-w=\"going\">going</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"dinner\">dinner.</span>"}, {"i": 240, "start": 1723.84, "end": 1731.73, "dur": 7.89, "text": "And doing a trick that I've never done before. And it depends on probably how much sleep I got, how resilient I feel it's more about.", "zh": "做一个我以前从没做过的动作。这取决于我睡了多久，我感觉自己有多能扛，更多是关于。", "clip": "clips/240.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"doing\">doing</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"trick\">trick</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"i&#x27;ve\">I&#x27;ve</span> <span class=\"w\" data-w=\"never\">never</span> <span class=\"w\" data-w=\"done\">done</span> <span class=\"w\" data-w=\"before\">before.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w ph\" data-w=\"depends on\">depends on</span> <span class=\"w\" data-w=\"probably\">probably</span> <span class=\"w ph\" data-w=\"how much\">how much</span> <span class=\"w\" data-w=\"sleep\">sleep</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"got\">got,</span> <span class=\"w\" data-w=\"how\">how</span> <span class=\"w k\" data-w=\"resilient\">resilient</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"feel\">feel</span> <span class=\"w\" data-w=\"it&#x27;s\">it&#x27;s</span> <span class=\"w\" data-w=\"more\">more</span> <span class=\"w\" data-w=\"about\">about.</span>"}, {"i": 241, "start": 1731.73, "end": 1736.61, "dur": 4.88, "text": "How well prepared I feel I can deal with any adversity.", "zh": "我感觉自己准备得有多充分，能应对任何逆境。", "clip": "clips/241.mp4", "html": "<span class=\"w\" data-w=\"how\">How</span> <span class=\"w\" data-w=\"well\">well</span> <span class=\"w\" data-w=\"prepared\">prepared</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"feel\">feel</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w ph\" data-w=\"deal with\">deal with</span> <span class=\"w\" data-w=\"any\">any</span> <span class=\"w k\" data-w=\"adversity\">adversity.</span>"}, {"i": 242, "start": 1736.61, "end": 1740.89, "dur": 4.28, "text": "And so the higher our tolerance, our threshold, our resilience generally is.", "zh": "所以我们的容忍度、阈值、韧性整体上越高。", "clip": "clips/242.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"higher\">higher</span> <span class=\"w\" data-w=\"our\">our</span> <span class=\"w k\" data-w=\"tolerance\">tolerance,</span> <span class=\"w\" data-w=\"our\">our</span> <span class=\"w k\" data-w=\"threshold\">threshold,</span> <span class=\"w\" data-w=\"our\">our</span> <span class=\"w k\" data-w=\"resilience\">resilience</span> <span class=\"w\" data-w=\"generally\">generally</span> <span class=\"w\" data-w=\"is\">is.</span>"}, {"i": 243, "start": 1740.89, "end": 1745.85, "dur": 4.96, "text": "I think it's like having a higher tolerance for life, I think is generally a good skill to have.", "zh": "我觉得这就像对生活有更高的容忍度，这通常是个好技能。", "clip": "clips/243.mp4", "html": "<span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"it&#x27;s\">it&#x27;s</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w\" data-w=\"having\">having</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"higher\">higher</span> <span class=\"w ph\" data-w=\"tolerance for\">tolerance for</span> <span class=\"w\" data-w=\"life\">life,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"generally\">generally</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"good\">good</span> <span class=\"w\" data-w=\"skill\">skill</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"have\">have.</span>"}, {"i": 244, "start": 1746.1, "end": 1753.1, "dur": 7.0, "text": "And then, of course, community and community is more than just you know, people who you like and who you feel.", "zh": "然后，当然，社区，社区不仅仅是，你知道，你喜欢的人和你感觉。", "clip": "clips/244.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"then\">then,</span> <span class=\"w ph\" data-w=\"of course\">of course,</span> <span class=\"w k\" data-w=\"community\">community</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w k\" data-w=\"community\">community</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w ph\" data-w=\"more than just\">more than just</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"know\">know,</span> <span class=\"w\" data-w=\"people\">people</span> <span class=\"w\" data-w=\"who\">who</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"who\">who</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"feel\">feel.</span>"}, {"i": 245, "start": 1753.1, "end": 1759.0, "dur": 5.9, "text": "you know, care about you and who you care about, but it's also what helps you craft legacy.", "zh": "你知道，关心你的人和你关心的人，但它也是帮助你塑造传承的东西。", "clip": "clips/245.mp4", "html": "<span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"know\">know,</span> <span class=\"w ph\" data-w=\"care about\">care about</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"who\">who</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"care\">care</span> <span class=\"w\" data-w=\"about\">about,</span> <span class=\"w\" data-w=\"but\">but</span> <span class=\"w\" data-w=\"it&#x27;s\">it&#x27;s</span> <span class=\"w\" data-w=\"also\">also</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"helps\">helps</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w k\" data-w=\"craft\">craft</span> <span class=\"w k\" data-w=\"legacy\">legacy.</span>"}, {"i": 246, "start": 1759.0, "end": 1764.02, "dur": 5.02, "text": "More than anything, your impact on the world is probably most profound on the people who are closest to you.", "zh": "最重要的是，你对世界的影响可能最深远的是对你最亲近的人。", "clip": "clips/246.mp4", "html": "<span class=\"w ph\" data-w=\"more than anything\">More than anything,</span> <span class=\"w\" data-w=\"your\">your</span> <span class=\"w ph\" data-w=\"impact on\">impact on</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"world\">world</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"probably\">probably</span> <span class=\"w\" data-w=\"most\">most</span> <span class=\"w k\" data-w=\"profound\">profound</span> <span class=\"w\" data-w=\"on\">on</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"people\">people</span> <span class=\"w\" data-w=\"who\">who</span> <span class=\"w\" data-w=\"are\">are</span> <span class=\"w ph\" data-w=\"closest to\">closest to</span> <span class=\"w\" data-w=\"you\">you.</span>"}, {"i": 247, "start": 1764.02, "end": 1771.6, "dur": 7.58, "text": "And so that, I think, is really important. And I think about legacy as like an inflection point. So like you can map, okay, this is where.", "zh": "所以我觉得那真的很重要。我把传承看作一个拐点。所以你可以映射，好吧，这是哪里。", "clip": "clips/247.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"that\">that,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w versations that I've had pertaining to women leadership, one of the questions that's often asked is this, and I will.", "zh": "在我做过的许多关于女性领导力的对话中，经常被问到的一个问题是这个，我会。", "clip": "clips/252.mp4", "html": "<span class=\"w\" data-w=\"in\">In</span> <span class=\"w\" data-w=\"many\">many</span> <span class=\"w\" data-w=\"conversations\">conversations</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"i&#x27;ve\">I&#x27;ve</span> <span class=\"w\" data-w=\"had\">had</span> <span class=\"w ph\" data-w=\"pertaining to\">pertaining to</span> <span class=\"w\" data-w=\"women\">women</span> <span class=\"w\" data-w=\"leadership\">leadership,</span> <span class=\"w ph\" data-w=\"one of\">one of</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"questions\">questions</span> <span class=\"w\" data-w=\"that&#x27;s\">that&#x27;s</span> <span class=\"w\" data-w=\"often\">often</span> <span class=\"w\" data-w=\"asked\">asked</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"this\">this,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"will\">will.</span>"}, {"i": 253, "start": 1810.03, "end": 1817.13, "dur": 7.1, "text": "Ask the question of you as well. And that is, very often we have someone in our lives who advocate for us.", "zh": "也问你这个问题。那就是，很多时候我们生活中有人为我们倡导。", "clip": "clips/253.mp4", "html": "<span class=\"w\" data-w=\"ask\">Ask</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"question\">question</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w ph\" data-w=\"as well\">as well.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"is\">is,</span> <span class=\"w\" data-w=\"very\">very</span> <span class=\"w\" data-w=\"often\">often</span> <span class=\"w\" data-w=\"we\">we</s data-w=\"so\">so</span> <span class=\"w\" data-w=\"that&#x27;s\">that&#x27;s</span> <span class=\"w\" data-w=\"one\">one.</span>"}, {"i": 292, "start": 2077.81, "end": 2081.66, "dur": 3.85, "text": "But I think as far as creating your own pond, what I meant by that is.", "zh": "但我觉得关于创造你自己的池塘，我的意思是。", "clip": "clips/292.mp4", "html": "<span class=\"w\" data-w=\"but\">But</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w ph\" data-w=\"as far as\">as far as</span> <span class=\"w\" data-w=\"creating\">creating</span> <span class=\"w\" data-w=\"your\">your</span> <span class=\"w\" data-w=\"own\">own</span> <span class=\"w\" data-w=\"pond\">pond,</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w ph\" data-w=\"meant by\">meant by</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"is\">is.</span>"}, {"i": 293, "start": 2081.86, "end": 2089.61, "dur": 7.75, "text": "I'm going to take kind of like a woman's angle here because given it's also where that's kind of one of our themes for the discussion today, I think that,", "zh": "我要从女性的角度来谈，因为这也是我们今天讨论的主题之一，我觉得。", "clip": "clips/293.mp4", "html": "<span class=\"w\" data-w=\"i&#x27;m\">I&#x27;m</span> <span class=\"w\" data-w=\"going\">going</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"take\">take</span> <span class=\"w ph\" data-w=\"kind of like\">kind of like</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"woman&#x27;s\">woman&#x27;s</span> <span class=\"w k\" data-w=\"angle\">angle</span> <span class=\"w\" data-w=\"here\">here</span> <span class=\"w\" data-w=\"because\">because</span> <span class=\"w\" data-w=\"given\">given</span> <span class=\"w\" data-w=\"it&#x27;s\">it&#x27;s</span> <span class=\"w\" data-w=\"also\">also</span> <span class=\"w\" data-w=\"where\">where</span> <span class=\"w\" data-w=\"that&#x27;s\">that&#x27;s</span> <span class=\"w\" data-w=\"kind\">kind</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w ph\" data-w=\"one of\">one of</span> <span class=\"w\" data-w=\"our\">our</span> <span class=\"w k\" data-w=\"themes\">themes</span> <span class=\"w ph\" data-w=\"for the discussion\">for the discussion</span> <span class=\"w\" data-w=\"today\">today,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"that\">that,</span>"}, {"i": 294, "start": 2089.61, "end": 2093.47, "dur": 3.86, "text": "Now is a really interesting time to be a young woman.", "zh": "现在作为年轻女性是一个非常有趣的时期。", "clip": "clips/294.mp4", "html": "<span class=\"w\" data-w=\"now\">Now</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"really\">really</span> <span class=\"w k\" data-w=\"interesting\">interesting</span> <span class=\"w\" data-w=\"time\">time</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"young\">young</span> <span class=\"w\" data-w=\"woman\">woman.</span>"}, {"i": 295, "start": 2093.47, "end": 2102.33, "dur": 8.86, "text": "Because we have more career opportunities, more educational opportunities, more family opportunities, more support than any time in history.", "zh": "因为我们有比历史上任何时期都更多的职业机会、教育机会、家庭机会和支持。", "clip": "clips/295.mp4", "html": "<span class=\"w\" data-w=\"because\">Because</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w\" data-w=\"more\">more</span> <span class=\"w k\" data-w=\"career\">career</span> <span class=\"w\" data-w=\"opportunities\">opportunities,</span> <span class=\"w\" data-w=\"more\">more</span> <span class=\"w k\" data-w=\"educational\">educational</span> <span class=\"w\" data-w=\"opportunities\">opportunities,</span> <span class=\"w\" data-w=\"more\">more</span> <span class=\"w\" data-w=\"family\">family</span> <span class=\"w\" data-w=\"opportunities\">opportunities,</span> <span class=\"w\" data-w=\"more\">more</span> <span class=\"w\" data-w=\"support\">support</span> <span class=\"w\" data-w=\"than\">than</span> <span class=\"w\" data-w=\"any\">any</span> <span class=\"w\" data-w=\"time\">time</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"history\">history.</span>"}, {"i": 296, "start": 2102.36, "end": 2110.61, "dur": 8.25, "text": "And what that means is that there is more space for us in places that have historically felt maybe a little competitive.", "zh": "这意味着在那些历史上可能感觉有点竞争激烈的地方，我们有更多空间。", "clip": "clips/296.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w ph\" data-w=\"what that means\">what that means</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"there\">there</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w ph\" data-w=\"more space for\">more space for</span> <span class=\"w\" data-w=\"us\">us</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"places\">places</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w k\" data-w=\"historically\">historically</span> <span class=\"w\" data-w=\"felt\">felt</span> <span class=\"w\" data-w=\"maybe\">maybe</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"little\">little</span> <span class=\"w k\" data-w=\"competitive\">competitive.</span>"}, {"i": 297, "start": 2110.71, "end": 2119.66, "dur": 8.95, "text": "And what I think that's interesting because you hear this phenomenon a lot of like there's one woman in the boardroom meeting or there's one woman on the ski team.", "zh": "我觉得这很有趣，因为你经常听到这种现象，比如董事会会议里只有一个女性，或者滑雪队里只有一个女性。", "clip": "clips/297.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"that&#x27;s\">that&#x27;s</span> <span class=\"w\" data-w=\"interesting\">interesting</span> <span class=\"w\" data-w=\"because\">because</span> <span class=\"w ph\" data-w=\"you hear this phenomenon\">you hear this phenomenon</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"lot\">lot</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w\" data-w=\"there&#x27;s\">there&#x27;s</span> <span class=\"w\" data-w=\"one\">one</span> <span class=\"w\" data-w=\"woman\">woman</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w k\" data-w=\"boardroom\">boardroom</span> <span class=\"w\" data-w=\"meeting\">meeting</span> <span class=\"w\" data-w=\"or\">or</span> <span class=\"w\" data-w=\"there&#x27;s\">there&#x27;s</span> <span class=\"w\" data-w=\"one\">one</span> <span class=\"w\" data-w=\"woman\">woman</span> <span class=\"w\" data-w=\"on\">on</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"ski\">ski</span> <span class=\"w\" data-w=\"team\">team.</span>"}, {"i": 298, "start": 2119.66, "end": 2127.69, "dur": 8.03, "text": "And what that breeds is this sense of like, okay, there's only space for one of us, and so by default, my competition is all women ever.", "zh": "这滋生了一种感觉，好吧，我们中只有一个位置，所以默认我的竞争对手永远是所有女性。", "clip": "clips/298.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w k\" data-w=\"breeds\">breeds</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"this\">this</span> <span class=\"w\" data-w=\"sense\">sense</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"like\">like,</span> <span class=\"w\" data-w=\"okay\">okay,</span> <span class=\"w\" data-w=\"there&#x27;s\">there&#x27;s</span> <span class=\"w\" data-w=\"only\">only</span> <span class=\"w ph\" data-w=\"space for\">space for</span> <span class=\"w\" data-w=\"one\">one</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"us\">us,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w ph\" data-w=\"by default\">by default,</span> <span class=\"w\" data-w=\"my\">my</span> <span class=\"w k\" data-w=\"competition\">competition</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"all\">all</span> <span class=\"w\" data-w=\"women\">women</span> <span class=\"w\" data-w=\"ever\">ever.</span>"}, {"i": 299, "start": 2127.69, "end": 2134.12, "dur": 6.43, "text": "But I want to reverse that and think about there's actually more seats in the room than one.", "zh": "但我想反过来想，实际上房间里的座位不止一个。", "clip": "clips/299.mp4", "html": "<span class=\"w\" data-w=\"but\">But</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"want\">want</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w k\" data-w=\"reverse\">reverse</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w ph\" data-w=\"think about\">think about</span> <span class=\"w\" data-w=\"there&#x27;s\">there&#x27;s</span> <span class=\"w\" data-w=\"actually\">actually</span> <span class=\"w\" data-w=\"more\">more</span> <span class=\"w k\" data-w=\"seats\">seats</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"room\">room</span> <span class=\"w\" data-w=\"than\">than</span> <span class=\"w\" data-w=\"one\">one.</span>"}, {"i": 300, "start": 2134.12, "end": 2142.67, "dur": 8.55, "text": "so the competition is very rarely other people, the competition is just yourself to be good enough to earn and to provide value.", "zh": "所以竞争很少是和其他人，竞争只是你自己要足够好去赢得并提供价值。", "clip": "clips/300.mp4", "html": "<span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w k\" data-w=\"competition\">competition</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"very\">very</span> <span class=\"w\" data-w=\"rarely\">rarely</span> <span class=\"w\" data-w=\"other\">other</span> <span class=\"w\" data-w=\"people\">people,</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w k\" data-w=\"competition\">competition</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"just\">just</span> <span class=\"w\" data-w=\"yourself\">yourself</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w ph\" data-w=\"good enough\">good enough</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w k\" data-w=\"earn\">earn</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"provide value\">provide value.</span>"}, {"i": 301, "start": 2142.67, "end": 2151.11, "dur": 8.44, "text": "And to earn that seat to be good enough to be there, but it's not about beating other people, it's about uplifting the entire community.", "zh": "去赢得那个座位，足够好到能在那里，但这不是关于打败别人，而是关于提升整个社区。", "clip": "clips/301.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"earn\">earn</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"seat\">seat</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w ph\" data-w=\"good enough\">good enough</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"there\">there,</span> <span class=\"w\" data-w=\"but\">but</span> <span class=\"w\" data-w=\"it&#x27;s\">it&#x27;s</span> <span class=\"w\" data-w=\"not\">not</span> <span class=\"w\" data-w=\"about\">about</span> <span class=\"w\" data-w=\"beating\">beating</span> <span class=\"w\" data-w=\"other\">other</span> <span class=\"w\" data-w=\"people\">people,</span> <span class=\"w\" data-w=\"it&#x27;s\">it&#x27;s</span> <span class=\"w\" data-w=\"about\">about</span> <span class=\"w ph\" data-w=\"uplifting the entire community\">uplifting the entire community.</span>"}, {"i": 302, "start": 2151.11, "end": 2159.91, "dur": 8.8, "text": "So that every single person ends up being better in the way that a rising tide raises all ships. And so I want to think about kind of.", "zh": "这样每个人最终都会变得更好，就像水涨船高。所以我想思考一下。", "clip": "clips/302.mp4", "html": "<span class=\"w\" data-w=\"so\">So</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w ph\" data-w=\"every single person\">every single person</span> <span class=\"w ph\" data-w=\"ends up\">ends up</span> <span class=\"w\" data-w=\"being\">being</span> <span class=\"w\" data-w=\"better\">better</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"way\">way</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w ph\" data-w=\"rising tide raises all ships\">rising tide raises all ships.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"want\">want</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"about\">about</span> <span class=\"w\" data-w=\"kind\">kind</span> <span class=\"w\" data-w=\"of\">of.</span>"}, {"i": 303, "start": 2159.91, "end": 2166.07, "dur": 6.16, "text": "Healthy competition, and in many ways no competition at all, because there's only one of you.", "zh": "健康的竞争，在很多方面根本没有竞争，因为只有一个你。", "clip": "clips/303.mp4", "html": "<span class=\"w\" data-w=\"healthy\">Healthy</span> <span class=\"w\" data-w=\"competition\">competition,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w ph\" data-w=\"in many ways\">in many ways</span> <span class=\"w ph\" data-w=\"no competition at all\">no competition at all,</span> <span class=\"w\" data-w=\"because\">because</span> <span class=\"w\" data-w=\"there&#x27;s\">there&#x27;s</span> <span class=\"w\" data-w=\"only\">only</span> <span class=\"w\" data-w=\"one\">one</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"you\">you.</span>"}, {"i": 304, "start": 2166.07, "end": 2173.12, "dur": 7.05, "text": "And only one person has the perspective and history and skill set that I mentioned earlier, and that's you.", "zh": "只有一个人拥有我之前提到的视角、历史和技能组合，那就是你。", "clip": "clips/304.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"only\">only</span> <span class=\"w\" data-w=\"one\">one</span> <span class=\"w\" data-w=\"person\">person</span> <span class=\"w\" data-w=\"has\">has</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w k\" data-w=\"perspective\">perspective</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"history\">history</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w ph\" data-w=\"skill set\">skill set</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w ph\" data-w=\"mentioned earlier\">mentioned earlier,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"that&#x27;s\">that&#x27;s</span> <span class=\"w\" data-w=\"you\">you.</span>"}, {"i": 305, "start": 2173.12, "end": 2179.91, "dur": 6.79, "text": "And every single person has unique value. And so the question is, how can you be the best version of yourself.", "zh": "每个人都有独特的价值。所以问题是，你如何成为最好的自己。", "clip": "clips/305.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w ph\" data-w=\"every single person\">every single person</span> <span class=\"w\" data-w=\"has\">has</span> <span class=\"w k\" data-w=\"unique\">unique</span> <span class=\"w\" data-w=\"value\">value.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"question\">question</span> <span class=\"w\" data-w=\"is\">is,</span> <span class=\"w\" data-w=\"how\">how</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w ph\" data-w=\"best version of yourself\">best version of yourself.</span>"}, {"i": 306, "start": 2179.91, "end": 2186.9, "dur": 6.99, "text": "So that you can provide the most value and help the most people and tell the most interesting and relevant stories.", "zh": "这样你就能提供最大的价值，帮助最多的人，讲述最有趣和相关的故事。", "clip": "clips/306.mp4", "html": "<span class=\"w\" data-w=\"so\">So</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w ph\" data-w=\"provide the most value\">provide the most value</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w ph\" data-w=\"help the most people\">help the most people</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"tell\">tell</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"most\">most</span> <span class=\"w\" data-w=\"interesting\">interesting</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w k\" data-w=\"relevant\">relevant</span> <span class=\"w\" data-w=\"stories\">stories.</span>"}, {"i": 307, "start": 2186.9, "end": 2194.25, "dur": 7.35, "text": "To to inflect that legacy point. and so in a lot of ways, the whole pond metaphor of like.", "zh": "来影响那个遗产点。所以很多时候，整个池塘的比喻就像。", "clip": "clips/307.mp4", "html": "<span class=\"w\" data-w=\"to\">To</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w k\" data-w=\"inflect\">inflect</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w k\" data-w=\"legacy\">legacy</span> <span class=\"w\" data-w=\"point\">point.</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w ph\" data-w=\"in a lot of ways\">in a lot of ways,</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"whole\">whole</span> <span class=\"w\" data-w=\"pond\">pond</span> <span class=\"w k\" data-w=\"metaphor\">metaphor</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"like\">like.</span>"}, {"i": 308, "start": 2194.25, "end": 2200.85, "dur": 6.6, "text": "Am I a big fish at a small pond or a small fish in a big pond, Stop looking at the other fish. It doesn't matter. Are there other fish or not.", "zh": "我是小池塘里的大鱼还是大池塘里的小鱼，别再盯着其他鱼了。没关系。有没有其他鱼不重要。", "clip": "clips/308.mp4", "html": "<span class=\"w\" data-w=\"am\">Am</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w ph\" data-w=\"big fish at a small pond\">big fish at a small pond</span> <span class=\"w\" data-w=\"or\">or</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w ph\" data-w=\"small fish in a big pond\">small fish in a big pond,</span> <span class=\"w ph\" data-w=\"stop looking at\">Stop looking at</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"other\">other</span> <span class=\"w\" data-w=\"fish\">fish.</span> <span class=\"w\" data-w=\"it\">It</span> <span class=\"w\" data-w=\"doesn&#x27;t\">doesn&#x27;t</span> <span class=\"w\" data-w=\"matter\">matter.</span> <span class=\"w\" data-w=\"are\">Are</span> <span class=\"w\" data-w=\"there\">there</span> <span class=\"w\" data-w=\"other\">other</span> <span class=\"w\" data-w=\"fish\">fish</span> <span class=\"w\" data-w=\"or\">or</span> <span class=\"w\" data-w=\"not\">not.</span>"}, {"i": 309, "start": 2200.85, "end": 2203.89, "dur": 3.04, "text": "Like do fish even exist, right, like we don't care.", "zh": "就像鱼到底存不存在，对吧，我们不在乎。", "clip": "clips/309.mp4", "html": "<span class=\"w\" data-w=\"like\">Like</span> <span class=\"w\" data-w=\"do\">do</span> <span class=\"w\" data-w=\"fish\">fish</span> <span class=\"w\" data-w=\"even\">even</span> <span class=\"w\" data-w=\"exist\">exist,</span> <span class=\"w\" data-w=\"right\">right,</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"don&#x27;t\">don&#x27;t</span> <span class=\"w\" data-w=\"care\">care.</span>"}, {"i": 310, "start": 2203.89, "end": 2210.86, "dur": 6.97, "text": "Be your own fish. And you can be a pretty fish. You can be a shiny fish. You can be a little fish. You can be a vegetarian fish. You can be.", "zh": "做你自己的鱼。你可以是一条漂亮的鱼。你可以是一条闪亮的鱼。你可以是一条小鱼。你可以是一条素食鱼。你可以是。", "clip": "clips/310.mp4", "html": "<span class=\"w\" data-w=\"be\">Be</span> <span class=\"w ph\" data-w=\"your own fish\">your own fish.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"pretty\">pretty</span> <span class=\"w\" data-w=\"fish\">fish.</span> <span class=\"w\" data-w=\"you\">You</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w k\" data-w=\"shiny\">shiny</span> <span class=\"w\" data-w=\"fish\">fish.</span> <span class=\"w\" data-w=\"you\">You</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"little\">little</span> <span class=\"w\" data-w=\"fish\">fish.</span> <span class=\"w\" data-w=\"you\">You</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w k\" data-w=\"vegetarian\">vegetarian</span> <span class=\"w\" data-w=\"fish\">fish.</span> <span class=\"w\" data-w=\"you\">You</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"be\">be.</span>"}, {"i": 311, "start": 2210.86, "end": 2219.81, "dur": 8.95, "text": "Whatever kind of fish you want to be, right, So I think that's a much more interesting and productive conversation than looking around and seeing what other fish are in the pond with you.", "zh": "任何你想成为的鱼，对吧，所以我觉得这比环顾四周看看池塘里还有哪些鱼要有趣和富有成效得多。", "clip": "clips/311.mp4", "html": "<span class=\"w\" data-w=\"whatever\">Whatever</span> <span class=\"w\" data-w=\"kind\">kind</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"fish\">fish</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"want\">want</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"be\">be,</span> <span class=\"w\" data-w=\"right\">right,</span> <span class=\"w\" data-w=\"so\">So</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"that&#x27;s\">that&#x27;s</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"much\">much</span> <span class=\"w\" data-w=\"more\">more</span> <span class=\"w\" data-w=\"interesting\">interesting</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w k\" data-w=\"productive\">productive</span> <span class=\"w\" data-w=\"conversation\">conversation</span> <span class=\"w\" data-w=\"than\">than</span> <span class=\"w ph\" data-w=\"looking around\">looking around</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"seeing\">seeing</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"other\">other</span> <span class=\"w\" data-w=\"fish\">fish</span> <span class=\"w\" data-w=\"are\">are</span> <span class=\"w ph\" data-w=\"in the pond with you\">in the pond with you.</span>"}, {"i": 312, "start": 2220.04, "end": 2225.35, "dur": 5.31, "text": "You know, there are just so many questions that I could ask, but I am mindful of the time.", "zh": "你知道，我有很多问题可以问，但我注意时间。", "clip": "clips/312.mp4", "html": "<span class=\"w\" data-w=\"you\">You</span> <span class=\"w\" data-w=\"know\">know,</span> <span class=\"w\" data-w=\"there\">there</span> <span class=\"w\" data-w=\"are\">are</span> <span class=\"w\" data-w=\"just\">just</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"many\">many</span> <span class=\"w\" data-w=\"questions\">questions</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"could\">could</span> <span class=\"w\" data-w=\"ask\">ask,</span> <span class=\"w\" data-w=\"but\">but</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"am\">am</span> <span class=\"w ph\" data-w=\"mindful of the time\">mindful of the time.</span>"}, {"i": 313, "start": 2225.35, "end": 2232.88, "dur": 7.53, "text": "So I'm going to give this last question to one of our students, and this is Huiin Sito.", "zh": "所以我把最后一个问题交给我们的一个学生，这是Huiin Sito。", "clip": "clips/313.mp4", "html": "<span class=\"w\" data-w=\"so\">So</span> <span class=\"w\" data-w=\"i&#x27;m\">I&#x27;m</span> <span class=\"w\" data-w=\"going\">going</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"give\">give</span> <span class=\"w\" data-w=\"this\">this</span> <span class=\"w ph\" data-w=\"last question\">last question</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"one of our students\">one of our students,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"this\">this</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"huiin\">Huiin</span> <span class=\"w\" data-w=\"sito\">Sito.</span>"}, {"i": 314, "start": 2232.88, "end": 2237.08, "dur": 4.2, "text": "Who is the class of 2027 BBM.", "zh": "她是2027届BBM的学生。", "clip": "clips/314.mp4", "html": "<span class=\"w\" data-w=\"who\">Who</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w ph\" data-w=\"class of\">class of</span> <span class=\"w\" data-w=\"\">2027</span> <span class=\"w\" data-w=\"bbm\">BBM.</span>"}, {"i": 315, "start": 2237.4, "end": 2245.72, "dur": 8.32, "text": "And she says, if you could ask yourself, sorry, if you could ask one question to your future self, what question would it be?", "zh": "她说，如果你能问自己，抱歉，如果你能问未来的自己一个问题，会是什么问题？", "clip": "clips/315.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"she\">she</span> <span class=\"w\" data-w=\"says\">says,</span> <span class=\"w\" data-w=\"if\">if</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"could\">could</span> <span class=\"w ph\" data-w=\"ask yourself\">ask yourself,</span> <span class=\"w\" data-w=\"sorry\">sorry,</span> <span class=\"w\" data-w=\"if\">if</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"could\">could</span> <span class=\"w\" data-w=\"ask\">ask</span> <span class=\"w\" data-w=\"one\">one</span> <span class=\"w\" data-w=\"question\">question</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"your\">your</span> <span class=\"w ph\" data-w=\"future self\">future self,</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"question\">question</span> <span class=\"w\" data-w=\"would\">would</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"be\">be?</span>"}, {"i": 316, "start": 2251.75, "end": 2261.25, "dur": 9.5, "text": "Only one what?", "zh": "只有一个，什么？", "clip": "clips/316.mp4", "html": "<span class=\"w\" data-w=\"only\">Only</span> <span class=\"w\" data-w=\"one\">one</span> <span class=\"w\" data-w=\"what\">what?</span>"}, {"i": 317, "start": 2262.84, "end": 2269.79, "dur": 6.95, "text": "Inputs or what things did you observe that you felt were the most productive.", "zh": "输入或者你观察到哪些事情你觉得最有成效。", "clip": "clips/317.mp4", "html": "<span class=\"w k\" data-w=\"inputs\">Inputs</span> <span class=\"w\" data-w=\"or\">or</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"things\">things</span> <span class=\"w\" data-w=\"did\">did</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w k\" data-w=\"observe\">observe</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"felt\">felt</span> <span class=\"w\" data-w=\"were\">were</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w ph\" data-w=\"most productive\">most productive.</span>"}, {"i": 318, "start": 2270.26, "end": 2275.04, "dur": 4.78, "text": "In finding the path that you cared about most.", "zh": "在找到你最关心的道路方面。", "clip": "clips/318.mp4", "html": "<span class=\"w\" data-w=\"in\">In</span> <span class=\"w ph\" data-w=\"finding the path\">finding the path</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w ph\" data-w=\"cared about most\">cared about most.</span>"}, {"i": 319, "start": 2275.27, "end": 2282.38, "dur": 7.11, "text": "So I think a lot of the time it's easy to follow direction or momentum, actually working hard is hard.", "zh": "所以我觉得很多时候很容易跟随方向或动力，实际上努力工作才是难的。", "clip": "clips/319.mp4", "html": "<span class=\"w\" data-w=\"so\">So</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w ph\" data-w=\"a lot of the time\">a lot of the time</span> <span class=\"w\" data-w=\"it&#x27;s\">it&#x27;s</span> <span class=\"w\" data-w=\"easy\">easy</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"follow direction\">follow direction</span> <span class=\"w\" data-w=\"or\">or</span> <span class=\"w k\" data-w=\"momentum\">momentum,</span> <span class=\"w\" data-w=\"actually\">actually</span> <span class=\"w ph\" data-w=\"working hard\">working hard</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"hard\">hard.</span>"}, {"i": 320, "start": 2282.38, "end": 2291.0, "dur": 8.62, "text": "But working hard is not as hard as finding the right direction, so you can work really hard and bang on a wall, and that does very little.", "zh": "但努力不如找对方向难，所以你可能拼命努力却撞墙，那没什么用。", "clip": "clips/320.mp4", "html": "<span class=\"w\" data-w=\"but\">But</span> <span class=\"w\" data-w=\"working\">working</span> <span class=\"w\" data-w=\"hard\">hard</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"not\">not</span> <span class=\"w\" data-w=\"as\">as</span> <span class=\"w\" data-w=\"hard\">hard</span> <span class=\"w\" data-w=\"as\">as</span> <span class=\"w\" data-w=\"finding\">finding</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"right\">right</span> <span class=\"w k\" data-w=\"direction\">direction,</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w ph\" data-w=\"work really hard\">work really hard</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w ph\" data-w=\"bang on a wall\">bang on a wall,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w ph\" data-w=\"does very little\">does very little.</span>"}, {"i": 321, "start": 2291.0, "end": 2296.46, "dur": 5.46, "text": "Whereas learning what the route is so you can walk around the wall is much more productive.", "zh": "而弄清楚路线，就能绕过墙，效率高得多。", "clip": "clips/321.mp4", "html": "<span class=\"w k\" data-w=\"whereas\">Whereas</span> <span class=\"w\" data-w=\"learning\">learning</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w k\" data-w=\"route\">route</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w ph\" data-w=\"walk around the wall\">walk around the wall</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w ph\" data-w=\"much more productive\">much more productive.</span>"}, {"i": 322, "start": 2296.46, "end": 2305.66, "dur": 9.2, "text": "So I want to learn the direction and then work hard in that direction, So I already trust in my ability to work intensely.", "zh": "所以我想先找准方向，再朝那个方向努力。我已经相信自己能高强度地工作。", "clip": "clips/322.mp4", "html": "<span class=\"w\" data-w=\"so\">So</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"want\">want</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"learn\">learn</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"direction\">direction</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"then\">then</span> <span class=\"w ph\" data-w=\"work hard\">work hard</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"direction\">direction,</span> <span class=\"w\" data-w=\"so\">So</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"already\">already</span> <span class=\"w ph\" data-w=\"trust in\">trust in</span> <span class=\"w\" data-w=\"my\">my</span> <span class=\"w ph\" data-w=\"ability to work\">ability to work</span> <span class=\"w k\" data-w=\"intensely\">intensely.</span>"}, {"i": 323, "start": 2305.66, "end": 2310.91, "dur": 5.25, "text": "And rigorously, and so I think what's probably more productive for me.", "zh": "而且很严谨，所以我觉得对我来说更有效的可能是。", "clip": "clips/323.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w k\" data-w=\"rigorously\">rigorously,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"what&#x27;s\">what&#x27;s</span> <span class=\"w\" data-w=\"probably\">probably</span> <span class=\"w ph\" data-w=\"more productive for me\">more productive for me.</span>"}, {"i": 324, "start": 2310.94, "end": 2317.06, "dur": 6.12, "text": "It is knowing what to observe and what inputs to give value to so that I can move in the right direction.", "zh": "知道该观察什么、该重视哪些输入，这样我才能朝正确的方向前进。", "clip": "clips/324.mp4", "html": "<span class=\"w\" data-w=\"it\">It</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"knowing\">knowing</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w k\" data-w=\"observe\">observe</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w k\" data-w=\"inputs\">inputs</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"give value to\">give value to</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w ph\" data-w=\"move in the right direction\">move in the right direction.</span>"}, {"i": 325, "start": 2317.66, "end": 2323.73, "dur": 6.07, "text": "That's wonderful, ladies and gentlemen, we have covered so much ground in a short time.", "zh": "太棒了，女士们先生们，我们在短时间内涵盖了很多内容。", "clip": "clips/325.mp4", "html": "<span class=\"w\" data-w=\"that&#x27;s\">That&#x27;s</span> <span class=\"w\" data-w=\"wonderful\">wonderful,</span> <span class=\"w ph\" data-w=\"ladies and gentlemen\">ladies and gentlemen,</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w ph\" data-w=\"covered so much ground\">covered so much ground</span> <span class=\"w ph\" data-w=\"in a short time\">in a short time.</span>"}, {"i": 326, "start": 2323.73, "end": 2332.11, "dur": 8.38, "text": "You know, testimony to Eileen's intellect, as well as her experience in life despite being 23 years old.", "zh": "这证明了Eileen的智慧，还有她的人生经验，尽管她才23岁。", "clip": "clips/326.mp4", "html": "<span class=\"w\" data-w=\"you\">You</span> <span class=\"w\" data-w=\"know\">know,</span> <span class=\"w ph\" data-w=\"testimony to\">testimony to</span> <span class=\"w\" data-w=\"eileen&#x27;s\">Eileen&#x27;s</span> <span class=\"w k\" data-w=\"intellect\">intellect,</span> <span class=\"w ph\" data-w=\"as well as\">as well as</span> <span class=\"w\" data-w=\"her\">her</span> <span class=\"w\" data-w=\"experience\">experience</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"life\">life</span> <span class=\"w k\" data-w=\"despite\">despite</span> <span class=\"w\" data-w=\"being\">being</span> <span class=\"w\" data-w=\"\">23</span> <span class=\"w ph\" data-w=\"years old\">years old.</span>"}, {"i": 327, "start": 2332.11, "end": 2339.2, "dur": 7.09, "text": "We've covered you know, everything from how we can train oneself both physically as well as intellectually.", "zh": "我们聊了，你知道，从如何在身体和智力上训练自己。", "clip": "clips/327.mp4", "html": "<span class=\"w\" data-w=\"we&#x27;ve\">We&#x27;ve</span> <span class=\"w\" data-w=\"covered\">covered</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"know\">know,</span> <span class=\"w\" data-w=\"everything\">everything</span> <span class=\"w\" data-w=\"from\">from</span> <span class=\"w\" data-w=\"how\">how</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w ph\" data-w=\"train oneself\">train oneself</span> <span class=\"w\" data-w=\"both\">both</span> <span class=\"w k\" data-w=\"physically\">physically</span> <span class=\"w ph\" data-w=\"as well as\">as well as</span> <span class=\"w k\" data-w=\"intellectually\">intellectually.</span>"}, {"i": 328, "start": 2339.2, "end": 2348.51, "dur": 9.31, "text": "Training the mind and the body. We've talked about how AI actually can be a positive rather than something to fear. We've talked about.", "zh": "训练心智和身体。我们谈了AI实际上可以是积极的，而不是让人恐惧的东西。我们谈了。", "clip": "clips/328.mp4", "html": "<span class=\"w ph\" data-w=\"training the mind\">Training the mind</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"body\">body.</span> <span class=\"w\" data-w=\"we&#x27;ve\">We&#x27;ve</span> <span class=\"w\" data-w=\"talked\">talked</span> <span class=\"w\" data-w=\"about\">about</span> <span class=\"w\" data-w=\"how\">how</span> <span class=\"w\" data-w=\"ai\">AI</span> <span class=\"w\" data-w=\"actually\">actually</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"positive\">positive</span> <span class=\"w ph\" data-w=\"rather than\">rather than</span> <span class=\"w ph\" data-w=\"something to fear\">something to fear.</span> <span class=\"w\" data-w=\"we&#x27;ve\">We&#x27;ve</span> <span class=\"w\" data-w=\"talked\">talked</span> <span class=\"w\" data-w=\"about\">about.</span>"}, {"i": 329, "start": 2348.51, "end": 2354.77, "dur": 6.26, "text": "The importance of mutual respect, of curiosity, of resilience, of community.", "zh": "相互尊重、好奇心、韧性、社区的重要性。", "clip": "clips/329.mp4", "html": "<span class=\"w\" data-w=\"the\">The</span> <span class=\"w\" data-w=\"importance\">importance</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w ph\" data-w=\"mutual respect\">mutual respect,</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w k\" data-w=\"curiosity\">curiosity,</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w k\" data-w=\"resilience\">resilience,</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w k\" data-w=\"community\">community.</span>"}, {"i": 330, "start": 2354.79, "end": 2361.8, "dur": 7.01, "text": "And the sense of inclusion and belonging in our journeys in life. And we've talked about how competition.", "zh": "以及人生旅程中的包容感和归属感。我们还谈了竞争。", "clip": "clips/330.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w ph\" data-w=\"sense of inclusion\">sense of inclusion</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w k\" data-w=\"belonging\">belonging</span> <span class=\"w ph\" data-w=\"in our journeys\">in our journeys</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"life\">life.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"we&#x27;ve\">we&#x27;ve</span> <span class=\"w\" data-w=\"talked\">talked</span> <span class=\"w\" data-w=\"about\">about</span> <span class=\"w\" data-w=\"how\">how</span> <span class=\"w\" data-w=\"competition\">competition.</span>"}, {"i": 331, "start": 2361.97, "end": 2370.26, "dur": 8.29, "text": "I's not necessarily that ugly thing where we're out at each other's throats, but that it is.", "zh": "不一定是那种丑陋的、互相掐脖子的东西，而是。", "clip": "clips/331.mp4", "html": "<span class=\"w\" data-w=\"i&#x27;s\">I&#x27;s</span> <span class=\"w ph\" data-w=\"not necessarily\">not necessarily</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"ugly\">ugly</span> <span class=\"w\" data-w=\"thing\">thing</span> <span class=\"w\" data-w=\"where\">where</span> <span class=\"w\" data-w=\"we&#x27;re\">we&#x27;re</span> <span class=\"w\" data-w=\"out\">out</span> <span class=\"w ph\" data-w=\"at each other&#x27;s throats\">at each other&#x27;s throats,</span> <span class=\"w\" data-w=\"but\">but</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"is\">is.</span>"}, {"i": 332, "start": 2370.26, "end": 2378.27, "dur": 8.01, "text": "About feeling empowered to try. It is about pushing each other to be better so that as a community, we are better.", "zh": "关于感到有力量去尝试。是关于推动彼此变得更好，这样作为一个社区，我们都会更好。", "clip": "clips/332.mp4", "html": "<span class=\"w\" data-w=\"about\">About</span> <span class=\"w ph\" data-w=\"feeling empowered\">feeling empowered</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"try\">try.</span> <span class=\"w\" data-w=\"it\">It</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"about\">about</span> <span class=\"w ph\" data-w=\"pushing each other\">pushing each other</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"better\">better</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w ph\" data-w=\"as a community\">as a community,</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"are\">are</span> <span class=\"w\" data-w=\"better\">better.</span>"}, {"i": 333, "start": 2378.58, "end": 2386.74, "dur": 8.16, "text": "And it is perhaps uplifting for the entire community where a rising tide as to use Eileen's words.", "zh": "这或许能提振整个社区，用Eileen的话说，水涨。", "clip": "clips/333.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"perhaps\">perhaps</span> <span class=\"w k\" data-w=\"uplifting\">uplifting</span> <span class=\"w\" data-w=\"for\">for</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"entire\">entire</span> <span class=\"w\" data-w=\"community\">community</span> <span class=\"w\" data-w=\"where\">where</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w ph\" data-w=\"rising tide\">rising tide</span> <span class=\"w\" data-w=\"as\">as</span> <span class=\"w ph\" data-w=\"to use eileen&#x27;s words\">to use Eileen&#x27;s words.</span>"}, {"i": 334, "start": 2386.74, "end": 2395.84, "dur": 9.1, "text": "Can raise all boats. And the one thing I've learned, there is such a thing as a vegetarian fish.", "zh": "船高。而我学到的一件事是，还真有素食鱼这回事。", "clip": "clips/334.mp4", "html": "<span class=\"w\" data-w=\"can\">Can</span> <span class=\"w ph\" data-w=\"raise all boats\">raise all boats.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"one\">one</span> <span class=\"w\" data-w=\"thing\">thing</span> <span class=\"w\" data-w=\"i&#x27;ve\">I&#x27;ve</span> <span class=\"w\" data-w=\"learned\">learned,</span> <span class=\"w\" data-w=\"there\">there</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w ph\" data-w=\"such a thing as\">such a thing as</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w k\" data-w=\"vegetarian\">vegetarian</span> <span class=\"w\" data-w=\"fish\">fish.</span>"}, {"i": 335, "start": 2397.17, "end": 2406.25, "dur": 9.08, "text": "Algae, yes, you're right, actually maybe all fish are vegeted, I don't know, okay, they're not all vegetarian.", "zh": "藻类，对，你说得对，其实也许所有鱼都是素食的，我不知道，好吧，它们不全是素食的。", "clip": "clips/335.mp4", "html": "<span class=\"w k\" data-w=\"algae\">Algae,</span> <span class=\"w\" data-w=\"yes\">yes,</span> <span class=\"w\" data-w=\"you&#x27;re\">you&#x27;re</span> <span class=\"w\" data-w=\"right\">right,</span> <span class=\"w\" data-w=\"actually\">actually</span> <span class=\"w\" data-w=\"maybe\">maybe</span> <span class=\"w\" data-w=\"all\">all</span> <span class=\"w\" data-w=\"fish\">fish</span> <span class=\"w\" data-w=\"are\">are</span> <span class=\"w\" data-w=\"vegeted\">vegeted,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"don&#x27;t\">don&#x27;t</span> <span class=\"w\" data-w=\"know\">know,</span> <span class=\"w\" data-w=\"okay\">okay,</span> <span class=\"w\" data-w=\"they&#x27;re\">they&#x27;re</span> <span class=\"w\" data-w=\"not\">not</span> <span class=\"w\" data-w=\"all\">all</span> <span class=\"w k\" data-w=\"vegetarian\">vegetarian.</span>"}, {"i": 336, "start": 2407.78, "end": 2416.1, "dur": 8.32, "text": "Wonderful, I would like to invite the audience in this hall that has been a tremendously attentive audience.", "zh": "太好了，我想邀请这个礼堂里的观众，你们一直非常专注。", "clip": "clips/336.mp4", "html": "<span class=\"w\" data-w=\"wonderful\">Wonderful,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w ph\" data-w=\"would like to invite\">would like to invite</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w k\" data-w=\"audience\">audience</span> <span class=\"w ph\" data-w=\"in this hall\">in this hall</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"has\">has</span> <span class=\"w\" data-w=\"been\">been</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w ph\" data-w=\"tremendously attentive\">tremendously attentive</span> <span class=\"w k\" data-w=\"audience\">audience.</span>"}, {"i": 337, "start": 2416.1, "end": 2420.22, "dur": 4.12, "text": "To join me in thanking Eileen in this wonderful conversation.", "zh": "和我一起感谢Eileen这场精彩的对话。", "clip": "clips/337.mp4", "html": "<span class=\"w\" data-w=\"to\">To</span> <span class=\"w ph\" data-w=\"join me in thanking\">join me in thanking</span> <span class=\"w\" data-w=\"eileen\">Eileen</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"this\">this</span> <span class=\"w\" data-w=\"wonderful\">wonderful</span> <span class=\"w\" data-w=\"conversation\">conversation.</span>"}, {"i": 338, "start": 2431.18, "end": 2433.34, "dur": 2.16, "text": "You've got a little fan there.", "zh": "你那儿有个小粉丝。", "clip": "clips/338.mp4", "html": "<span class=\"w\" data-w=\"you
