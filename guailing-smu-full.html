<style>
:root{

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;width:100%;overflow-x:hidden}
body{
  background:var(--bg);color:var(--fg);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  overscroll-behavior:none;
}
header{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
header a.t{font-size:13px;color:var(--dim);flex:1 1 auto;min-width:0;text-decoration:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header a.t:active{color:var(--fg)}
header button{
  flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--fg);
  border-radius:8px;padding:7px 10px;font-size:13px;white-space:nowrap;
}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 8px;min-height:0}
#idx{font-size:12px;letter-spacing:.1em;color:var(--accent);margin-bottom:12px}
#cue{
  font-size:clamp(21px,6vw,32px);line-height:1.55;font-weight:500;
  overflow-wrap:anywhere;
}
/* rough order matters: .k (candidate) < .ph (chunk) < .on (she marked it) */
.w{display:inline}
.w.ph{border-bottom:2px dashed rgba(201,162,39,.42)}
.w.k{color:#9fd6d0;border-bottom:1px dotted rgba(159,214,208,.45)}
.w.on{color:var(--mark);font-weight:600;border-bottom:2px solid var(--mark)}
#hint{margin-top:14px;font-size:12px;color:#5c6169;line-height:1.7}
#vid{display:none;width:calc(100% - 36px);margin:10px 18px 0;border-radius:12px;background:#000;
  aspect-ratio:16/9;object-fit:cover}
#vfull{display:none;margin:6px 18px 0;text-align:right;font-size:12.5px;color:#7f868f}
#zhbox{margin:14px 18px 0;padding:11px 13px;border:1px dashed var(--line);border-radius:10px;cursor:pointer}
#zhbox .zhlbl{display:block;font-size:11.5px;letter-spacing:.06em;color:#7f868f;margin-bottom:5px}
#zhbox .zhtext{display:block;font-size:15.5px;line-height:1.6;color:#d7dae0}
#zhbox.masked .zhtext{filter:blur(6.5px);opacity:.55;-webkit-user-select:none;user-select:none}
#zhbox:not(.masked) .zhlbl{color:#8fd3c7}
#zhbox:not(.masked) .zhlbl::after{content:"（点一下收起）"}
#neigh{margin-top:20px;font-size:15px;line-height:1.6;color:var(--dim);overflow-wrap:anywhere}
#neigh .lbl{font-size:11px;letter-spacing:.1em;color:#5c6169;display:block;margin:14px 0 3px}
#neigh .p{opacity:.6}
#flash{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.88);padding:18px 26px;border-radius:16px;
  font-size:19px;display:none;text-align:center;z-index:40;white-space:nowrap;
}
footer{
  flex:0 0 auto;border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);
}
.row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.row+.row{margin-top:8px}
button.b{
  flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--fg);
  border-radius:12px;padding:14px 6px;font-size:16px;font-weight:500;
  min-height:52px;display:flex;align-items:center;justify-content:center;gap:5px;
  white-space:nowrap;
}
button.b:active{background:#25282d}
button.b.pri{background:var(--accent);color:#161616;border-color:var(--accent);font-weight:600}
button.b.on{background:rgba(201,162,39,.20);border-color:var(--accent);color:var(--accent)}
button.b:disabled{opacity:.32}
#list,#words{display:none;position:fixed;inset:0;background:var(--bg);overflow-y:auto;
  -webkit-overflow-scrolling:touch;padding:calc(12px + env(safe-area-inset-top)) 0 40px}
#list{z-index:50} #words{z-index:55}
#list .hdr,#words .hdr{display:flex;align-items:center;gap:10px;padding:0 14px 12px;
  position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line)}
#list .hdr button,#words .hdr button{background:none;border:1px solid var(--line);color:var(--fg);
  border-radius:8px;padding:8px 12px;font-size:14px}
#list ol{list-style:none;margin:0;padding:0}
#list li{padding:12px 16px;border-bottom:1px solid #1e2024;font-size:17px;line-height:1.55}
#toc{padding:6px 12px 4px}
#toc .ch{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0;
  color:var(--fg);font-size:15.5px;line-height:1.45}
#toc .ch .tt{color:#e8c46a;font-variant-numeric:tabular-nums;font-size:12.5px;margin-right:8px}
#toc .ch .tn{color:#5c6169;font-size:12px;margin-left:6px}
#toc .ch.cur{border-color:#c9a227;background:rgba(201,162,39,.10)}
.sectlbl{padding:16px 16px 4px;font-size:12px;letter-spacing:.08em;color:#5c6169}
#list li .ts{display:block;font-size:11px;color:#5c6169;font-variant-numeric:tabular-nums;margin-bottom:3px}
#list li.cur{background:rgba(201,162,39,.10)}
#wlist{padding:12px 16px;font-size:19px;line-height:1.6}
#wlist .wd{padding:11px 2px;border-bottom:1px solid #1e2024}
#wlist .wd b{display:block;color:#e8c46a;font-size:15px}
#wlist .wd span{display:block;margin-top:3px;font-size:13.5px;line-height:1.5;color:#aab0b8}
#wlist .wd .cnt{color:#7f868f;font-size:12px;margin-top:4px}
</style>
</head>

</span> <span class=\"w ph\" data-w=\"thank you for\">thank you for</span> <span class=\"w\" data-w=\"choosing\">choosing</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"spend\">spend</span> <span class=\"w\" data-w=\"time\">time</span> <span class=\"w\" data-w=\"here\">here</span> <span class=\"w\" data-w=\"at\">at</span> <span class=\"w\" data-w=\"smu\">SMU.</span>"}, {"i": 2, "start": 13.97, "end": 20.72, "dur": 6.75, "text": "I know you have many, many engagements and we're delighted more than delighted that you've chosen to spend the time with us. Thank you.", "zh": "我知道你有很多很多安排，你愿意花时间跟我们在一起，我们非常非常高兴。谢谢。", "clip": "clips/002.mp4", "html": "<span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"know\">know</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w\" data-w=\"many\">many,</span> <span class=\"w\" data-w=\"many\">many</span> <span class=\"w k\" data-w=\"engagements\">engagements</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"we&#x27;re\">we&#x27;re</span> <span class=\"w k\" data-w=\"delighted\">delighted</span> <span class=\"w ph\" data-w=\"more than delighted\">more than delighted</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"you&#x27;ve\">you&#x27;ve</span> <span class=\"w\" data-w=\"chosen\">chosen</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"spend the time\">spend the time</span> <span class=\"w\" data-w=\"with\">with</span> <span class=\"w\" data-w=\"us\">us.</span> <span class=\"w\" data-w=\"thank\">Thank</span> <span class=\"w\" data-w=\"you\">you.</span>"}, {"i": 3, "start": 21.0, "end": 28.26, "dur": 7.26, "text": "I believe that this is not your first time in Singapore, but you were perhaps a little bit younger when you were first here.", "zh": "我记得这不是你第一次来新加坡，不过你第一次来的时候可能还小一点。", "clip": "clips/003.mp4", "html": "<span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"believe\">believe</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"this\">this</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"not\">not</span> <span class=\"w\" data-w=\"your\">your</span> <span class=\"w ph\" data-w=\"first time\">first time</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"singapore\">Singapore,</span> <span class=\"w\" data-w=\"but\">but</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"were\">were</span> <span class=\"w\" data-w=\"perhaps\">perhaps</span> <span class=\"w ph\" data-w=\"a little bit\">a little bit</span> <span class=\"w\" data-w=\"younger\">younger</span> <span class=\"w\" data-w=\"when\">when</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"were\">were</span> <span class=\"w\" data-w=\"first\">first</span> <span class=\"w\" data-w=\"here\">here.</span>"}, {"i": 4, "start": 28.26, "end": 36.87, "dur": 8.61, "text": "And I know that the audience here would love to hear from you, so perhaps I could invite you to say something, say a few words to the audience before we begin.", "zh": "我知道在座的观众都很想听你说话，所以要不先请你跟大家说几句，在我们开始之前。", "clip": "clips/004.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"know\">know</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w k\" data-w=\"audience\">audience</span> <span class=\"w\" data-w=\"here\">here</span> <span class=\"w ph\" data-w=\"would love to\">would love to</span> <span class=\"w\" data-w=\"hear\">hear</span> <span class=\"w\" data-w=\"from\">from</span> <span class=\"w\" data-w=\"you\">you,</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"perhaps\">perhaps</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"could\">could</span> <span class=\"w ph\" data-w=\"invite you to\">invite you to</span> <span class=\"w\" data-w=\"say\">say</span> <span class=\"w\" data-w=\"something\">something,</span> <span class=\"w ph\" data-w=\"say a few words\">say a few words</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w k\" data-w=\"audience\">audience</span> <span class=\"w\" data-w=\"before\">before</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"begin\">begin.</span>"}, {"i": 5, "start": 37.42, "end": 41.79, "dur": 4.37, "text": "Thank you so much for the kind words, Professor Kong, and thank you so much for having me.", "zh": "谢谢Kong教授的美言，也非常感谢你邀请我来。", "clip": "clips/005.mp4", "html": "<span class=\"w ph\" data-w=\"thank you so much\">Thank you so much</span> <span class=\"w\" data-w=\"for\">for</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w ph\" data-w=\"kind words\">kind words,</span> <span class=\"w\" data-w=\"professor\">Professor</span> <span class=\"w\" data-w=\"kong\">Kong,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"thank\">thank</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"much\">much</span> <span class=\"w\" data-w=\"for\">for</span> <span class=\"w ph\" data-w=\"having me\">having me.</span>"}, {"i": 6, "start": 41.79, "end": 48.25, "dur": 6.46, "text": "It's such a joy to be always in an academic institution, like you said in your opening remarks, I think that.", "zh": "能来到学术机构总是很开心，就像你在开场时说的，我觉得。", "clip": "clips/006.mp4", "html": "<span class=\"w\" data-w=\"it&#x27;s\">It&#x27;s</span> <span class=\"w ph\" data-w=\"such a joy\">such a joy</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"always\">always</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"an\">an</span> <span class=\"w ph\" data-w=\"academic institution\">academic institution,</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"said\">said</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"your\">your</span> <span class=\"w ph\" data-w=\"opening remarks\">opening remarks,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"that\">that.</span>"}, {"i": 7, "start": 48.34, "end": 53.45, "dur": 5.11, "text": "Schools are such a microcosm for human flourishing.", "zh": "学校是人类蓬勃发展的一个缩影。", "clip": "clips/007.mp4", "html": "<span class=\"w\" data-w=\"schools\">Schools</span> <span class=\"w\" data-w=\"are\">are</span> <span class=\"w\" data-w=\"such\">such</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w k\" data-w=\"microcosm\">microcosm</span> <span class=\"w\" data-w=\"for\">for</span> <span class=\"w\" data-w=\"human\">human</span> <span class=\"w k\" data-w=\"flourishing\">flourishing.</span>"}, {"i": 8, "start": 53.45, "end": 59.56, "dur": 6.11, "text": "Really is a place where our highest values are realized, and we have the opportunity and the options to become who we want to be.", "zh": "真的是一个实现我们最高价值的地方，我们有机会也有选择去成为自己想成为的人。", "clip": "clips/008.mp4", "html": "<span class=\"w\" data-w=\"really\">Really</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"place\">place</span> <span class=\"w\" data-w=\"where\">where</span> <span class=\"w\" data-w=\"our\">our</span> <span class=\"w ph\" data-w=\"highest values\">highest values</span> <span class=\"w\" data-w=\"are\">are</span> <span class=\"w k\" data-w=\"realized\">realized,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w ph\" data-w=\"the opportunity and the options\">the opportunity and the options</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"become who we want to be\">become who we want to be.</span>"}, {"i": 9, "start": 59.56, "end": 64.66, "dur": 5.1, "text": "To explore the places that we want to learn and the directions we want to expand.", "zh": "去探索我们想学的地方，去拓展我们想发展的方向。", "clip": "clips/009.mp4", "html": "<span class=\"w\" data-w=\"to\">To</span> <span class=\"w k\" data-w=\"explore\">explore</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"places\">places</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w ph\" data-w=\"want to learn\">want to learn</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"directions\">directions</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w ph\" data-w=\"want to expand\">want to expand.</span>"}, {"i": 10, "start": 64.66, "end": 69.66, "dur": 5.0, "text": "I always love speaking at schools and SMU in particular with.", "zh": "我一直很喜欢在学校演讲，尤其是SMU。", "clip": "clips/010.mp4", "html": "<span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"always\">always</span> <span class=\"w ph\" data-w=\"love speaking\">love speaking</span> <span class=\"w\" data-w=\"at\">at</span> <span class=\"w\" data-w=\"schools\">schools</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"smu\">SMU</span> <span class=\"w ph\" data-w=\"in particular\">in particular</span> <span class=\"w\" data-w=\"with\">with.</span>"}, {"i": 11, "start": 69.66, "end": 78.04, "dur": 8.38, "text": "Its value on entrepreneurship and being so future looking, I think, particularly appeals to me, Singapore at large is such a.", "zh": "它对创业精神的重视和面向未来的眼光，我觉得特别吸引我，整个新加坡也是这样一个。", "clip": "clips/011.mp4", "html": "<span class=\"w\" data-w=\"its\">Its</span> <span class=\"w\" data-w=\"value\">value</span> <span class=\"w\" data-w=\"on\">on</span> <span class=\"w k\" data-w=\"entrepreneurship\">entrepreneurship</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"being\">being</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w ph\" data-w=\"future looking\">future looking,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think,</span> <span class=\"w\" data-w=\"particularly\">particularly</span> <span class=\"w ph\" data-w=\"appeals to me\">appeals to me,</span> <span class=\"w\" data-w=\"singapore\">Singapore</span> <span class=\"w ph\" data-w=\"at large\">at large</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"such\">such</span> <span class=\"w\" data-w=\"a\">a.</span>"}, {"i": 12, "start": 78.04, "end": 84.09, "dur": 6.05, "text": "looking place and so far in my short stay here this time, it has been nothing short of incredible.", "zh": "有远见的地方，这次我短暂停留到现在，一切都太不可思议了。", "clip": "clips/012.mp4", "html": "<span class=\"w\" data-w=\"looking\">looking</span> <span class=\"w\" data-w=\"place\">place</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w ph\" data-w=\"so far\">so far</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"my\">my</span> <span class=\"w ph\" data-w=\"short stay\">short stay</span> <span class=\"w\" data-w=\"here\">here</span> <span class=\"w\" data-w=\"this\">this</span> <span class=\"w\" data-w=\"time\">time,</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"has\">has</span> <span class=\"w\" data-w=\"been\">been</span> <span class=\"w ph\" data-w=\"nothing short of\">nothing short of</span> <span class=\"w k\" data-w=\"incredible\">incredible.</span>"}, {"i": 13, "start": 84.09, "end": 91.99, "dur": 7.9, "text": "I look forward to exploring many more times in the future, and I'm really looking forward to our conversation today, That's wonderful.", "zh": "我期待未来能多来几次，也非常期待我们今天的对话，太好了。", "clip": "clips/013.mp4", "html": "<span class=\"w\" data-w=\"i\">I</span> <span class=\"w ph\" data-w=\"look forward to\">look forward to</span> <span class=\"w\" data-w=\"exploring\">exploring</span> <span class=\"w ph\" data-w=\"many more times\">many more times</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"future\">future,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"i&#x27;m\">I&#x27;m</span> <span class=\"w\" data-w=\"really\">really</span> <span class=\"w ph\" data-w=\"looking forward to\">looking forward to</span> <span class=\"w\" data-w=\"our\">our</span> <span class=\"w k\" data-w=\"conversation\">conversation</span> <span class=\"w\" data-w=\"today\">today,</span> <span class=\"w\" data-w=\"that&#x27;s\">That&#x27;s</span> <span class=\"w\" data-w=\"wonderful\">wonderful.</span>"}, {"i": 14, "start": 91.99, "end": 99.06, "dur": 7.07, "text": "You know, there is so much ground we can cover before the event we invited the audience to submit some.", "zh": "你知道，活动之前我们有很多可以聊的，我们邀请观众提交了一些。", "clip": "clips/014.mp4", "html": "<span class=\"w\" data-w=\"you\">You</span> <span class=\"w\" data-w=\"know\">know,</span> <span class=\"w\" data-w=\"there\">there</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w ph\" data-w=\"so much ground\">so much ground</span> <span class=\"w ph\" data-w=\"we can cover\">we can cover</span> <span class=\"w\" data-w=\"before\">before</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"event\">event</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"invited\">invited</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"audience\">audience</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w k\" data-w=\"submit\">submit</span> <span class=\"w\" data-w=\"some\">some.</span>"}, {"i": 15, "start": 99.06, "end": 106.63, "dur": 7.57, "text": "Questions and thoughts they may have. And I will say that we were inundated. There were many, many interesting and interested.", "zh": "问题和想法。我得说我们被淹没了，有很多很多有趣的、感兴趣的。", "clip": "clips/015.mp4", "html": "<span class=\"w\" data-w=\"questions\">Questions</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"thoughts\">thoughts</span> <span class=\"w\" data-w=\"they\">they</span> <span class=\"w\" data-w=\"may\">may</span> <span class=\"w\" data-w=\"have\">have.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w ph\" data-w=\"i will say\">I will say</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"were\">were</span> <span class=\"w k\" data-w=\"inundated\">inundated.</span> <span class=\"w\" data-w=\"there\">There</span> <span class=\"w\" data-w=\"were\">were</span> <span class=\"w\" data-w=\"many\">many,</span> <span class=\"w ph\" data-w=\"many interesting\">many interesting</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"interested\">interested.</span>"}, {"i": 16, "start": 106.63, "end": 115.09, "dur": 8.46, "text": "Interesting questions and interested members of the audience. So I'll do what I can to capture some of it. and apologies to those of you whose questions.", "zh": "有趣的问题和感兴趣的观众。所以我会尽量涵盖一些，也向那些问题。", "clip": "clips/016.mp4", "html": "<span class=\"w\" data-w=\"interesting\">Interesting</span> <span class=\"w\" data-w=\"questions\">questions</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"interested\">interested</span> <span class=\"w\" data-w=\"members\">members</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"audience\">audience.</span> <span class=\"w\" data-w=\"so\">So</span> <span class=\"w\" data-w=\"i&#x27;ll\">I&#x27;ll</span> <span class=\"w ph\" data-w=\"do what i can\">do what I can</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w k\" data-w=\"capture\">capture</span> <span class=\"w ph\" data-w=\"some of it\">some of it.</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w ph\" data-w=\"apologies to those of you\">apologies to those of you</span> <span class=\"w\" data-w=\"whose\">whose</span> <span class=\"w\" data-w=\"questions\">questions.</span>"}, {"i": 17, "start": 115.09, "end": 121.87, "dur": 6.78, "text": "May not be asked today. I thought we might structure the conversation by beginning with perhaps more macro questions.", "zh": "今天可能问不到的人说声抱歉。我想我们可以先聊一些比较宏观的问题。", "clip": "clips/017.mp4", "html": "<span class=\"w\" data-w=\"may\">May</span> <span class=\"w\" data-w=\"not\">not</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"asked\">asked</span> <span class=\"w\" data-w=\"today\">today.</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"thought\">thought</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"might\">might</span> <span class=\"w ph\" data-w=\"structure the conversation\">structure the conversation</span> <span class=\"w\" data-w=\"by\">by</span> <span class=\"w ph\" data-w=\"beginning with\">beginning with</span> <span class=\"w\" data-w=\"perhaps\">perhaps</span> <span class=\"w\" data-w=\"more\">more</span> <span class=\"w ph\" data-w=\"macro questions\">macro questions.</span>"}, {"i": 18, "start": 121.87, "end": 126.88, "dur": 5.01, "text": "And then I know that there is a lot of interest in you as an individual, so I hope you won't mind.", "zh": "然后我知道大家对你个人也很感兴趣，所以希望你不介意。", "clip": "clips/018.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"then\">then</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"know\">know</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"there\">there</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w ph\" data-w=\"a lot of interest\">a lot of interest</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w ph\" data-w=\"as an individual\">as an individual,</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"hope\">hope</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w ph\" data-w=\"won&#x27;t mind\">won&#x27;t mind.</span>"}, {"i": 19, "start": 126.88, "end": 132.32, "dur": 5.44, "text": "That we will progress the conversation towards perhaps more personal dimensions.", "zh": "我们会把对话逐渐引向更个人的层面。", "clip": "clips/019.mp4", "html": "<span class=\"w\" data-w=\"that\">That</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"will\">will</span> <span class=\"w ph\" data-w=\"progress the conversation\">progress the conversation</span> <span class=\"w\" data-w=\"towards\">towards</span> <span class=\"w\" data-w=\"perhaps\">perhaps</span> <span class=\"w\" data-w=\"more\">more</span> <span class=\"w ph\" data-w=\"personal dimensions\">personal dimensions.</span>"}, {"i": 20, "start": 132.32, "end": 139.13, "dur": 6.81, "text": "You know, the university, as I said in my opening remarks, is an institution that cares about human potential.", "zh": "你知道，这所大学，就像我在开场时说的，是一个关心人类潜能的机构。", "clip": "clips/020.mp4", "html": "<span class=\"w\" data-w=\"you\">You</span> <span class=\"w\" data-w=\"know\">know,</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"university\">university,</span> <span class=\"w\" data-w=\"as\">as</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"said\">said</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"my\">my</span> <span class=\"w ph\" data-w=\"opening remarks\">opening remarks,</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"an\">an</span> <span class=\"w k\" data-w=\"institution\">institution</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w ph\" data-w=\"cares about\">cares about</span> <span class=\"w ph\" data-w=\"human potential\">human potential.</span>"}, {"i": 21, "start": 139.13, "end": 144.93, "dur": 5.8, "text": "That really spends the time trying to bring the best out of each individual.", "zh": "真正花时间去激发每个人的最佳状态。", "clip": "clips/021.mp4", "html": "<span class=\"w\" data-w=\"that\">That</span> <span class=\"w\" data-w=\"really\">really</span> <span class=\"w ph\" data-w=\"spends the time\">spends the time</span> <span class=\"w\" data-w=\"trying\">trying</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"bring the best out of\">bring the best out of</span> <span class=\"w ph\" data-w=\"each individual\">each individual.</span>"}, {"i": 22, "start": 145.14, "end": 153.97, "dur": 8.83, "text": "I think it's fair to say that as an individual, you have really epitomized what the flourishing of human potential means.", "zh": "我觉得可以说，作为个人，你真正体现了人类潜能蓬勃发展的意义。", "clip": "clips/022.mp4", "html": "<span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"it&#x27;s\">it&#x27;s</span> <span class=\"w ph\" data-w=\"fair to say\">fair to say</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"as\">as</span> <span class=\"w\" data-w=\"an\">an</span> <span class=\"w\" data-w=\"individual\">individual,</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w\" data-w=\"really\">really</span> <span class=\"w k\" data-w=\"epitomized\">epitomized</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w k\" data-w=\"flourishing\">flourishing</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w ph\" data-w=\"human potential\">human potential</span> <span class=\"w\" data-w=\"means\">means.</span>"}, {"i": 23, "start": 153.97, "end": 162.88, "dur": 8.91, "text": "And you've done that in so many different dimensions, just to mention sport, which we all know about. I watched the videos of you on the ski slopes. and that's just.", "zh": "而且你在很多不同的维度都做到了，就说运动吧，大家都知道。我看了你在滑雪道上的视频，那真是。", "clip": "clips/023.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"you&#x27;ve\">you&#x27;ve</span> <span class=\"w\" data-w=\"done\">done</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w ph\" data-w=\"so many different dimensions\">so many different dimensions,</span> <span class=\"w\" data-w=\"just\">just</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"mention\">mention</span> <span class=\"w\" data-w=\"sport\">sport,</span> <span class=\"w\" data-w=\"which\">which</span> <span class=\"w ph\" data-w=\"we all know\">we all know</span> <span class=\"w\" data-w=\"about\">about.</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"watched\">watched</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"videos\">videos</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"on\">on</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w ph\" data-w=\"ski slopes\">ski slopes.</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"that&#x27;s\">that&#x27;s</span> <span class=\"w\" data-w=\"just\">just.</span>"}, {"i": 24, "start": 162.88, "end": 169.27, "dur": 6.39, "text": "So amazing. but you've also excelled in so many other dimensions, including in university.", "zh": "太惊人了。但你在很多其他方面也很出色，包括在大学里。", "clip": "clips/024.mp4", "html": "<span class=\"w ph\" data-w=\"so amazing\">So amazing.</span> <span class=\"w\" data-w=\"but\">but</span> <span class=\"w\" data-w=\"you&#x27;ve\">you&#x27;ve</span> <span class=\"w\" data-w=\"also\">also</span> <span class=\"w ph\" data-w=\"excelled in\">excelled in</span> <span class=\"w ph\" data-w=\"so many other\">so many other</span> <span class=\"w k\" data-w=\"dimensions\">dimensions,</span> <span class=\"w\" data-w=\"including\">including</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"university\">university.</span>"}, {"i": 25, "start": 170.2, "end": 176.18, "dur": 5.98, "text": "In sport, we know what it means to train oneself, to push oneself physically.", "zh": "在运动里，我们知道训练自己、在身体上推动自己意味着什么。", "clip": "clips/025.mp4", "html": "<span class=\"w\" data-w=\"in\">In</span> <span class=\"w\" data-w=\"sport\">sport,</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"know\">know</span> <span class=\"w ph\" data-w=\"what it means\">what it means</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"train oneself\">train oneself,</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"push oneself\">push oneself</span> <span class=\"w\" data-w=\"physically\">physically.</span>"}, {"i": 26, "start": 176.26, "end": 182.57, "dur": 6.31, "text": "But you've also talked about the possibility of training the mind. And you talked about.", "zh": "但你也谈到了训练心智的可能性。你谈到了。", "clip": "clips/026.mp4", "html": "<span class=\"w\" data-w=\"but\">But</span> <span class=\"w\" data-w=\"you&#x27;ve\">you&#x27;ve</span> <span class=\"w\" data-w=\"also\">also</span> <span class=\"w ph\" data-w=\"talked about\">talked about</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w ph\" data-w=\"possibility of\">possibility of</span> <span class=\"w ph\" data-w=\"training the mind\">training the mind.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"talked\">talked</span> <span class=\"w\" data-w=\"about\">about.</span>"}, {"i": 27, "start": 182.57, "end": 186.25, "dur": 3.68, "text": "Neuroplasticity and how we can better ourselves.", "zh": "神经可塑性，以及我们如何提升自己。", "clip": "clips/027.mp4", "html": "<span class=\"w k\" data-w=\"neuroplasticity\">Neuroplasticity</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"how\">how</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w ph\" data-w=\"better ourselves\">better ourselves.</span>"}, {"i": 28, "start": 186.99, "end": 195.07, "dur": 8.08, "text": "Perhaps you could speak to this question, because I know there's a lot of interest in the audience on this. What is that training of the mind.", "zh": "也许你可以谈谈这个问题，因为我知道观众对此很感兴趣。训练心智到底是什么。", "clip": "clips/028.mp4", "html": "<span class=\"w\" data-w=\"perhaps\">Perhaps</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"could\">could</span> <span class=\"w ph\" data-w=\"speak to this question\">speak to this question,</span> <span class=\"w\" data-w=\"because\">because</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"know\">know</span> <span class=\"w\" data-w=\"there&#x27;s\">there&#x27;s</span> <span class=\"w ph\" data-w=\"a lot of interest\">a lot of interest</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"audience\">audience</span> <span class=\"w\" data-w=\"on\">on</span> <span class=\"w\" data-w=\"this\">this.</span> <span class=\"w\" data-w=\"what\">What</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w ph\" data-w=\"training of the mind\">training of the mind.</span>"}, {"i": 29, "start": 195.34, "end": 201.87, "dur": 6.53, "text": "Stretching our neuroplasticity look like an everyday life for any individual out here.", "zh": "拓展我们的神经可塑性，对这里的任何人来说，在日常生活中是什么样子。", "clip": "clips/029.mp4", "html": "<span class=\"w k\" data-w=\"stretching\">Stretching</span> <span class=\"w\" data-w=\"our\">our</span> <span class=\"w k\" data-w=\"neuroplasticity\">neuroplasticity</span> <span class=\"w ph\" data-w=\"look like\">look like</span> <span class=\"w\" data-w=\"an\">an</span> <span class=\"w ph\" data-w=\"everyday life\">everyday life</span> <span class=\"w\" data-w=\"for\">for</span> <span class=\"w\" data-w=\"any\">any</span> <span class=\"w\" data-w=\"individual\">individual</span> <span class=\"w ph\" data-w=\"out here\">out here.</span>"}, {"i": 30, "start": 203.9, "end": 210.76, "dur": 6.86, "text": "Wow, starting easy Sure, think.", "zh": "哇，从简单的开始，当然，我想。", "clip": "clips/030.mp4", "html": "<span class=\"w\" data-w=\"wow\">Wow,</span> <span class=\"w ph\" data-w=\"starting easy\">starting easy</span> <span class=\"w\" data-w=\"sure\">Sure,</span> <span class=\"w\" data-w=\"think\">think.</span>"}, {"i": 31, "start": 211.21, "end": 216.04, "dur": 4.83, "text": "Look, I'm no expert, I think for me personally, it just comes to observation.", "zh": "你看，我不是专家，对我来说，就是观察。", "clip": "clips/031.mp4", "html": "<span class=\"w\" data-w=\"look\">Look,</span> <span class=\"w\" data-w=\"i&#x27;m\">I&#x27;m</span> <span class=\"w ph\" data-w=\"no expert\">no expert,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w ph\" data-w=\"for me personally\">for me personally,</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"just\">just</span> <span class=\"w ph\" data-w=\"comes to observation\">comes to observation.</span>"}, {"i": 32, "start": 216.04, "end": 222.08, "dur": 6.04, "text": "I try to be humble when it comes to my own mind and I don't pretend that I know all the answers.", "zh": "我尽量对自己的头脑保持谦逊，我不假装知道所有答案。", "clip": "clips/032.mp4", "html": "<span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"try\">try</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w k\" data-w=\"humble\">humble</span> <span class=\"w ph\" data-w=\"when it comes to\">when it comes to</span> <span class=\"w ph\" data-w=\"my own mind\">my own mind</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"don&#x27;t\">don&#x27;t</span> <span class=\"w k\" data-w=\"pretend\">pretend</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"know\">know</span> <span class=\"w ph\" data-w=\"all the answers\">all the answers.</span>"}, {"i": 33, "start": 222.08, "end": 228.38, "dur": 6.3, "text": "Because I don't and because I'm 23 and because I'm learning and pretty much everything that I'm doing is.", "zh": "因为我不知道，因为我23岁，因为我在学习，我做的几乎每件事都是。", "clip": "clips/033.mp4", "html": "<span class=\"w\" data-w=\"because\">Because</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"don&#x27;t\">don&#x27;t</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"because\">because</span> <span class=\"w\" data-w=\"i&#x27;m\">I&#x27;m</span> <span class=\"w\" data-w=\"\">23</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"because\">because</span> <span class=\"w\" data-w=\"i&#x27;m\">I&#x27;m</span> <span class=\"w\" data-w=\"learning\">learning</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w ph\" data-w=\"pretty much everything\">pretty much everything</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"i&#x27;m\">I&#x27;m</span> <span class=\"w\" data-w=\"doing\">doing</span> <span class=\"w\" data-w=\"is\">is.</span>"}, {"i": 34, "start": 228.38, "end": 236.84, "dur": 8.46, "text": "The first time that I'm experiencing it, right, by definition to progress in the sport of freestyle skiing is to ask your body to do something that it' never done before.", "zh": "我第一次经历，对吧，从定义上讲，在自由式滑雪中进步就是让你的身体做一些它从未做过的事。", "clip": "clips/034.mp4", "html": "<span class=\"w\" data-w=\"the\">The</span> <span class=\"w\" data-w=\"first\">first</spa nd": 249.33, "dur": 5.68, "text": "Boundary that had been set for me before, or it's breaking new ground every time.", "zh": "之前为我设定的边界，或者每次都在开辟新天地。", "clip": "clips/036.mp4", "html": "<span class=\"w k\" data-w=\"boundary\">Boundary</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"had\">had</span> <span class=\"w\" data-w=\"been\">been</span> <span class=\"w ph\" data-w=\"set for me\">set for me</span> <span class=\"w\" data-w=\"before\">before,</span> <span class=\"w\" data-w=\"or\">or</span> <span class=\"w\" data-w=\"it&#x27;s\">it&#x27;s</span> <span class=\"w ph\" data-w=\"breaking new ground\">breaking new ground</span> <span class=\"w\" data-w=\"every\">every</span> <span class=\"w\" data-w=\"time\">time.</span>"}, {"i": 37, "start": 249.42, "end": 254.67, "dur": 5.25, "text": "And so conceptually, I think that familiarizing yourself with discomfort.", "zh": "所以从概念上讲，我觉得让自己熟悉不适感。", "clip": "clips/037.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w k\" data-w=\"conceptually\">conceptually,</span> <span class=\"w ph\" data-w=\"i think that\">I think that</span> <span class=\"w ph\" data-w=\"familiarizing yourself with\">familiarizing yourself with</span> <span class=\"w k\" data-w=\"discomfort\">discomfort.</span>"}, {"i": 38, "start": 254.67, "end": 262.8, "dur": 8.13, "text": "Also knowing that almost every boundary is somewhat plastic so that there always is potential to expand that there always is potential to.", "zh": "也知道几乎每个边界都有点可塑性，所以总有扩展的潜力，总有。", "clip": "clips/038.mp4", "html": "<span class=\"w\" data-w=\"also\">Also</span> <span class=\"w\" data-w=\"knowing\">knowing</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"almost\">almost</span> <span class=\"w\" data-w=\"every\">every</span> <span class=\"w k\" data-w=\"boundary\">boundary</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"somewhat\">so entional\">be very intentional.</span>"}, {"i": 47, "start": 317.49, "end": 324.21, "dur": 6.72, "text": "And conscious about asking ourselves who we are, what we want to do takes something of the individual.", "zh": "有意识地追问自己是谁、想做什么，这需要个人的东西。", "clip": "clips/047.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w k\" data-w=\"conscious\">conscious</span> <span class=\"w\" data-w=\"about\">about</span> <span class=\"w ph\" data-w=\"asking ourselves\">asking ourselves</span> <span class=\"w\" data-w=\"who\">who</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"are\">are,</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"want\">want</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"do\">do</span> <span class=\"w ph\" data-w=\"takes something of\">takes something of</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"individual\">individual.</span>"}, {"i": 48, "start": 325.83, "end": 334.43, "dur": 8.6, "text": "There is no conversation today without two letters of the alphabet. And, yes, I'm talking about AI.", "zh": "现在聊什么都离不开两个字母。对，我说的就是AI。", "clip": "clips/048.mp4", "html": "<span class=\"w\" data-w=\"there\">There</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"no\">no</span> <span class=\"w\" data-w=\"conversation\">conversation</span> <span class=\"w\" data-w=\"today\">today</span> <span class=\"w\" data-w=\"without\">without</span> <span class=\"w ph\" data-w=\"two letters of the alphabet\">two letters of the alphabet.</span> <span class=\"w\" data-w=\"and\">And,</span> <span class=\"w\" data-w=\"yes\">yes,</span> <span class=\"w\" data-w=\"i&#x27;m\">I&#x27;m</span> <span class=\"w ph\" data-w=\"talking about\">talking about</span> <span class=\"w\" data-w=\"ai\">AI.</span>"}, {"i": 49, "start": 335.48, "end": 340.05, "dur": 4.57, "text": "When you think about , "text": "Really prescient about that in order to, I guess, to your point about prompting AI.", "zh": "很有先见之明的东西，为了，我想，回应你说的给AI写提示……", "clip": "clips/058.mp4", "html": "<span class=\"w\" data-w=\"really\">Really</span> <span class=\"w k\" data-w=\"prescient\">prescient</span> <span class=\"w\" data-w=\"about\">about</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w ph\" data-w=\"in order to\">in order to,</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"guess\">guess,</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"your point about\">your point about</span> <span class=\"w ph\" data-w=\"prompting ai\">prompting AI.</span>"}, {"i": 59, "start": 400.42, "end": 402.34, "dur": 1.92, "text": "You have to make it.", "zh": "你得做出……", "clip": "clips/059.mp4", "html": "<span class=\"w\" data-w=\"you\">You</span> <span class=\"w ph\" data-w=\"have to make\">have to make</span> <span class=\"w\" data-w=\"it\">it.</span>"}, {"i": 60, "start": 402.34, "end": 410.58, "dur": 8.24, "text": "Judgment decision at any point, right, And so in order to write a good prompt or to make a good decision from the information that you gather from the prompt.", "zh": "判断、决定，对吧？所以为了写出好的提示，或者根据提示得到的信息做出好的决定……", "clip": "clips/060.mp4", "html": "<span class=\"w k\" data-w=\"judgment\">Judgment</span> <span class=\"w\" data-w=\"decision\">decision</span> <span class=\"w ph\" data-w=\"at any point\">at any point,</span> <span class=\"w\" data-w=\"right\">right,</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w ph\" data-w=\"in order to\">in order to</span> <span class=\"w\" data-w=\"write\">write</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"good\">good</span> <span class=\"w k\" data-w=\"prompt\">prompt</span> <span class=\"w\" data-w=\"or\">or</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"make a good decision\">make a good decision</span> <span class=\"w\" data-w=\"from\">from</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"information\">information</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"gather\">gather</span> <span class=\"w\" data-w=\"from\">from</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w k\" data-w=\"prompt\">prompt.</span>"}, {"i": 61, "start": 410.58, "end": 417.15, "dur": 6.57, "text": "Or to direct an agent, you have to have the ability to start from doubt.", "zh": "或者去指挥一个智能体，你得有能力从怀疑出发。", "clip": "clips/061.mp4", "html": "<span class=\"w\" data-w=\"or\">Or</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"direct\">direct</span> <span class=\"w\" data-w=\"an\">an</span> <span class=\"w\" data-w=\"agent\">agent,</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"ability\">ability</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"start from\">start from</span> <span class=\"w k\" data-w=\"doubt\">doubt.</span>"}, {"i": 62, "start": 417.15, "end": 422.05, "dur": 4.9, "text": "And to start from self informed thinking. And so if anything, I think.", "zh": "从自己 informed 的思考出发。所以要说的话，我觉得……", "clip": "clips/062.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"start\">start</span> <span class=\"w\" data-w=\"from\">from</span> <span class=\"w\" data-w=\"self\">self</span> <span class=\"w k\" data-w=\"informed\">informed</span> <span class=\"w\" data-w=\"thinking\">thinking.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w ph\" data-w=\"if an s</span> <span class=\"w\" data-w=\"possible\">possible.</span>"}, {"i": 79, "start": 532.3, "end": 538.33, "dur": 6.03, "text": "I think that it is the human condition to be curious, and I think it is the human condition to progress.", "zh": "我觉得好奇是人的本性，进步也是人的本性。", "clip": "clips/079.mp4", "html": "<span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w ph\" data-w=\"human condition\">human condition</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w k\" data-w=\"curious\">curious,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"human\">human</span> <span class=\"w\" data-w=\"condition\">condition</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"progress\">progress.</span>"}, {"i": 80, "start": 538.33, "end": 546.93, "dur": 8.6, "text": "And improve. And I think that the methodology of asking questions to do that is fundamentally a positive one, indeed.", "zh": "然后进步。我觉得用提问来做到这一点的方法，从根本上就是积极的。", "clip": "clips/080.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"improve\">improve.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w k\" data-w=\"methodology\">methodology</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w ph\" data-w=\"asking questions\">asking questions</span> <span cla \">so</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"graduated\">graduated</span> <span class=\"w\" data-w=\"or\">or</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w ph\" data-w=\"walked to graduation\">walked to graduation</span> <span class=\"w\" data-w=\"this\">this</span> <span class=\"w\" data-w=\"year\">year</span> <span class=\"w\" data-w=\"in\">in.</span>"}, {"i": 105, "start": 723.78, "end": 731.48, "dur": 7.7, "text": "June for Stanford, and then after graduation, everyone was like, wow, you must have so much free time now that you're out of school.", "zh": "六月在Stanford，毕业后大家都说，哇，你离开学校了，现在肯定有很多空闲时间。", "clip": "clips/105.mp4", "html": "<span class=\"w\" data-w=\"june\">June</span> <span class=\"w\" data-w=\"for\">for</span> <span class=\"w\" data-w=\"stanford\">Stanford,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"then\">then</span> <span class=\"w\" data-w=\"after\">after</span> <span class=\"w\" data-w=\"graduation\">graduation,</span> <span class=\"w\" data-w=\"everyone\">everyone</span> <span class=\"w\" data-w=\"was\">was</span> <span class=\"w\" data-w=\"like\">like,</span> <span class=\"w\" data-w=\"wow\">wow,</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"must\">must</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"much\">much</span> <span class=\"w ph\" data-w=\"free time\">free time</span> <span class=\"w\" data-w=\"now\">now</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"you&#x27;re\">you&#x27;re</span> <span class=\"w ph\" data-w=\"out of school\">out of school.</span>"}, {"i": 106, "start": 731.48, "end": 739.2, "dur": 7.72, "text": "And I find myself busier than ever. I find that my time is more consumed than ever. I am more applied than ever.", "zh": "结果我发现自己比以往更忙。时间比以往更被占满。比以往更投入。", "clip": "clips/106.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"find\">find</span> <span class=\"w\" data-w=\"myself\">myself</span> <span class=\"w ph\" data-w=\"busier than ever\">busier than ever.</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"find\">find</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"my\">my</span> <span class=\"w\" data-w=\"time\">time</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"more\">more</span> <span class=\"w k\" data-w=\"consumed\">consumed</span> <span class=\"w\" data-w=\"than\">than</span> <span class=\"w\" data-w=\"ever\">ever.</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"am\">am</span> <span class=\"w\" data-w=\"more\">more</span> <span class=\"w k\" data-w=\"applied\">applied</span> <span class=\"w\" data-w=\"than\">than</span> <span class=\"w\" data-w=\"ever\">ever.</span>"}, {"i": 107, "start": 739.2, "end": 747.4, "dur": 8.2, "text": "And so the concept of the hedonic treadmill, where we adapt to our circumstances, be it through joy or it be it through work.", "zh": "所以享乐跑步机的概念，就是我们适应自己的处境，不管是快乐还是工作……", "clip": "clips/107.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"concept\">concept</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w ph\" data-w=\"hedonic treadmill\">hedonic treadmill,</span> <span class=\"w\" data-w=\"where\">where</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w ph\" data-w=\"adapt to\">adapt to</span> <span class=\"w\" data-w=\"our\">our</span> <span class=\"w k\" data-w=\"circumstances\">circumstances,</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"through\">through</span> <span class=\"w\" data-w=\"joy\">joy</span> <span class=\"w\" data-w=\"or\">or</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"through\">through</span> <span class=\"w\" data-w=\"work\">work.</span>"}, {"i": 108, "start": 747.4, "end": 756.7, "dur": 9.3, "text": "Through a kind of like a temporal reckoning sense, through all of that, we adapt really quickly, much quicker than I think people expect.", "zh": "通过某种时间感知的方式，通过所有这些，我们适应得很快，比人们预想的快得多。", "clip": "clips/108.mp4", "html": "<span class=\"w\" data-w=\"through\">Through</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"kind\">kind</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w ph\" data-w=\"temporal reckoning\">temporal reckoning</span> <span class=\"w\" data-w=\"sense\">sense,</span> <span class=\"w\" data-w=\"through\">through</span> <span class=\"w\" data-w=\"all\">all</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"that\">that,</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w k\" data-w=\"adapt\">adapt</span> <span class=\"w\" data-w=\"really\">really</span> <span class=\"w\" data-w=\"quickly\">quickly,</span> <span class=\"w\" data-w=\"much\">much</span> <span class=\"w\" data-w=\"quicker\">quicker</span> <span class=\"w\" data-w=\"than\">than</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w\" data-w=\"people\">people</span> <span class=\"w\" data-w=\"expect\">expect.</span>"}, {"i": 109, "start": 756.7, "end": 765.16, "dur": 8.46, "text": "As far as getting used to that pace, I think it's more of like a relative like calibration and less of a like.", "zh": "至于习惯那种节奏，我觉得更多是一种相对的校准，而不是……", "clip": "clips/109.mp4", "html": "<span class=\"w ph\" data-w=\"as far as\">As far as</span> <span cla </span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"frees\">frees</span> <span class=\"w\" data-w=\"skiing\">skiing.</span>"}, {"i": 117, "start": 815.38, "end": 822.73, "dur": 7.35, "text": "Everything is so like the margins are so narrow between absolute success and massive failure.", "zh": "一切都那么……绝对成功和惨败之间的差距太小了。", "clip": "clips/117.mp4", "html": "<span class=\"w\" data-w=\"everything\">Everything</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w k\" data-w=\"margins\">margins</span> <span class=\"w\" data-w=\"are\">are</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w k\" data-w=\"narrow\">narrow</span> <span class=\"w\" data-w=\"between\">between</span> <span class=\"w ph\" data-w=\"absolute success\">absolute success</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w ph\" data-w=\"massive failure\">massive failure.</span>"}, {"i": 118, "start": 822.73, "end": 829.08, "dur": 6.35, "text": "That that judgment decision is absolutely critical. I can be at the top of a run and.", "zh": "那种判断决策绝对关键。我可能站在赛道顶端……", "clip": "clips/118.mp4", "html": "<span class=\"w\" data-w=\"that\">That</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w ph\" data-w=\"judgment decision\">judgment decision</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w k\" data-w=\"absolutely\">absolutely</span> <span class=\"w k\" data-w=\"critical\">critical.</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"can\">can</span> <span class=\"w\" data-w=\"be\">be</span> <span class=\"w ph\" data-w=\"at the top of\">at the top of</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"run\">run</span> <span class=\"w\" data-w=\"and\">and.</span>"}, {"i": 119, "start": 829.08, "end": 836.78, "dur": 7.7, "text": "Youre just feeling /span> <span class=\"w\" data-w=\"of\">of.</span>"}, {"i": 122, "start": 852.94, "end": 861.91, "dur": 8.97, "text": "Skiing that I think embodies this, like, you will it into reality, like it only happens because you believe it. And if you don't believe it, it cannot happen.", "zh": "滑雪中我觉得体现了这一点，就像你把它意念成现实，它只因为你相信才发生。如果你不信，它就不可能发生。", "clip": "clips/122.mp4", "html": "<span class=\"w\" data-w=\"skiing\">Skiing</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w ph\" data-w=\"embodies this\">embodies this,</span> <span class=\"w\" data-w=\"like\">like,</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"will\">will</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"into\">into</span> <span class=\"w\" data-w=\"reality\">reality,</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"only\">only</span> <span class=\"w\" data-w=\"happens\">happens</span> <span class=\"w\" data-w=\"because\">because</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"believe\">believe</span> <span class=\"w\" data-w=\"it\">it.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"if\">if</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"don&#x27;t\">don&#x27;t</span> <span class=\"w\" data-w=\"believe\">believe</span> <span class=\"w\" data-w=\"it\">it,</span> <span class=\"w\" data-w=\"it\">it</span> <span class=\"w\" data-w=\"cannot\">cannot</span> <span class=\"w\" data-w=\"happen\">happen.</span>"}, {"i": 123, "start": 861.91, "end": 868.25, "dur": 6.34, "text": "And so that element, I think is fundamentally irreplaceable, so it's like this gut feeling.", "zh": "所以那个元素，我觉得根本上是不可替代的，就像这种直觉。", "clip": "clips/123.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" \" data-w=\"able\">able</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"feel\">feel.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"then\">then</span> <span class=\"w\" data-w=\"also\">also</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w\" data-w=\"lot\">lot</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"time\">time</span> <span class=\"w\" data-w=\"how\">how</span> <span class=\"w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"feel\">feel</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"different\">different</span> <span class=\"w\" data-w=\"than\">than</span> <span class=\"w\" data-w=\"what\">what</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"true\">true.</span>"}, {"i": 137, "start": 965.38, "end": 973.37, "dur": 7.99, "text": "And so kind of like bridging that gap from like an objective perspective through video review is enormously helpful. I would imagine that there's going to be.", "zh": "所以通过视频回放从客观角度弥合这个差距非常有帮助。我想象未来会有。", "clip": "clips/137.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"kind\">kind</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w ph\" data-w=\"bridging that gap\">bridging that gap</span> <span class=\"w\" data-w=\"from\">from</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w\" data-w=\"an\">an</span> <span class=\"w ph\" data-w=\"objective perspective\">objective perspective</span> <span class=\"w\" data-w=\"through\">through</span> <span class=\"w\" data-w=\"video\">video</span> <span class=\"w\" data-w=\"review\">review</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w k\" data-w=\"enormously\">enormously</span> <span class=\"w\" data-w=\"helpful\">helpful. w\" data-w=\"you\">you</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w ph\" data-w=\"forces you to\">forces you to</span> <span class=\"w\" data-w=\"do\">do</span> <span class=\"w\" data-w=\"various\">various</span> <span class=\"w\" data-w=\"things\">things.</span>"}, {"i": 184, "start": 1309.83, "end": 1317.91, "dur": 8.08, "text": "She was in many ways the opposite of that where she just vigorously provided me with freedom and agency and enforced my freedom.", "zh": "她在很多方面恰恰相反，她只是大力给我自由和自主权，并强化我的自由。", "clip": "clips/184.mp4", "html": "<span class=\"w\" data-w=\"she\">She</span> <span class=\"w\" data-w=\"was\">was</span> <span class=\"w ph\" data-w=\"in many ways\">in many ways</span> <span class=\"w ph\" data-w=\"the opposite of\">the opposite of</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"where\">where</span> <span class=\"w\" data-w=\"she\">she</span> <span class=\"w\" data-w=\"just\">just</span> <span class=\"w k\" data-w=\"vigorously\">vigorously</span> <span class=\"w ph\" data-w=\"provided me with\">provided me with</span> <span class=\"w\" data-w=\"freedom\">freedom</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w k\" data-w=\"agency\">agency</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w k\" data-w=\"enforced\">enforced</span> <span class=\"w\" data-w=\"my\">my</span> <span class=\"w\" data-w=\"freedom\">freedom.</span>"}, {"i": 185, "start": 1317.91, "end": 1325.84, "dur": 7.93, "text": "Really intensely. And that was like the effect of her tiger mom. So that was kind of like the parenting thesis. And then as I got older.", "zh": "非常强烈。那就是她虎妈的效果。所以那算是育儿理念。然后随着我长大。", "clip": "clips/185.mp4", "html": "<span class=\"w\" data-w=\"really\">Really</span> <span class=\"w k\" data-w=\"intensely\">intensely.</span> <span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"was\">was</span> <span class=\"w\" data- a-w=\"first time\">first time</span> <span class=\"w\" data-w=\"living\">living,</span> <span class=\"w\" data-w=\"she\">she</span> <span class=\"w\" data-w=\"hasn&#x27;t\">hasn&#x27;t</span> <span class=\"w ph\" data-w=\"worked in\">worked in</span> <span class=\"w\" data-w=\"these\">these</span> <span class=\"w k\" data-w=\"industries\">industries</span> <span class=\"w\" data-w=\"before\">before.</span>"}, {"i": 190, "start": 1349.0, "end": 1356.67, "dur": 7.67, "text": "And so we're both just figuring it out day by day. We come in with unique perspectives and most importantly, a respect for one another.", "zh": "所以我们俩都只是日复一日地摸索。我们带着独特的视角，最重要的是，相互尊重。", "clip": "clips/190.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"we&#x27;re\">we&#x27;re</span> <span class=\"w\" data-w=\"both\">both</span> <span class=\"w\" data-w=\"just\">just</span> <span class=\"w ph\" data-w=\"figuring it out\">figuring it out</span> <span class=\"w ph\" data-w=\"day by day\">day by day.</span> <span class=\"w\" data-w=\"we\">We</span> <span class=\"w ph\" data-w=\"come in with\">come in with</span> <span class=\"w ph\" data-w=\"unique perspectives\">unique perspectives</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w ph\" data-w=\"most importantly\">most importantly,</span> <span class=\"w\" data-w=\"a\">a</span> <span class=\"w ph\" data-w=\"respect for one another\">respect for one another.</span>"}, {"i": 191, "start": 1356.67, "end": 1363.24, "dur": 6.57, "text": "Dialogue that is respectful, that is critical, that is conducive, that is productive.", "zh": "尊重的对话，批判性的，有益的，富有成效的。", "clip": "clips/191.mp4", "html": "<span class=\"w\" data-w=\"dialogue\">Dialogue</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"respectful\">respectful,</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"critical\">critical,</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w k\" data-w=\"conducive\">conducive,</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"is\">is</span> <span class=\"w\" data-w=\"productive\">productive.</span>"}, {"i": 192, "start": 1363.24, "end": 1371.09, "dur": 7.85, "text": "Oftentimes we will start from kind of two different points where we disagree, and then we will debate, debate, debate, debate, converge.", "zh": "通常我们会从两个不同的点开始，意见不合，然后辩论、辩论、辩论、辩论，趋于一致。", "clip": "clips/192.mp4", "html": "<span class=\"w\" data-w=\"oftentimes\">Oftentimes</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"will\">will</span> <span class=\"w ph\" data-w=\"start from\">start from</span> <span class=\"w\" data-w=\"kind\">kind</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"two\">two</span> <span class=\"w ph\" data-w=\"different points\">different points</span> <span class=\"w\" data-w=\"where\">where</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"disagree\">disagree,</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"then\">then</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"will\">will</span> <span class=\"w k\" data-w=\"debate\">debate,</span> <span class=\"w k\" data-w=\"debate\">debate,</span> <span class=\"w k\" data-w=\"debate\">debate,</span> <span class=\"w k\" data-w=\"debate\">debate,</span> <span class=\"w k\" data-w=\"converge\">converge.</span>"}, {"i": 193, "start": 1371.09, "end": 1379.0, "dur": 7.91, "text": "debate, debate and then end up on opposite ends, so like I will have the opinion that she started with and then she'll have the opinion that I started with.", "zh": "辩论、辩论，最后却到了相反的立场，比如我会持有她开始的看法，而她持有我开始的看法。", "clip": "clips/193.mp4", "html": "<span class=\"w\" data-w=\"debate\">debate,</span> <span class=\"w\" data-w=\"debate\">debate</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"then\">then</span> <span class=\"w\" data-w=\"end\">end</span> <span class=\"w\" data-w=\"up\">up</span> <span class=\"w\" data-w=\"on\">on</span> <span class=\"w ph\" data-w=\"opposite ends\">opposite ends,</span> <span class=\"w\" data-w=\"so\">so</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"will\">will</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w ph\" data-w=\"the opinion that\">the opinion that</span> <span class=\"w\" data-w=\"she\">she</span> <span class=\"w\" data-w=\"started\">started</span> <span class=\"w\" data-w=\"with\">with</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"then\">then</span> <span class=\"w\" data-w=\"she&#x27;ll\">she&#x27;ll</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"opinion\">opinion</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"started\">started</span> <span class=\"w\" data-w=\"with\">with.</span>"}, {"i": 194, "start": 1379.0, "end": 1384.05, "dur": 5.05, "text": "And then we will have to repeat the process where we debate, debate, debate and go back to our original premises.", "zh": "然后我们得重复这个过程，辩论、辩论、辩论，回到我们最初的 premise。", "clip": "clips/194.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"then\">then</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"will\">will</span> <span class=\"w\" data-w=\"have\">have</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"repeat the process\">repeat the process</span> <span class=\"w\" data-w=\"where\">where</span> <span class=\"w\" data-w=\"we\">we</span> <span class=\"w\" data-w=\"debate\">debate,</span> <span class=\"w\" data-w=\"debate\">debate,</span> <span class=\"w\" data-w=\"debate\">debate</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w ph\" data-w=\"go back to\">go back to</span> <span class=\"w\" data-w=\"our\">our</span> <span class=\"w ph\" data-w=\"original premises\">original premises.</span>"}, {"i": 195, "start": 1384.05, "end": 1392.73, "dur": 8.68, "text": "I think if anything that just illustrates that she really gave me the freedom to find out who I am and to really support me.", "zh": "我觉得这恰恰说明她真的给了我自由去发现我是谁，并真正支持我。", "clip": "clips/195.mp4", "html": "<span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"think\">think</span> <span class=\"w ph\" data-w=\"if anything\">if anything</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"just\">just</span> <span class=\"w k\" data-w=\"illustrates\">illustrates</span> <span class=\"w\" data-w=\"that\">that</span> <span class=\"w\" data-w=\"she\">she</span> <span class=\"w\" data-w=\"really\">really</span> <span class=\"w\" data-w=\"gave\">gave</span> <span class=\"w\" data-w=\"me\">me</span> <span class=\"w\" data-w=\"the\">the</span> <span class=\"w\" data-w=\"freedom\">freedom</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w ph\" data-w=\"find out who i am\">find out who I am</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"really\">really</span> <span class=\"w\" data-w=\"support\">support</span> <span class=\"w\" data-w=\"me\">me.</span>"}, {"i": 196, "start": 1392.73, "end": 1398.74, "dur": 6.01, "text": "And to guide me in ways that make sense, and at the same time to grow beside me.", "zh": "以合理的方式引导我，同时在我身边成长。", "clip": "clips/196.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w k\" data-w=\"guide\">guide</span> <span class=\"w\" data-w=\"me\">me</span> <span class=\" to adulthood\">come into adulthood,</span> <span class=\"w\" data-w=\"or\">or</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"guess\">guess</span> <span class=\"w\" data-w=\"as\">as</span> <span class=\"w\" data-w=\"i\">I</span> <span class=\"w\" data-w=\"am\">am</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w k\" data-w=\"adulthood\">adulthood.</span>"}, {"i": 199, "start": 1411.88, "end": 1419.89, "dur": 8.01, "text": "And she continues in adulthood, but kind of like growing together and there's something really exciting and really fun about that.", "zh": "她继续在成年，但一起成长，这真的令人兴奋又有趣。", "clip": "clips/199.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"she\">she</span> <span class=\"w k\" data-w=\"continues\">continues</span> <span class=\"w\" data-w=\"in\">in</span> <span class=\"w\" data-w=\"adulthood\">adulthood,</span> <span class=\"w\" data-w=\"but\">but</span> <span class=\"w\" data-w=\"kind\">kind</span> <span class=\"w\" data-w=\"of\">of</span> <span class=\"w\" data-w=\"like\">like</span> <span class=\"w ph\" data-w=\"growing together\">growing together</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"there&#x27;s\">there&#x27;s</span> <span class=\"w ph\" data-w=\"something really exciting\">something really exciting</span> <span class=\"w\" data-w=\"and\">and</span> <span class=\"w\" data-w=\"really\">really</span> <span class=\"w\" data-w=\"fun\">fun</span> <span class=\"w\" data-w=\"about\">about</span> <span class=\"w\" data-w=\"that\">that.</span>"}, {"i": 200, "start": 1419.89, "end": 1425.02, "dur": 5.13, "text": "And to do it with my mom, who's someone who I trust entirely, who's known me my whole life.", "zh": "而且能和我妈一起做，她是我完全信任的人，从小到大都了解我。", "clip": "clips/200.mp4", "html": "<span class=\"w\" data-w=\"and\">And</span> <span class=\"w\" data-w=\"to\">to</span> <span class=\"w\" data-w=\"do\">do</span> <span class=\"w\" data-w=\"it\">it</span
