const OUTLINE = [{"i": 0, "title": "开场与欢迎致辞"}, {"i": 5, "title": "对学术环境的珍视"}, {"i": 14, "title": "对话结构与问题征集"}, {"i": 20, "title": "人类潜能的典范"}, {"i": 25, "title": "心智训练与神经可塑性"}, {"i": 37, "title": "熟悉不适与自我观察"}, {"i": 48, "title": "AI与人类自主性"}, {"i": 56, "title": "笛卡尔式怀疑与提问"}, {"i": 68, "title": "滑雪气垫与技术进步"}, {"i": 79, "title": "好奇心驱动人类进步"}, {"i": 85, "title": "自我认知不可委托"}, {"i": 96, "title": "学习中的挣扎与节奏"}, {"i": 111, "title": "科技与人类潜能的界限"}, {"i": 123, "title": "直觉与自我亲密感"}, {"i": 132, "title": "视频回放与未来训练"}, {"i": 143, "title": "天赋与努力的辩证"}, {"i": 160, "title": "母亲作为联合创始人"}, {"i": 172, "title": "母亲的教育哲学"}, {"i": 186, "title": "母女合伙关系"}, {"i": 201, "title": "支持体系与个人潜能"}, {"i": 208, "title": "可迁移技能与自我认知"}, {"i": 231, "title": "生态系统的核心要素"}, {"i": 251, "title": "女性领导力与倡导者"}, {"i": 259, "title": "滑雪队中的归属感"}, {"i": 277, "title": "竞争的真谛"}, {"i": 284, "title": "建立自信与创造自己的池塘"}, {"i": 293, "title": "女性机遇与竞争观念"}, {"i": 302, "title": "健康竞争与独特价值"}, {"i": 312, "title": "向未来自己提问"}, {"i": 319, "title": "努力与方向的选择"}, {"i": 325, "title": "总结与致谢"}] || [];       // [{i, title}] 主题大纲，i = 该章第一句
const VOCAB = {"sought after": 1, "plasticity": 1, "engagements": 1, "opening remarks": 1, "microcosm": 1} || {};         // 跨材料的生词本：词 -> 出现过几篇材料
const MATERIAL = "谷爱凌 · SMU 对谈（完整 41 分钟）";
const KEY = "shadowing-v2";            // 固定：所有跟读页共用一份 localStorage
const RATES = [0.6, 0.75, 0.9, 1.0];

const au = document.getElementById('au');
const cue = document.getElementById('cue');
const idxEl = document.getElementById('idx');
const flash = document.getElementById('flash');
const scroll = document.getElementById('scroll');
let cur = 0, loop = false, shadowing = false, rate = 1, timer = null, raf = null, tickEnd = 0;

const LS = {
  get(k, d){ try { const v = localStorage.getItem(KEY + ':' + k); return v === null ? d : JSON.parse(v) } catch(e){ return d } },
  set(k, v){ try { localStorage.setItem(KEY + ':' + k, JSON.stringify(v)) } catch(e){} }
};

function say(t){ flash.textContent = t; flash.style.display = 'block' }
function unsay(){ flash.style.display = 'none' }
function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;') }

/* ---- audio: base64 -> Blob URL. iOS Safari will not seek a data: URI ---- */
(function initAudio(){
  au.src = 'guailing-smu-full.mp3';
  au.load();
})();
au.addEventListener('error', () => say('音频加载失败'));

/* ---- marked words / chunks ---- */
/* 把旧版按材料分开存的标记（<标题>:marks）并进共用生词本，别丢了她已经标过的词 */
(function migrateOldMarks(){
  try {
    const seen = [];
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && k !== KEY + ':marks' && /:marks$/.test(k)){
        try { (JSON.parse(localStorage.getItem(k)) || []).forEach(w => seen.push(w)) } catch(e){}
      }
    }
    if (!seen.length) return;
    const cur = new Set(LS.get('marks', []));
    seen.forEach(w => { if (w) cur.add(w) });
    LS.set('marks', Array.from(cur));
  } catch(e){}
})();

const marks = new Set(Object.keys(VOCAB).concat(LS.get('marks', [])));

function htmlOf(s){
  // build_page.py 已经把词和语块包好了；万一没有就退回逐词包
  if (s.html) return s.html;
  return String(s.text).split(/(\s+)/).map(tok =>
    /^\s*$/.test(tok) ? tok
      : '<span class="w" data-w="' + tok.toLowerCase().replace(/[^a-z']/g, '') + '">' + esc(tok) + '</span>').join('');
}

function toggleMark(k, on){
  if (!k) return;
  if (on === undefined) on = !marks.has(k);
  if (on) marks.add(k); else marks.delete(k);
  LS.set('marks', Array.from(marks));
  syncTerm(k, on);
  paintAll();
}

/* 写回 Mac 上的共用生词本；离线/存到手机时静默失败，不影响本地使用 */
function syncTerm(k, on){
  try {
    fetch('api/mark', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ term: k, on: on, material: MATERIAL })
    }).catch(() => {});
  } catch(e){}
}

function paintAll(){
  document.querySelectorAll('.w').forEach(el => el.classList.toggle('on', marks.has(el.dataset.w)));
  buildWordList();
  paintIdx();
}

function defOf(k){
  if (D[k]) return D[k];
  const parts = String(k).split(/\s+/).map(w => D[w]).filter(Boolean);
  if (parts.length) return { w: k, d: parts.map(p => (p.w || '') + '：' + (p.d || '')).join('　／　') };
  return null;
}

function buildWordList(){
  const box = document.getElementById('wlist');
  const list = Array.from(marks).sort();
  if (!list.length){ box.innerHTML = '<div class="wd"><span>还没有标记的词</span></div>'; return }
  box.innerHTML = list.map(k => {
    const e = defOf(k), times = VOCAB[k] || 0;
    return '<div class="wd" data-w="' + esc(k) + '"><b>' + esc(k) + '</b><span>'
      + esc(e ? e.d : '词典未收录（专有名词／术语）—— 告我一声我手工补上') + '</span>'
      + (times > 1 ? '<div class="cnt">在你 ' + times + ' 篇材料里出现过 —— 高频，优先记</div>' : '')
      + '</div>';
  }).join('');
}

function paintIdx(){
  const s = S[cur];
  idxEl.textContent = '第 ' + (cur + 1) + ' / ' + S.length + ' 句 · ' + s.dur.toFixed(1) + ' 秒'
    + (marks.size ? '  ·  生词本 ' + marks.size + ' 条（点这里看）' : '');
}

/* ---- rendering ---- */
function render(){
  const s = S[cur];
  cue.innerHTML = htmlOf(s);
  const v = document.getElementById('vid');
  if (s.clip){
    v.style.display = 'block';
    document.getElementById('vfull').style.display = 'block';
    if (v.dataset.i !== String(cur)){ v.dataset.i = cur; v.src = s.clip; v.load() }
  } else { v.style.display = 'none'; document.getElementById('vfull').style.display = 'none' }

  const zb = document.getElementById('zhbox');
  if (s.zh){
    zb.style.display = 'block';
    zb.className = 'masked';
    zb.dataset.i = cur;
    zb.querySelector('.zhtext').textContent = s.zh;
  } else { zb.style.display = 'none' }

  document.getElementById('prev').innerHTML = cur > 0 ? htmlOf(S[cur-1]) : '—';
  document.getElementById('next').innerHTML = cur < S.length - 1 ? htmlOf(S[cur+1]) : '—';
  document.getElementById('back').disabled = cur === 0;
  document.getElementById('fwd').disabled = cur === S.length - 1;
  document.querySelectorAll('#ol li').forEach((li, i) => li.classList.toggle('cur', i === cur));
  paintIdx();
  LS.set('pos', cur);
}

/* ---- playback ---- */
function killLoop(){
  clearTimeout(timer); clearInterval(timer);
  if (raf) cancelAnimationFrame(raf);
  raf = null; tickEnd = 0;
}
function playSeg(done){
  const s = S[cur];
  killLoop();
  /* 画面跟音频同步：静音播片段，音频说话。视频播完也停，别让画面自己往下跑 */
  (function(){
    const v = document.getElementById('vid');
    if (!v || !s.clip) return;
    try { v.currentTime = 0 } catch(e){}
    const p = v.play();
    if (p && p.catch) p.catch(() => {});     // iOS 上被拦就安静放弃，音频照常
  })();
  const begin = () => {
    try { au.currentTime = Math.max(0, s.start - 0.15) } catch(e){}
    au.playbackRate = rate;
    const p = au.play();
    if (p && p.catch) p.catch(err => say('播放不了：' + err.message));
    tickEnd = s.end;
    const tick = () => {
      if (au.currentTime >= tickEnd){
        try { au.pause() } catch(e){}
        try { document.getElementById('vid').pause() } catch(e){}
        raf = null; tickEnd = 0;
        if (done) done();
        return;
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  };
  if (au.readyState >= 1 && isFinite(au.duration) && au.duration > 0) begin();
  else {
    au.addEventListener('loadedmetadata', begin, { once: true });
    try { au.load() } catch(e){ say('加载失败：' + e.message) }
  }
}
function goto(i, autoplay){
  if (i < 0 || i >= S.length) return;
  cur = i; render(); scroll.scrollTop = 0;
  if (autoplay){ unsay(); playSeg() }
}

/* ---- controls ---- */
document.getElementById('play').onclick = () => { unsay(); playSeg() };
document.getElementById('back').onclick = () => goto(cur - 1, true);
document.getElementById('fwd').onclick  = () => goto(cur + 1, true);

document.getElementById('loop').onclick = e => {
  loop = !loop; shadowing = false;
  e.currentTarget.classList.toggle('on', loop);
  document.getElementById('shadow').classList.remove('on');
  killLoop(); unsay();
  if (loop){ say('循环这一句'); loopNext() }
};
function loopNext(){
  if (!loop) return;
  playSeg(() => { if (loop) timer = setTimeout(loopNext, 250) });
}

document.getElementById('shadow').onclick = e => {
  shadowing = !shadowing; loop = false;
  e.currentTarget.classList.toggle('on', shadowing);
  document.getElementById('loop').classList.remove('on');
  killLoop(); unsay();
  if (shadowing){
    say('听 · 听完跟着说一遍');
    shadowStep();
  }
};
function shadowStep(){
  if (!shadowing) return;
  playSeg(() => {
    if (!shadowing) return;
    let n = Math.max(2, Math.round(S[cur].dur * 1.15));
    say('该你了 · ' + n + ' 秒');
    timer = setInterval(() => {
      n--;
      if (n <= 0){
        clearInterval(timer); unsay();
        if (shadowing && cur < S.length - 1){ cur++; render(); timer = setTimeout(shadowStep, 300) }
        else { shadowing = false; document.getElementById('shadow').classList.remove('on') }
      } else say('该你了 · ' + n + ' 秒');
    }, 1000);
  });
}

document.getElementById('rate').onclick = e => {
  rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
  e.currentTarget.textContent = '速率 ' + (rate === 1 ? '1×' : rate + '×');
  au.playbackRate = rate;
  LS.set('rate', rate);
};

/* ---- point at a word/chunk: mark it AND show its meaning ---- */
document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('.w,[data-w]');
  if (!el) return;
  const k = el.dataset ? el.dataset.w : null;
  if (!k) return;
  e.preventDefault(); e.stopPropagation();
  toggleMark(k);
  if (!e.target.closest('#wlist')) showDef(k);   // 生词表里点 = 取消标记，不弹卡
}, true);

cue.addEventListener('click', e => {
  if (e.target.closest('.w')) return;
  unsay(); playSeg();
});

/* ---- 释义卡 ---- */
let defTimer = null;
function showDef(k){
  const box = document.getElementById('def');
  const e = defOf(k);
  box.innerHTML = '<div class="dw">' + esc(k) + '</div>'
    + '<div class="dd">' + esc(e ? e.d : '词典未收录（专有名词／术语）—— 告我一声我手工补上') + '</div>'
    + '<button id="dclose">知道了</button>';
  box.style.display = 'block';
  document.getElementById('dclose').onclick = ev => { ev.stopPropagation(); box.style.display = 'none' };
  clearTimeout(defTimer);
  defTimer = setTimeout(() => { box.style.display = 'none' }, 15000);
}
document.addEventListener('click', e => {
  const box = document.getElementById('def');
  if (box.style.display !== 'block') return;
  if (e.target.closest('#def') || e.target.closest('.w')) return;
  box.style.display = 'none';
});

/* ---- panels ---- */
document.getElementById('open').onclick = () => {
  document.querySelectorAll('#ol li').forEach((li, i) => { if (i === cur) li.scrollIntoView({ block: 'center' }) });
  document.getElementById('list').style.display = 'block';
};
document.getElementById('close').onclick = () => document.getElementById('list').style.display = 'none';
document.getElementById('wclose').onclick = () => document.getElementById('words').style.display = 'none';
idxEl.addEventListener('click', () => {
  if (marks.size){ buildWordList(); document.getElementById('words').style.display = 'block' }
});

/* 横屏小视频在竖屏手机里太小 —— 点一下走 iOS 的原生全屏播放器 */
document.getElementById('vfull').onclick = function(){
  const v = document.getElementById('vid');
  if (v.webkitEnterFullscreen) { try { v.webkitEnterFullscreen(); return } catch(e){} }
  if (v.requestFullscreen) { v.requestFullscreen().catch(() => {}); return }
  say('这台设备不支持放大，把手机横过来吧');
};

document.getElementById('zhbox').onclick = function(){
  this.classList.toggle('masked');
};

/* ---- 大纲：按主题跳，343 句不用从上往下翻 ---- */
(function buildToc(){
  if (!OUTLINE.length) { document.getElementById('toc').remove(); return }
  const box = document.getElementById('toc');
  OUTLINE.forEach((c, k) => {
    const b = document.createElement('button');
    b.className = 'ch';
    const end = (k + 1 < OUTLINE.length) ? OUTLINE[k+1].i : S.length;
    b.dataset.from = c.i; b.dataset.to = end;
    b.innerHTML = '<span class="tt">' + fmt(S[c.i].start) + '</span>' + esc(c.title) +
                  '<span class="tn">' + (end - c.i) + ' 句</span>';
    b.onclick = () => {
      document.getElementById('list').style.display = 'none';
      goto(c.i, true);
    };
    box.appendChild(b);
  });
})();

S.forEach((s, i) => {
  const li = document.createElement('li');
  li.innerHTML = '<span class="ts">' + fmt(s.start) + '</span>' + htmlOf(s);
  li.onclick = ev => {
    if (ev.target.closest('.w')) return;
    document.getElementById('list').style.display = 'none'; goto(i, true);
  };
  document.getElementById('ol').appendChild(li);
});
function fmt(t){ const m = Math.floor(t/60), x = Math.floor(t%60); return m + ':' + String(x).padStart(2,'0') }

/* ---- restore ---- */
rate = LS.get('rate', 1);
document.getElementById('rate').textContent = '速率 ' + (rate === 1 ? '1×' : rate + '×');
cur = Math.min(LS.get('pos', 0), S.length - 1);
render();
buildWordList();
</script>
